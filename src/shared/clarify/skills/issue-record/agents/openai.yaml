interface:
  display_name: "问题清单 (Issue Record · 跨阶段共享)"
  short_description: "PM/PRD 的 BLK/RSK/DEC/INF/CLS/OUT 六类，AI 自动登记带来源的 draft/open；业务决定、风险接受和关闭需人工确认。"
  default_prompt: |
    Use the issue-record Skill (shared/clarify/skills/issue-record) to
    centralize every open issue, blocker, risk, and decision-in-waiting.
    When user input or source materials contain 待确认 / UNKNOWN / CONFLICT
    signals, register an evidence-backed ISS-NNN as draft/open before
    continuing to generate any solution. Ask only for business decisions,
    owner confirmation, risk acceptance, or closure.
    Every issue must have category, state, owner, and source.
    Never set the artifact status to `confirmed`; only the goal decision
    owner or business sponsor may do that.

# Agent-facing trigger examples (used by OpenAI / Anthropic Agent runtimes
# during routing).
trigger_examples:
  - |
    Use this Skill whenever any stage encounters evidence-backed PM/PRD
    待确认 / UNKNOWN / CONFLICT markers that need cross-stage tracking.
  - |
    Use this Skill when two sources contradict, when a decision is blocking
    progress, or when a risk needs a named owner and target close date.
  - |
    Use this Skill to surface a previously raised issue for review, status
    update, escalation, or acceptance.

should_not_trigger_examples:
  - |
    Do NOT use this Skill to write requirements, design solutions, or
    draft the PRD. Issue Record lists open problems; it does not solve them.
  - |
    Do NOT use this Skill to silently continue past a 待确认 marker. Register
    a sourced draft/open issue, then ask only for the human decision required.
