interface:
  display_name: "需求发散收敛 (Brainstorming)"
  short_description: "L0 仅想法或材料稀疏时，按 12 维度发散候选、聚类去重、人工四值处置（include/exclude/defer/research），仅 include 项写回 project-background-goal 输入包 / Diverge and converge sparse ideas; only human-included candidates flow into the project-background-goal input package."
  default_prompt: |
    Use the brainstorming Skill to diverge and converge this sparse idea.
    Sweep the 12 scenario dimensions (lifecycle, roles,
    normal/alternate/exception/failure/timeout, permission, data condition,
    handoff, dependency, cancellation, retry, rollback, change-recovery),
    cluster and deduplicate into SCN-XXX candidates, label every candidate
    AI_INFERENCE, and present a disposition table for human
    include/exclude/defer/research decisions. Only included candidates are
    written back to the project-background-goal input package. Never set
    the artifact status to `confirmed`.

# Agent-facing trigger examples (used by OpenAI / Anthropic Agent runtimes
# during routing).
trigger_examples:
  - |
    Use this Skill when the entry router reports L0 (idea only, no source
    materials) or when materials are too thin to form a business baseline:
    a one-line idea without roles, scenes, lifecycle, or alternatives.
  - |
    Use this Skill when the user asks to "发散一下想法 / brainstorm /
    头脑风暴" for a requirement that exists only as an idea or a vague
    sentence.

should_not_trigger_examples:
  - |
    Do NOT use this Skill when sources and roles already exist and the work
    item can enter the stage-1 baseline directly; route to
    project-background-goal. For multi-source ambiguity, route to
    requirement-restate instead.
  - |
    Do NOT use this Skill to decide scope, confirm business facts, or produce
    journey/feature/PRD content. Disposition belongs to the human and only
    `include` candidates flow downstream.
