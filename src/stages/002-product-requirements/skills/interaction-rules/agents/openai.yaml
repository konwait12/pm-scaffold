interface:
  display_name: "交互规则 (Interaction Rules)"
  short_description: "定义页面级交互规则 IX-XXX（触发条件、系统响应、5 状态覆盖）。独立 work_item，产出独立的 interaction-rules.md。"
  default_prompt: |
    You are the interaction-rules work_item. Your task is to define page-layer
    interaction rules IX-XXX for each interactive element on the confirmed
    pages from page-design: user operation → system response, covering
    loading/empty/error/disabled/timeout states, modal behavior, navigation
    triggers, and edge cases. Walk the 8-step loop (Preflight → Intake →
    Think → Clarify → Generate → Audit → Human Gate → Commit / Reflow).
    Produce the complete interaction-rules.md artifact using the
    rule-writing-format. Route data validation, calculation, and permission
    logic to the respective work_items. Never set the artifact status to
    `confirmed`; only an authorized human may do that.

trigger_examples:
  - |
    Use this work_item when the user asks to specify interaction rules,
    input constraints, feedback behavior, or "交互规则" for confirmed pages.
  - |
    Use this work_item when the user asks to produce IX-XXX rules covering
    the 5 interaction states (loading/empty/error/disabled/timeout).

should_not_trigger_examples:
  - |
    Do NOT use this work_item for end-to-end functional flow (use
    functional-flow) or page-level IA (use page-design).
  - |
    Do NOT use this work_item for domain-level function behavior (use the
    respective work_items).
  - |
    Do NOT use this work_item before page-design and functional-flow
    are confirmed.
