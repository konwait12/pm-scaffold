interface:
  display_name: "UX 流程 (UX Flow)"
  short_description: "梳理主路径 + 分支 + 异常回退的端到端 UX 流程图。Sub-skill of product-ux，产出 §3.1/§3.2。"
  default_prompt: |
    Use the ux-flow sub-skill to derive an end-to-end UX flow for each P0
    FEA, including the main path, key branches, error/empty/loading states,
    and exception rollback path. Walk the 8-step loop (Preflight → Intake →
    Think → Clarify → Generate → Audit → Human Gate → Commit / Reflow).
    Output Mermaid flowcharts with entry, steps, decision points, and exit
    states, each traceable to ST-XXX and FEA-XXX. Branch conditions must be
    labeled. Never set the artifact status to `confirmed`.

trigger_examples:
  - |
    Use this sub-skill when the user asks to draw the user flow, page
    sequence, or "UX 流程图" for a feature.
  - |
    Use this sub-skill when reviewing a product-ux artifact that has
    missing or weak UX flow sections.

should_not_trigger_examples:
  - |
    Do NOT use this sub-skill for page layouts (use page-design) or
    interaction rules (use interaction-rules).
  - |
    Do NOT use this sub-skill before user-journey-and-stories is confirmed.
  - |
    Do NOT use this sub-skill for business rules, data validation, or
    permission rules (use function-description).
