iness-requirements/03-user-stories/` | `user-stories`: 用户故事 | ⏸ |\n| `002-product-requirements/01-feature-list/` | `feature-list`: 功能清单 | ⏸ |\n| `002-product-requirements/02-functional-flow/` | `functional-flow`: 功能流程 | ⏸ |\n| `002-product-requirements/05-business-rules/` | `business-rules`: 业务规则 | ⏸ |\n| `002-product-requirements/09-acceptance-criteria/` | `acceptance-criteria`: 验收标准 | ⏸ |\n| `003-prd-output/` | `prd-assembly`: PRD 汇总 | ⏸ |\n| `99-review/` | 评审记录、测试报告 | ⏸ |"}, {"name": "REQ-005-wfj-mpes", "tier": "l2", "files": [{"path": "00-input/SRC-001-wfj-brd.md", "content": "# SRC-001 · WFJ MP \u0026 OAB 改版需求文档\n\n\u003e 来源：飞书 Wiki「WFJ MP \u0026 OAB 改版需求文档」（wiki token `BZjxwTox9iZZ9WkRv4Hc0jxynEc`，解析后 docx token `B0GUde0reooQcbxjK0tctKeCntf`）。\n\u003e 业务线：WFJ（香奈儿尊享腕表与高级珠宝）。项目：MP-E-services（会员小程序 + OAB 服务预约改版）。对接人：业务方对接人 A、业务方对接人 B。\n\u003e 材料为单一 BRD 源（含 UX/UI Figma 链接、交互规则 I-XXX、业务规则 B-XXX、字段表；无独立 UX/运营辅助文档）。\n\u003e 以下为中文整理，忠实于原文，不臆测。版本 V1.2.5（2026-06-02 更新），最新更新 2026-07-30。\n\n## 0. 名词解释\n\n| 术语 / 缩略词 | 说明 |\n|---|---|\n| WFJ | 香奈儿尊享腕表与高级珠宝 |\n| OAB | 服务预约 |\n\n## 1. 业务背景与目标\n\nWFJ 会员小程序（MP）与 OAB 服务预约改版。业务改进方向与优先级：\n1. 优先推进 WFJ 账号关注：增加关注入口在更多页面（PDP 等）的可见度，优化入口显示设计，涵盖主菜单、注册流程、OAB 预约流程等渠道。\n2. 优先推进在线客服优化：提升在线客服在 moodboard 等更多页面的可见度，优化会员小程序中在线客服作为行动按钮的可见性。\n3. 优化 OAB 流程：支持以弹出半屏模式展示 OAB 的客户关系管理系统，将 H5 页面转为原生形式，缩短游客预约流程。\n\n## 2. 功能清单（Function Description）\n\n### 2.1 客户服务 / 在线服务（WFJ-GB-001，Ready to DEV）\n游客与注册用户均可通过「在线服务」功能与客服在线联系。入口位于 My account 页面（游客/登录状态）附近店铺入口下方，面向所有人可见可用。在线聊天直接对接 WFJ campaign 小程序现有 live 800 在线客服解决方案。\n\n### 2.2 WFJ服务号关注卡片（WFJ-GB-002，Ready to DEV）\n游客/注册用户可在 WFJ MP 内通过关注服务号卡片快速关注 WFJ 服务号。卡片位于 My account 页面（游客/登录）底部、注册成功页面、预约成功/详情页面。未关注用户 CTA「即刻关注」跳转服务号主页；已关注用户 CTA「即刻前往」跳转服务号聊天页。服务号根据用户注册状态\u0026是否首次关注推送文本链接/小程序卡片（3 种状态）。\n\n### 2.3 注册 landing 页面和注册成功页面更新（WFJ-GB-003，Ready to DEV）\n注册流程优化：注册 landing 页面（狮头页面）统一改为注册弹窗样式；注册成功页面统一改为新样式，常规/CHANEL\u0026moi 场景注册成功后停留在注册成功页面（原自动回 my account）；OAB 场景按简化注册流程（参考 WFJ-GB-004）。\n\n### 2.4 游客预约 OAB 注册流程简化（WFJ-GB-004，Ready to DEV）\n游客预约 OAB 时，完成注册流程后返回按钮返回 my account page。\n\n### 2.5 创建预约（WFJ-GB-005，Ready to DEV）\n已登录用户在线预约门店服务并创建预约单。核心交互与规则：\n- I01：已注册登录用户点击「服务预约」进入创建预约页；未注册用户进入并看到注册弹窗。\n- I02：页面头部自定义。小程序内入口进入时左上角同时有「返回 icon」+「房子 icon」；小程序外入口进入时只有「房子 icon」。\n- I03：点击 400 电话唤起手机拨号。\n- I04：确认按钮默认置灰，全部必填项填完后变黑可点击。\n- I06：二次确认弹窗（灰色蒙层/✖️/返回关闭；确认提交）。\n- I07：当日已有预约弹窗。\n- I08：该时间段不可预约弹窗（关闭后已填内容置空，服务类型默认）。\n- I09：预约成功页面返回逻辑（按入口区分：非 post 投放→预约列表；POST 投放/小程序外→my account；小程序内→预约列表）；点击精品店名称唤起微信导航。\n- B02：创建预约登录状态校验（已注册进入；游客见注册弹窗，注册成功自动进入创建预约）。\n- B03：服务类型说明——常规类型「探索作品」「售后服务」；特殊类型「作品登记」（仅 CHANEL\u0026moi 服务预约入口进入时可见且排第一）。\n- B04：服务类型-店铺-服务场次关联规则。\n- B05：预约服务提醒静态文案（准时抵达、每人每日仅可预约一次、客服热线 4009-555-888）。\n- B07：提交预约二次确认弹窗文案。\n- B08：预约日期是否已存在预约校验——同一天只能存在一条预约，已存在则失败并弹窗「您在当日已有预约请选择其他日期」。\n- B09：预约场次无名额校验——弹窗「该时段已不可预约请选择其他时间」。\n\n### 2.6 预约通知（WFJ-GB-006，Ready to DEV）\n已预约用户预约单创建成功后接收预约成功通知；预约单即将开始前一天接收预约即将开始通知。\n- B01：预约成功通知——发送对象：关注 WFJ 服务号且创建 OAB 预约的注册会员；创建成功后马上发送；模板含通知标题/预约时间/预约门店/预约项目。预约成功后再关注服务号不补发。\n- B02：预约提醒通知——预约日期 Day-1 天定时 10:00 发送；用户主动取消后不发送；若 FA 提前标记已完成仍会在 Day-1 10:00 发送。\n- B03：查看历史预约通知内容规则（有效预约→详情页；已完成/已出席→预约已失效提示页；已取消→预约已取消提示页）。\n- B04：通知模板字段超 20 个变「...」；同一人推送无次数限制。\n\n### 2.7 查看预约记录列表（WFJ-GB-007，Ready to DEV）\n已预约用户在线查看全部未完成/未到开始时间的服务预约记录。\n- I01：My account 点击我的预约服务——已登录且有未完成预约→预约列表；已登录无未完成预约→创建预约页；未注册→创建预约页并弹注册弹窗。\n- B02：登录状态\u0026预约列表有无数据校验。\n- B03：列表只展示未完成预约记录（开始时间在当前时间之后）；未到开始时间但 FA 标记已完成/已出席→预约已失效页。\n- B04：列表排序——开始时间离当前最近排最前。\n- B05：列表为空→进入创建预约页；最后一条预约被取消→返回 my account。\n- B07：取消预约成功后自动从列表消失；预约抵达开始时间后自动从列表消失（MP 前端判断）。\n\n### 2.8 查看预约记录详情（WFJ-GB-008，Ready to DEV）\n已预约用户在线查看某个服务预约的详情信息。预约详情页与预约成功页是同一个页面。含预约已失效页面。\n\n### 2.9 修改预约（WFJ-GB-009，Ready to DEV）\n已预约用户在线修改未开始的预约单并重新提交。修改预约逻辑与创建预约一致，修改成功后对原记录进行修改。\n\n### 2.10 取消预约（WFJ-GB-010，Ready to DEV）\n已预约用户在线取消未开始的预约单。含二次取消确认弹窗、预约已取消页面、重新预约入口。\n\n### 2.11 WFJ campaign MP 创建预约（WFJ-GB-011）\n用户可在 WFJ campaign 小程序页面通过服务预约功能在当前页面半屏完成创建预约。本次仅针对 store locator 精品店详情页面的服务预约功能支持半屏呼起预约流程。\n\n### 2.12 WFJ MP OAB 历史入口链接替换（WFJ-GB-012）\n用户点击历史已发送 OAB 入口时跳转浏览器过渡页面，进入小程序完成 OAB 预约。OAB category 非 campaign MP / campaign MP 均由 H5 更换为原生小程序，非会员注册流程为简短版。\n\n### 2.13 三级级联选择组件（Ready to DEV）\n### 2.14 Piker-REGION 组件更新（WFJ-PK-001，Ready to DEV）\n所在省/市/区三级级联选择组件，适用于 WFJ MP 整个小程序（注册流程完善个人信息页 + 编辑个人信息页的「所在省/市/区」字段）。弹窗最高高度 488px，自适应；修改第一级清空二三级，修改第二级清空第三级；底部留白 50px。\n\n### 2.15 Piker-DATE（BIRTHDAY）组件更新（WFJ-PK-002，Ready to DEV）\n生日年-月-日三级级联选择组件，适用于注册流程完善个人信息页 + 编辑个人信息页的「生日」字段。\n\n### 2.16 单项选择组件（Ready to DEV）\n### 2.17 Piker-LIST - BOUTIQUE 组件更新（WFJ-PK-003，Ready to DEV）\n「选择店铺」单项选择组件，适用于 WFJ MP OAB 创建预约页面的「选择店铺」字段。\n\n### 2.18 Piker-GENOER 组件更新（WFJ-PK-004，Ready to DEV）\n性别选择组件更新（注册信息「性别」字段由 Gender 变更为 Title）。\n\n### 2.19 微信推文一键拨号功能（Ready to DEV）\nWFJ MP 内增加一个「立即拨号」新页面，支持用户通过微信推文点击一键拨号功能后，打开小程序进入拨号页面时默认唤起拨号弹窗，用户可点击呼叫唤起手机号拨号功能联系客服。目前该页面只有服务号推文跳转过来这个入口。\n\n### 2.20 WFJ服务号菜单栏更新（WFJ-GB-14）\n业务人员可查看 WFJ 服务号通过「会员尊享」和「CHANEL \u0026 moi」菜单入口进入小程序的访问量。两个菜单入口链接替换为带参数版本链接（utm_campaign=wfjAccount 等）。\n\n### 2.21 WFJ Welcome gift（Ready to DEV）\n有 WFJ 购买记录的客人可通过 WFJ MP 申领礼品，每个账户限 1 次。My Account 页有购买记录且未申领的客人可见「立刻领取」入口；无购买记录/已申领成功不可见。\n\n### 2.22 WFJ Caretips（Ready to DEV）\n有 WFJ 购买消费记录的客人可通过 WFJ MP 查看对应的保养建议服务。两个入口：My Account Page（仅对有消费记录客人可见）+ Moi 板块（对所有用户开放）。内容按品类分「腕表」「高级珠宝」两个 Tab。post 类型分针对性保养指南 + 常规保养指南。\n\n## 3. 三方系统对接需求说明\n\n- Live 800 团队：在线客服在线聊天能力由第三方团队提供解决方案，MP 只提供入口。\n- WFJ campaign 小程序。\n\n## 4. 性能需求说明\n\n参考 FSN MP OAB。\n\n## 5. Data tracking\n\n本次没有 tracking report 需求，根据现在会员小程序埋点要求进行常规埋点：页面 PV/UV、页面按钮点击埋点、各渠道进入服务号人数统计、进入服务号后点击链接数据同步到神策。\n\n## 6. 项目历史文档资料\n\n- 【Chanel OAB 接口切换\u0026功能调整】项目管理\n- 【Chanel WFJ会员小程序原生改版】需求文档\n- 【Chanel OAB 接口切换\u0026功能调整】需求文档\n"}, {"path": "00-input/SRC-002-cpc-cr.md", "content": "# SRC-002 · CPC CR 需求文档\n\n\u003e 来源：飞书文档「CPC CR 需求文档」（docx token `Ui4fd9kn2osw5lxb2ARcm4gonAQ`）。\n\u003e 业务线：FSN / WFJ 双业务线（本文档同时覆盖 FSN MP 与 WFJ MP 的 CPC CR 功能）。项目：CPC CR。\n\u003e 材料为单一 BRD 源（含 UX/UI Figma 链接、交互规则 I-XXX、业务规则 B-XXX）。版本 V1.1（2026-01-15 更新，居住地切换时 consent 置空逻辑）。\n\u003e 以下为中文整理，忠实于原文，不臆测。本文档为「CR 需求」（增量/变更需求）。\n\n## 0. 名词解释\n\n| 术语 / 缩略词 | 说明 |\n|---|---|\n| CBDT | 跨境传输个人信息（Cross-Border Data Transfer）授权 |\n| Consent | 用户同意条款 |\n| CPC | 客户偏好中心（提供 consent 条款 API） |\n| MP | 小程序 |\n\n## 1. 上游协作团队\n\nCPC 团队（提供 consent 条款 API、个人偏好设置页面 iframe）。\n\n## 2. 需求背景\n\nCPC CR 需求，涉及 FSN MP 与 WFJ MP 双业务线。功能上线后不一定马上生效，需要支持配置本次改版内容是否启用。\n\n## 3. WFJ MP 功能详细说明\n\n### 3.1 CBDT recollection 授权（WFJ MP）\n\n对于在「2021-11-01」之前已在微信 H5 注册的客户，用户通过外部入口访问 WFJ MP 时将会弹出 CBDT 授权弹窗，以请求客人的授权。\n- I01：CBDT 弹窗交互——点击「✖️」关闭（视为有效弹出）；点击「香奈儿组织」进入 webview 内嵌页面；点击「隐私政策」进入 webview 内嵌页面；点击「同意并继续」关闭弹窗；点击「拒绝」关闭弹窗。\n- B01：CBDT 授权弹出对象——2021-11-01 之前已在微信 H5 注册的客户（该批次未同意过个人信息跨境授权）。\n- B02：CBDT 弹窗弹出次数——只弹出 1 次（用户级别，不分平台；FSN MP 与 WFJ MP 任一弹过且有效操作后不再弹出）；点击右上角圆圈/直接关闭微信视为无效弹出，再次进入会再弹。\n- B03：CBDT 授权弹出场景——WFJ MP 没有登录概念，已注册用户访问默认登录状态；目标用户通过外部入口进入 WFJ MP 首页页面时直接弹出 CBDT 弹窗。涉及页面：My account page、OAB 预约列表、创建预约页面、CHANEL \u0026 moi 作品登记页面、CHANEL \u0026 moi landing page、CHANEL \u0026 moi 列表页面。\n\n### 3.2 Consent 条款功能优化（WFJ MP）\n\n1. 用户注册时所需选择的 consent 条款从固定写死的静态条款改为动态配置条款选项，文案来源于 CPC 团队提供的 API。\n2. 当客人目前居住地选择韩国且同意 CBDT 时，支持用户勾选同意韩国政策要求的条款内容。\n- I01：本次需求只描述新增内容，其他原有逻辑未发生改变。China CBDT Consent 和 China Data Marketing Consent 非必选；已选条款编辑个人信息页需回显。韩国专属 3 个条款（Korea Terms \u0026 Condition、Korea data collection、Korea international transfer）必填；品牌通讯渠道勾选规则（2 个通讯条款要么都选要么都不选；Korea brand communication 内 5 渠道勾选主条款后至少选一个）。\n- B01：Consent 条款涉及范围——常规场景注册流程 + 编辑个人信息页面；内容全部由静态写死改为动态配置，支持适配韩国政策条款。\n- B02：韩国 consent 条款触发条件——目前居住为韩国且允许 CBDT 时动态显示韩国对应条款。\n- B03：consent 改成动态配置说明——Consent 条款包含：China Privacy Consent、China CBDT Consent、China Data Marketing Consent、Korea Terms \u0026 Condition、Korea data collection、Korea international transfer、Korea brand communication、Korea personal data marketing purpose。\n- B04：韩国专属授权条款必填说明——勾选 CBDT 后韩国专属 3 类条款必填。\n- B05：韩国专属品牌通讯规则——非必填，需同时勾选或同时不勾选。\n- B06：提交注册校验说明——确认按钮置灰状态校验；注册成功后通过 API 把 consent 授权信息同步给 CPC。\n- B07：目前居住地为德国、奥地利的 consent 处理规则——market consent 隐藏不展示。\n- B08：consent 置空规则——目前居住地为韩国时判断 CBDT 状态：CBDT 从已勾选变为未勾选时置空 Data Marketing Consent；其他 CBDT 变化不置空。除韩国之外国家不发生 consent 置空。\n\n### 3.3 支持修改偏好设置，支持管理 CBDT 授权（WFJ MP）\n\n1. 编辑个人信息页面增加 CBDT 条款设置项，支持用户设置 CBDT 授权信息。\n2. 编辑个人信息页面增加偏好设置功能，支持用户设置自己的偏好设置。\n- I01：编辑个人信息页面固定交互（CBDT 与 Data Marketing Consent 非必选；回显；香奈儿组织/隐私政策 webview）。\n- I02：未满足「居住地为韩国且勾选 CBDT」时——点击个人偏好进入个人偏好页面；渠道多选；提交更新偏好；通讯渠道全空时保存后 China Data Marketing Consent 未勾选；勾选任意渠道时保存后 China Data Marketing Consent 未勾选。\n- I03：同时满足「居住地为韩国且勾选 CBDT」时——China Data Marketing Consent 自动消失，展示韩国对应 consent 条款。\n- B01：编辑个人信息页面调整——增加 CBDT 条款选项、增加偏好设置入口、兼容韩国用户。\n- B02：目前居住地、CBDT 条款和 CN mkt communication 条款联动规则（3 种场景）。\n- B03：个人偏好设置页面内容说明——个人偏好设置页面由 CPC 团队实现，通过 iframe 内嵌方式集成在小程序内；偏好更新成功提示/服务暂不可用弹窗由 CPC 实现；信息同步 CPC：用户每次设置/更新通讯渠道后，FSN MP 需获取偏好设置页面每个渠道勾选状态并通过 CPC API 传给 CPC。\n\n## 4. 非功能需求\n\n本次 CPC 功能实现后上线后不一定马上生效，需要支持配置本次改版内容是否启用。\n\n## 5. 埋点\n\n新加的 consent 也需要进行常规数据埋点。\n\n## 6. 项目规划\n\n（项目管理文档见飞书 bitable `Yaiqb5QL9aZYXisWCQvcBfktnyd`）\n"}, {"path": "00-input/SRC-003-wfj-user-manual.md", "content": "# SRC-003 · WFJ MP \u0026 OAB User Manual\n\n\u003e 来源：飞书幻灯片「WFJ MP \u0026 OAB User Manaul」（slides token `NBdcsuUADlxi1zdKYTIciJjDnhg`）。\n\u003e 业务线：WFJ（香奈儿尊享腕表与高级珠宝）。项目：MP-E-services（会员小程序 + OAB 服务预约改版）。\n\u003e 材料为幻灯片（33 页），含用户操作流程、页面截图说明、OAB FAQ、Support Model / SLA。\n\u003e 以下为文本内容整理，忠实于原文，不臆测。图片/截图仅记录其 alt 描述要点，不展开。\n\n## 0. 文档结构\n\n- 01 WFJ MP Account：在线服务、服务号关注卡片、用户注册会员、游客预约 OAB 注册\n- 02 WFJ OAB：创建预约、预约通知、查看预约记录列表/详情、修改预约、取消预约、半屏创建预约\n- 03 Chanel OAB FAQ：常见问题解答（8 条）\n- 04 Support Model：System Support Process、SLA – Incident Matrix and Priority Definition\n\n## 1. WFJ MP Account\n\n### 1.1 在线服务\n\n- 进入会员 MY ACCOUNT 页面（游客 / 已注册）。\n- 点击「在线服务」→ 进入「在线客服服务页面」，可以在线咨询客服。\n\n### 1.2 服务号关注卡片\n\n- 新增服务号关注卡片，出现在：my account（未注册）、my account（已注册）、注册成功页面、预约成功页面。\n- 交互：长按识别二维码 → 点击「香奈儿尊享腕表与高级珠宝」→ 点击「关注服务号」；若已关注则直接进入服务号。\n- 页面：服务号页面、服务号会话页面、长按识别弹窗页面。\n\n### 1.3 用户注册会员（微信授权手机号注册）\n\n- 进入会员 MY ACCOUNT 页面 → 点击「即刻注册」→ 出现注册弹窗，点击「注册」→ 出现隐私保护指引弹窗，点击「同意」→ 选择您想授权的手机号。\n- 触发注册弹窗的场景：游客使用 wishlist、OAB、My account、suggestion board、DP 等都会触发注册弹窗。\n- Step.a 进入注册页面：勾选对应协议（第一个为必选项）→ 点击「确认」（所有必填项非空「确认」键才会从置灰转高亮）→ 进入注册成功页面。\n- Step.b 填写注册信息：填写您的姓名，以及目前居住地。\n- 备注：必填项为非空才能点击确认（以上信息可稍后完善不会影响注册）。\n\n### 1.4 用户注册会员（验证手机号注册）\n\n- 与 1.3 差异：隐私保护指引弹窗点击「拒绝」→ 填写手机号，获取并填写验证码 → 填写姓名与目前居住地。\n\n### 1.5 游客预约 OAB 注册流程（微信授权手机号注册）\n\n- 进入会员 MY ACCOUNT 页面 → 以「我的预约服务」为入口 → 点击「我的预约服务」→ 出现注册弹窗，点击「注册」→ 隐私保护指引弹窗点击「同意」→ 选择您愿意授权的手机号。\n- Step.a 进入注册页面：勾选对应协议（第一个为必选项）→ 点击「确认」→ 进入创建预约页面。\n- Step.b 填写注册信息：填写您的姓名，以及目前居住地。\n\n### 1.6 游客预约 OAB 注册流程（验证手机号注册）\n\n- 差异：隐私保护指引弹窗点击「拒绝」→ 填写手机号，获取并填写验证码 → 填写姓名与目前居住地 → 进入创建预约页面。\n\n## 2. WFJ OAB 用户流程\n\n### 2.1 创建预约\n\n- 前置：请先确认客人是否在 WFJ 微信会员小程序已经完成注册。\n- 进入创建预约页面的入口：我的预约服务（my account）、CHANEL \u0026 moi 服务预约、Moodboard/pdp/plp 服务预约、store locator 服务预约、BRAND ZONE 服务预约、POST 的服务预约二维码等。\n- Step.a 进入创建预约页面并填写信息：点击「预约店铺」→ 选择「服务类型」→ 点击「店铺」查看该服务类型下的可预约精品店（可滑动查看、选择后点击确认）→ 点击「日期与时间」进入选择预约时间页面。\n- Step.b 填写相关信息和确认预约信息：选择具体的日期和时间（备注：若该时间段预约人数已满，时间将会为置灰不可选状态）→ 点击「备注」填写具体需求（非必填）→（若点击 400 号码，将直接唤起手机拨号功能）→ 二次确认预约信息后点击「确认」（只有所有必填项都被填写「确认」键才会从置灰转高亮）→ 进入预约成功页面。\n\n### 2.2 创建预约（CHANEL \u0026 moi）\n\n- 进入 CHANEL \u0026 moi 服务页面 → 创建预约页面。\n- 差异：选择「服务类型」会出现三个服务类型（含腕表登记等）。\n- 其余流程与 2.1 一致。\n\n### 2.3 创建预约（提示）\n\n- 不可预约弹窗：表示您预约的时间段人数满额，点击确认，弹窗消失，停留在创建预约页面，您可重新选择日期。\n- 当日已有预约弹窗：表示您预约的当天已有预约，点击确认，弹窗消失，停留在创建预约页面，您可重新选择日期。\n\n### 2.4 查看预约通知\n\n- 前置：请先确认客人已经预约 OAB 且关注 WFJ 微信服务号。\n- 在预约成功后以及预约前一天会发送通知。\n- 点击服务号发送的预约成功通知 → 查看预约成功页面。\n- 无效预约页面：您可点击「店铺预约」重新创建预约，也可点击 400 号码联系 FA 咨询具体情况。\n- 预约取消页面：您可点击「店铺预约」重新创建预约。\n- 备注：在预约成功后去关注 WFJ 服务号将不会收到通知。\n\n### 2.5 查看预约记录列表\n\n- 前置：请先确认客人已在 WFJ 微信会员小程序注册且有「未完成」的预约。\n- 进入会员 MY ACCOUNT 页面 → 点击「我的预约服务」→ 点击您想查看的预约（预约列表中只会展示未完成的预约记录）→ 进入预约详情页。\n- 出现「预约已失效页面」的原因：您的顾问将您预约状态标记为「已出席/已完成」。\n- 若没有未完成的预约，则在点击我的预约服务后，会直接进入创建预约的页面，流程与创建预约一致。\n\n### 2.6 查看预约记录详情\n\n- 前置：同上。\n- 进入预约详情页，可点击精品店名称 → 查看精品店具体定位（店铺位置页面）。\n\n### 2.7 预约修改\n\n- 前置：请先确认客人已在 WFJ 微信会员小程序注册，并且有「未完成」的预约。\n- 进入会员 MY ACCOUNT 页面 → 点击「我的预约服务」→ 预约列表页面 → 点击您想修改的预约 → 点击「修改预约」→ 修改预约页面。\n- 填写相关信息：选择「服务类型」、选择精品店、选择日期与时间、填写备注（非必填）、400 号码唤起拨号。\n- 确认预约信息：二次确认后点击「确认」→ 进入预约修改成功页面。\n- 提示弹窗：不可预约弹窗 / 当日已有预约弹窗（同 2.3）。\n\n### 2.8 取消预约\n\n- 前置：请先确认客人已在 WFJ 微信会员小程序注册，并且有「未完成」的预约。\n- 进入会员 MY ACCOUNT 页面 → 点击「我的预约服务」→ 预约列表页面 → 点击您想取消的预约 → 点击「取消预约」→ 在您二次确认要取消这次预约后，点击「确认取消」→ 预约取消成功页面。\n\n### 2.9 半屏创建预约\n\n- 前置：请先确认客人已在 WFJ 微信会员小程序注册。\n- 进入会员 MY ACCOUNT 页面 → 点击「附近店铺」→ 点击「店铺详情」→ 点击「预约服务」。\n- 仅针对 store locator 精品店详情页面的服务预约功能。\n- 已注册用户进入 oab-半屏；未注册用户进入 oab-半屏（注册流程见 PPT 第 11 页）。\n\n## 3. Chanel OAB FAQ（常见问题解答）\n\n| 编号 | 问题详情 | 功能设计 | 问题解答方向 |\n|---|---|---|---|\n| 1 | 我应该预约哪个服务类型？ | WFJ\u0026FSN 分别对应不同的服务类型：WFJ 常规入口-探索作品、产品售后；WFJ CHANEL\u0026moi 入口-腕表登记、探索作品、产品售后；FSN 常规入口-造型服务、售后服务 | 当客人咨询时，需要根据客人实际需求推荐具体的服务类型进行到店预约并提醒客人通过正确的预约入口进入 |\n| 2 | 为什么 24 小时以内的时间都是不可以预约的？ | 当前时间至 24 小时内的 timeslot 会默认置灰不可选择 | 已置灰不可选的时间段是当前时间段该店铺已约满，可以建议客人选择其他可选时间 |\n| 3 | 为什么已预约的记录在我到店时消失了？ | 微信端预约列表独立设置，与后台预约单操作互不影响，当进入到预约 timeslot 起始时间，将会自动隐藏不显示 | 当预约列表中的预约记录到达预约的起始时间，将自动隐藏不显示。客人可以咨询店铺确认是否继续服务，或重新预约其他可选时间 |\n| 4 | 为什么已预约的预约记录在修改或取消时显示「您的预约状态已更改...」提示语，并无法修改或取消？ | 当后台提前修改预约单状态为已完成/未出席，微信前端该预约单因未到预约时间，所以不会隐藏。由于预约单状态已在后台更改所以不允许再次进行修改或取消操作 | 店铺在接到预约单时会提前与客户进行联系，如客户线下表达出需要变更时间或临时不能到场的意愿，店铺可以在后台操作协助客户将该预约单状态变更。已变更为已完成/未出席的预约单在微信前端将无法再次进行修改或取消 |\n| 5 | 同一天可以预约多次服务吗？ | 限制同一账号同一天仅可有一条预约记录 | 同一个会员账号同一天仅可以预约到店一次，如有多个服务需求，可以预约不同日期 |\n| 6 | 没有找到 CHANEL\u0026moi 预约服务类型，是已经取消了吗？ | CHANEL\u0026moi OAB 入口与常规 OAB 预约入口是分别不同入口，只有在 CHANEL\u0026moi 入口才显示腕表登记服务类型 | CHANEL\u0026moi OAB 入口与常规 OAB 预约入口是分别不同入口，客人可以通过会员 MY ACCOUNT 页面，点击「我的 CHANEL\u0026moi 服务项目」进入并进行预约 |\n| 7 | 为什么有的店铺只开放了一个预约服务类型/为什么之前预约过的预约服务类型现在找到不到对应的店铺了？ | 不同服务类型可以配置不同店铺列表 | 预约服务类型可以对应不同的店铺列表，店铺是否开放某预约服务类型由店铺决定及操作，并且该调整非永久调整，可随时更改 |\n| 8 | 为什么店铺可预约的日期/营业时间/timeslot 不相同？ | 不同服务类型的店铺 timeslot 由后台进行设置 | 店铺可预约的日期/营业时间/timeslot 由店铺根据实际情况进行设置，客人可以根据需求选择预约 |\n\n## 4. Support Model\n\n### 4.1 System Support Process\n\n- Level 0：WeChat MP \u0026 H5 (external) / User —— 提供在线服务并升级到 level 1。\n- L\u003cL\u003e：CORE (internal) / OAB Web Portal (internal) / CC 2.0 / Project Team —— 提供在线服务与查询收集（CORE \u0026 OAB Portal）、检查信息并升级到 level 2、跟进咨询状态。\n- L\u003cL\u003e：OAB 运维团队 (fsn-oab-support@\u003c业务线\u003e.com) —— 对 CORE OAB 功能与 OAB Portal 排障、判断是否需要 开发团队（脱敏）、必要时指派给第三方集成负责人、需要 CR 流程时升级给产品负责人。\n- L\u003cL\u003e：CDH Dev Team —— 分析根因、提供解决方案、更新系统代码、与 L2 同步发布版本状态。\n- 备注：SN ticket 应用名「OAB Mid-Platform_APAC_CN」；用户有权限但无法连接 APP 时，拨打 IT 热线（8:00~11:00pm *7）。\n\n### 4.2 SLA – Incident Matrix and Priority Definition\n\n| 优先级 | 定义 | 响应/排障时限 |\n|---|---|---|\n| P1 | 主要业务流程对 1+ 精品店或 10+ 用户不可用（如 OAB 任务相关功能），问题可复现 | 7*12（9:00-22:00）；1 小时内响应，4 小时内排障 |\n| P2 | 主要业务流程对少于 10 个用户不可用且可复现；非主要业务流程不可用（含消息通知、摘要邮件）；少于 10 个用户遇系统使用异常（任务分配失败、UI 显示失败、无法接收短信/邮件）且不可复现 | 7*12（9:00-22:00）；2 小时内响应，12 小时内排障 |\n| P3 | API 服务间歇性异常且不可复现；系统性能不受影响但出现系统错误或组件故障，可能造成安全风险 | 中国工作日（9:00-18:00）；8 小时内响应，3 天内排障 |\n| P4 | — | 中国工作日（9:00-18:00）；3 天内响应，7 天内排障 |\n\n- 沟通渠道：App Live Chat、Ticket on Service Portal。\n- 升级路径：10.23–11.22 内部协作群（Hypercare 阶段）；11.23 起邮件 fsn-business-owner@\u003c业务线\u003e.com / fsn-product-owner@\u003c业务线\u003e.com 或 APP Live Chat。\n"}, {"path": "00-input/intake-decision.md", "content": "---\nartifact_id: INTAKE-REQ-005-wfj-mpes\nversion: \"v1\"\nstatus: ready_for_human_review\nprocess_tier: L2\ndifficulty_level: \"medium\"\ntier_recommendation: \"L1\"\ntier_selection: \"人工确认（已选择 L2）\"\ndecision_owner: \"业务方对接人 A（已脱敏；具体见 00-input/authorized-reviewers.json）\"\ndecided_at: \"2026-08-25\"\nsource_materials: \"SRC-001（WFJ BRD V1.2.5 业务线 MP-E-services）+ SRC-002（CPC CR 增量 CBDT/Consent）+ SRC-003（WFJ MP \u0026 OAB User Manual 操作流程与 FAQ）\"\nreview_trigger: \"命中硬升级条件、范围变化或新增 L2-only 能力时复审\"\napplicability_contract_version: \"1\"\nl2_only_pd: \"applicable: WFJ MP 多页面（My account / 注册 / 预约详情 / PDP / 关注卡片）+ OAB 半屏弹出 + 服务号关注卡片布局变化\"\nl2_only_ix: \"applicable: 注册流程优化 + OAB 半屏弹出交互 + 服务号关注卡片 CTA 双态 + Campaign MP 半屏预约\"\nl2_only_vl: \"applicable: 注册表单字段校验 + 预约表单字段校验 + Consent 条款版本校验 + CBDT 授权管理\"\nl2_only_state: \"applicable: OAB 预约全生命周期（创建/查看/修改/取消）+ 服务号关注状态（未关注/已关注/首次关注）\"\nl2_only_ex: \"applicable: OAB 预约失败兜底 + 注册失败回退 + 服务号关注失败回退 + 通知发送失败兜底\"\n---\n\n# 档位决策：REQ-005-wfj-mpes\n\n\u003e 本文件是本 REQ 的唯一档位事实源。README 仅作投影；命令不得用临时参数覆盖此处。\n\u003e 需求难度只是入口建议触发器：低难度不展示档位建议；中/高难度仅展示建议，最终档位必须由人工确认并以 `process_tier` 为准。\n\n## 1. 资格矩阵\n\n| 维度 | L0 资格 | L1 资格 | 本 REQ 证据/结论 |\n|---|---|---|---|\n| 变更范围 | 单一可定位变更 | 单模块标准交付 | **WFJ 业务线跨 MP+OAB+服务号多模块改版**（含 CPC CR 增量），远超单模块 |\n| 角色与流程 | 单角色、无持久状态 | 无 L2-only 能力 | **多角色**（游客/注册用户/客服/FA）+ **OAB 预约全生命周期持久状态** + 5 项 L2-only 全部适用 |\n| 风险 | 无敏感/资金/合规影响 | 五项 L2-only 均有不适用依据 | **5 项 L2-only 全部 applicable**（PD/IX/VL/STATE/EX 详见 §2） |\n| 回退 | 单一简单回退 | 可实施且有边界 | 配置/版本可回退；服务号菜单入口可重新启用；OAB 既有失败语义不变 |\n\n**L2 资格结论**：本 REQ 同时触发 5 项 L2-only 能力，且范围跨 MP+OAB+服务号+CR 增量，必须升级 L2。\n\n## 2. L2-only 能力适用性\n\n逐项填写事实依据；任一项\"适用\"即升级 L2。本 REQ 5 项全部 applicable。\n\n| 能力 | 结论（适用/不适用） | 事实依据 |\n|---|---|---|\n| PD 页面/原型 | **applicable** | SRC-001 涉及 WFJ MP 多个页面（My account、注册成功页、OAB 详情页、PDP 关注入口、Campaign MP 半屏）；新增/调整入口至少 4 处 |\n| IX 交互规则 | **applicable** | SRC-001 §2.1 在线服务入口交互、§2.2 服务号关注卡片 CTA 双态交互（未关注/已关注）、§2.3 注册流程、§2.4 OAB 半屏弹出交互；新增交互模式 ≥ 4 类 |\n| VL 校验规则 | **applicable** | 注册表单字段（手机号/邮箱/密码）、OAB 预约表单字段（门店/时间/服务类型）、Consent 条款版本校验、CBDT 授权状态校验；新增跨字段校验规则 ≥ 5 条 |\n| STATE 状态机 | **applicable** | OAB 预约全生命周期（创建 → 已确认 → 已完成/已取消）；服务号关注状态（未关注 → 已关注 → 首次关注推送后状态）；CR Consent 条款版本状态（生效/历史） |\n| EX 异常处理 | **applicable** | OAB 预约失败兜底（库存/时段冲突/接口异常）、注册失败回退、服务号关注失败回退（API 失败）、通知发送失败兜底（推送服务异常）、CBDT 授权撤回兜底 |\n\n## 3. Canonical PRD 章节适用性矩阵\n\n| 章节 | 状态 | 事实依据 | 来源引用 | 判断人 | 判断时间 | 触发条件 / 当前判断 | 复审触发点 |\n|---|---|---|---|---|---|---|---|\n| §1 项目背景 | required | WFJ MP \u0026 OAB 改版 + CPC CR 增量双业务线背景 | SRC-001 §1 + SRC-002 §1 | PM-Office | 2026-08-25 | 当前判断：必须提供 | 目标或背景变化 |\n| §2 项目范围 | required | 12+ 功能跨 MP/OAB/服务号/CR 4 大模块 | SRC-001 §2.1-2.13 | PM-Office | 2026-08-25 | 当前判断：必须提供 | 范围变化 |\n| §3 用户旅程 | required | 4 类角色（游客/注册用户/客服/FA）跨多入口 | SRC-001 §3 + SRC-003 §2 | PM-Office | 2026-08-25 | 当前判断：必须说明受影响路径 | 角色或路径变化 |\n| §4 用户故事 | required | 12+ 用户故事跨 4 类角色 | SRC-001 §3 + SRC-002 §3 + SRC-003 §3 | PM-Office | 2026-08-25 | 当前判断：必须追溯用户价值 | 角色或目标变化 |\n| §5 功能清单 | required | 12+ 功能（在线服务/关注卡片/注册/OAB 全生命周期/通知/Campaign MP/Picker/一键拨号/服务号菜单/Welcome gift/Caretips/CBDT 授权） | SRC-001 §2 + SRC-002 §2 | PM-Office | 2026-08-25 | 当前判断：必须提供可实施功能 | 功能边界变化 |\n| §6 功能流程 | required | 在线服务/关注卡片/注册/OAB 创建-查看-修改-取消/通知/Campaign MP 半屏等主流程图 | SRC-001 §3 + SRC-003 §2 | PM-Office | 2026-08-25 | 当前判断：必须提供可观察行为 | 入口或分支变化 |\n| §7 原型/UX | required | PD applicable → §7 required；多页面 + 半屏弹出 | SRC-001 §2 + Figma 链接（业务方提供） | PM-Office | 2026-08-25 | 当前判断：L2 §7 必填 | 页面/布局/导航变化 |\n| §8 交互规则 | required | IX applicable → §8 required；CTA 双态、表单输入反馈、半屏弹出行为 | SRC-001 §2.1-2.4 + SRC-002 §2 | PM-Office | 2026-08-25 | 当前判断：L2 §8 必填 | 交互规则变化 |\n| §9 业务规则 | required | 配置权限、预约时段、通知触发、关注推送 | SRC-001 §3 | PM-Office | 2026-08-25 | 当前判断：必须说明流程约束 | 规则或阈值变化 |\n| §9.1 计算与流程规则 | required | L2 默认 required | — | PM-Office | 2026-08-25 | 当前判断：必须提供 | 规则或阈值变化 |\n| §9.2 校验规则 | required | VL applicable → §9.2 required | SRC-001 §3 + SRC-002 §2 | PM-Office | 2026-08-25 | 当前判断：L2 §9.2 必填 | 校验需求变化 |\n| §9.3 状态变化 | required | STATE applicable → §9.3 required | SRC-001 §3 + SRC-002 §2 | PM-Office | 2026-08-25 | 当前判断：L2 §9.3 必填 | 状态模型变化 |\n| §9.4 异常处理 | required | EX applicable → §9.4 required | SRC-001 §3 + SRC-002 §2 + SRC-003 §4 | PM-Office | 2026-08-25 | 当前判断：L2 §9.4 必填 | 新失败语义出现 |\n| §10 验收依据 | required | 10+ AC 跨 4 类角色 | SRC-001 §4 + SRC-003 §4 | PM-Office | 2026-08-25 | 当前判断：必须可判定 | 目标或行为变化 |\n| §11 按需章节 | conditional | 暂无竞品/可行性/术语表独立来源 | SRC-001 + SRC-002 + SRC-003 | PM-Office | 2026-08-25 | 触发条件：新增按需来源；当前判断：仅依赖与待决问题（Q-001~Q-006），无其他按需章节事实 | 新增按需来源 |\n\n## 4. 决策与升级\n\n- 选择档位：`L2`\n- 选择人：`业务方对接人 A（已脱敏；详见 authorized-reviewers.json）`\n- 决策时间：`2026-08-25`\n- 升级理由（如有）：`5 项 L2-only 全部触发（PD/IX/VL/STATE/EX），且跨 MP+OAB+服务号+CR 多业务线，必须升级 L2`\n- 复审触发：范围、角色、状态、数据、合规或回退策略变化时重新评估。"}, {"path": "00-input/source-register.md", "content": "# 来源登记 (Source Register)\n\n\u003e 登记所有原始需求材料。格式: SRC-NNN → 材料位置 / URL / 飞书链接\n\n| 来源 ID | 类型 | 位置 | 摘要 | 登记日期 | 权威范围 |\n|---|---|---|---|---|---|\n| SRC-001 | BRD（飞书 Wiki 改版需求文档） | 飞书「WFJ MP \u0026 OAB 改版需求文档」（wiki `BZjxwTox9iZZ9WkRv4Hc0jxynEc`，docx `B0GUde0reooQcbxjK0tctKeCntf`） | WFJ 会员小程序 + OAB 服务预约改版：在线服务、服务号关注卡片、注册流程优化、创建/查看/修改/取消预约、预约通知、campaign MP 半屏预约、历史入口替换、Picker 组件更新、一键拨号、服务号菜单、Welcome gift、Caretips | 2026-08-14 | 改版功能与规则 |\n| SRC-002 | BRD（飞书 docx CR 需求文档） | 飞书「CPC CR 需求文档」（docx `Ui4fd9kn2osw5lxb2ARcm4gonAQ`） | CPC CR 增量需求（FSN/WFJ 双业务线）：CBDT recollection 授权、Consent 条款动态配置（含韩国条款）、偏好设置与 CBDT 授权管理 | 2026-08-14 | CR 增量功能与规则 |\n| SRC-003 | 用户手册（飞书 slide） | 飞书「WFJ MP \u0026 OAB User Manaul」（slides `NBdcsuUADlxi1zdKYTIciJjDnhg`） | WFJ MP Account 操作流程、OAB 用户流程（创建/查看/修改/取消/通知/半屏）、FAQ、Support Model / SLA | 2026-08-14 | 操作流程与 FAQ 补充信息 |"}, {"path": "001-business-requirements/01-background-goal/background-goal.md", "content": "---\nartifact_id: BG-001\nversion: v0.1\nstatus: confirmed\nquality_contract_version: \"1\"\nowner: PM-Office\nbusiness_fact_owner: 业务方对接人 A（已脱敏；见 00-input/authorized-reviewers.json）\ngoal_decision_owner: 业务方对接人 A（已脱敏；见 00-input/authorized-reviewers.json）\nreviewer: nova\ncreated_at: 2026-08-25\nupdated_at: 2026-08-25\nconfirmed_at: 2026-08-25T02:21:32+00:00\nupstream_artifact_id: \"SRC-001 + SRC-002 + SRC-003（全部 confirmed）\"\n---\n\n# 项目背景与目标\n\n## 产品质量增强记录\n\n| 项目 | 结论 | 知识状态 | 来源/位置 | 判断人 | 复核触发 |\n|---|---|---|---|---|---|\n| 受影响角色与结果 | 4 类角色：游客、注册用户、客服/FA、运营。无 FA / 监管 / 合规角色影响（但 CBDT 涉及韩国合规条款）。 | FACT | SRC-001 §1-§2 + SRC-002 §3.1 B01 + SRC-003 §1 | PM-Office | 新增分群或新角色（如代客预约专员）时升级 L2 |\n| 采用方案与被排除替代 | 采用「MP 多入口打通 + OAB 全生命周期原生化 + 服务号关注卡片 + CPC Consent 动态化」。被排除替代：①维持 H5 + 多个独立入口跳转；②统一收口至单一入口。 | DECISION | SRC-001 §2 + SRC-002 §2 | PM-Office | 出现\"按用户分群差异化引导\"或\"统一收口\"诉求时升级 L2 |\n| 价值-成本-风险 | 价值：注册流程简化、OAB 半屏原生化缩短 30%+ 路径（AI 推断，需数据侧验证）；关注转化率提升（待验证）。成本：MP 4 大模块 + OAB 5 状态 + 服务号 3 处入口改造（共 ≤12 人天）；CPC CR iframe 集成 + 韩国条款动态化（≤2 人天）。风险：CPC API 异常、WeChat H5 → 原生过渡期数据迁移、24h 不可预约硬约束被误触。 | DECISION + AI_INFERENCE（量化数据为推断） | SRC-001 §1-§2 + SRC-002 §2 | PM-Office | 上线后 2 周内采集关注转化率 + 注册完成率 + OAB 预约成功率验证 |\n| 失败边界与回退 | 既有失败语义不变（24h 内不可约、当日已有预约不可约、时段满额不可约）。新增可观察行为：服务号关注卡片双态 CTA、Consent 动态条款、韩国专属条款。本期新增失败路径（CBDT 拒绝 / Consent 校验失败 / OAB 接口超时）有兜底。新增 5 类可观察行为。回退：CPC CR 可配置开关禁用；OAB 半屏可关闭回 H5。 | FACT | SRC-001 §2.5-2.10 + SRC-002 §3 + SRC-003 §2.3 | PM-Office | 新增\"CPC 不可用\"或\"OAB 半屏异常\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①OAB 半屏改造后预约成功率下降 \u003e X% （数据侧基线，Q-001）；②服务号关注卡片改造后关注转化率下降 \u003e X% （Q-002）；③CPC 上线后韩国用户注册完成率下降 \u003e X%（Q-003）。 | FACT | SRC-001 §1 + SRC-002 §2 + SRC-003 §4 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |\n\n## 0. 预检输入充分度判定\n\n| 维度 | L0（仅想法） | L1（单条稀疏来源） | L2（业务方案已存在） | L3（需求细节明确） | L4（上游已确认） |\n|---|---|---|---|---|---|\n| 判定 | | | | **命中**（SRC-001 BRD V1.2.5 含 12+ 功能 + I-XXX/B-XXX 规则；SRC-002 CR 文档含增量规则 + 韩国条款；SRC-003 User Manual 含操作流程 + FAQ + SLA） | |\n\n**L2 资格结论**：本 REQ 触发 5 项 L2-only 能力（PD/IX/VL/STATE/EX），且跨 MP+OAB+服务号+CR 多业务线，必须升级 L2（详见 `00-input/intake-decision.md` §2）。\n\n## 术语表（按需）\n\n| 术语 / 缩略词 | 说明 | 来源 |\n|---|---|---|\n| WFJ | 香奈儿尊享腕表与高级珠宝 | SRC-001 §0 |\n| OAB | 服务预约（Online Appointment Booking） | SRC-001 §0 |\n| CBDT | 跨境传输个人信息（Cross-Border Data Transfer）授权 | SRC-002 §0 |\n| Consent | 用户同意条款 | SRC-002 §0 |\n| CPC | 客户偏好中心（提供 consent 条款 API） | SRC-002 §0 |\n| MP | 小程序（Mini Program） | SRC-002 §0 |\n| CHANEL\u0026moi | WFJ MP 内特殊 OAB 入口（含腕表登记等服务类型） | SRC-001 §2.5 B03 + SRC-003 §2.2 |\n| PDP/PLP/Moodboard | 商城商品详情页 / 列表页 / 心情板页（WFJ MP 入口上下文） | SRC-003 §2.1 |\n| POST | WFJ 微信推文（一键拨号入口等投放渠道） | SRC-001 §2.19 + SRC-003 §1.4 |\n| FSN | 另一香奈儿业务线（Fashion，本次需求以 WFJ 为主线） | SRC-002 §1 |\n\n## 1. 需求来源与触发\n\n本需求由 WFJ 业务线（香奈儿尊享腕表与高级珠宝）业务方对接人 A 通过飞书 BRD 文档提出：\n\n- **主触发**：WFJ MP 与 OAB 服务预约改版（业务优先级 1-3：账号关注、在线客服、OAB 流程），参见 SRC-001 V1.2.5（2026-07-30 最新更新）。\n- **增量触发**：CPC CR 增量需求，覆盖 FSN/WFJ 双业务线，含 CBDT 授权、Consent 条款动态化（含韩国条款）、偏好设置与 CBDT 授权管理，参见 SRC-002 V1.1（2026-01-15）。\n- **操作流程佐证**：WFJ MP \u0026 OAB User Manual（飞书幻灯片，33 页）补充用户操作流程、OAB FAQ（8 条）、Support Model 与 SLA 矩阵，参见 SRC-003。\n\n\u003e 本节引用的 `源-XXX` 与 `SRC-XXX` 为同一份来源（中文翻译自原文，不臆测）。\n\n## 2. 项目与需求背景\n\nWFJ 业务线（香奈儿尊享腕表与高级珠宝）会员小程序（MP）与 OAB 服务预约系统面临三个核心改进方向（SRC-001 §1）：\n\n1. **WFJ 账号关注入口扩展**：现有入口仅在主菜单可见，需扩展至 PDP 等更多页面，并优化入口显示设计。\n2. **在线客服可见性提升**：当前在 moodboard 等页面入口较深，需提升在线客服作为行动按钮的可见性。\n3. **OAB 流程优化**：现有 OAB 流程以 H5 页面跳转为主，需支持弹出半屏模式并将 H5 转为原生形式，缩短游客预约路径。\n\n叠加 CPC CR 增量（SRC-002 §2）：CPC 功能实现后不一定立即生效，需要支持配置开关，以应对合规条款动态化与韩国跨境传输（CBDT）授权召回。\n\n\u003e 来源：SRC-001 §1 + SRC-002 §2。\n\n## 3. 当前现状与已有做法\n\n- **在线客服**：当前由第三方 Live 800 团队提供聊天能力，MP 仅暴露入口（SRC-001 §3）。\n- **OAB 流程**：当前为 H5 跳转模式（含 OAB category 非 campaign MP / campaign MP 入口），不支持半屏弹出；游客预约路径较长（SRC-001 §2.11 + §2.12）。\n- **注册流程**：注册弹窗 + 注册成功页面样式旧；常规 / CHANEL\u0026moi / OAB 三场景流程分支不一致（SRC-001 §2.3）。\n- **服务号关注**：当前入口仅在主菜单可见，未在 my account / 注册成功 / 预约成功等高频页面露出（SRC-001 §2.2）。\n- **CPC Consent**：当前条款为静态写死，不支持动态配置；不支持韩国专属条款（SRC-002 §3.2 B03）。\n- **历史入口链接**：已发送 OAB 入口链接仍指向 H5，需在过渡页面跳转至小程序（SRC-001 §2.12）。\n- **WFJ 服务号菜单栏**：「会员尊享」「CHANEL \u0026 moi」菜单入口需替换为带 utm 参数版本链接（SRC-001 §2.20）。\n\n\u003e 来源：SRC-001 §2 + SRC-002 §3。\n\n## 4. 核心问题与证据\n\n| 问题 | 影响 | 证据来源 |\n|---|---|---|\n| WFJ 账号关注入口仅在主菜单可见，PDP 等高频页面漏出 → 影响关注转化 | 关注转化率低（基线待 Q-002 验证） | SRC-001 §1 + §2.2 |\n| 在线客服入口在 moodboard 等页面较深，行动按钮可见性不足 → 影响客服触达 | 客服触达效率低 | SRC-001 §1 + §2.1 |\n| OAB 流程以 H5 跳转为主，游客预约路径长（≥3 步）→ 影响预约完成率 | 预约完成率低（基线待 Q-001 验证） | SRC-001 §1 + §2.11-§2.12 |\n| 注册流程分支不一致（常规 / CHANEL\u0026moi / OAB）→ 增加用户认知负担 | 注册流失率高（AI 推断，未量化） | SRC-001 §2.3-§2.4 |\n| CPC Consent 条款静态写死，不支持动态配置 → 无法快速适配合规变化（含韩国） | 合规风险 + 用户条款过时 | SRC-002 §3.2 B03 |\n| 2021-11-01 之前 H5 注册客户未做 CBDT 授权召回 → 跨境传输合规风险 | 韩国 / 部分市场合规风险 | SRC-002 §3.1 B01 |\n| OAB 半屏需求未实现，store locator 精品店详情页无法原生呼起 → 用户体验割裂 | Campaign MP 转化率受限 | SRC-001 §2.11 |\n| 多种 Picker 组件（省市区 / 生日 / 店铺 / 性别）样式不统一 → UX 一致性问题 | 用户认知成本 | SRC-001 §2.13-§2.18 |\n| 历史 OAB 入口链接仍指向 H5 → 新用户进入后体验与小程序原生不一致 | 新用户转化损失 | SRC-001 §2.12 |\n| 服务号菜单入口缺 utm 参数 → 进入小程序后的渠道归因丢失 | 数据无法归因 | SRC-001 §2.20 |\n\n\u003e 来源：见每行 `SRC-*` 标注。\n\n## 5. 目标、未来期望与成功判断\n\n\u003e **Fit Criterion（量化判据）提示**：每条目标必须能回答\"怎么算达成\"。无法量化的目标显式标 `待确认` + Q-XXX。\n\n| 目标 ID | 业务结果 / 交付结果 | 基线（Q-XXX） | 目标（Q-XXX） | 衡量方式 | 时间窗口 |\n|---|---|---|---|---|---|\n| **G-1** | OAB 预约成功率（业务结果）| 待 Q-001 数据侧提供 | +X%（建议 ≥10%；Q-001）| WFJ MP OAB 后台 + 神策 | 上线后 12 周 |\n| **G-2** | 服务号关注转化率（业务结果）| 待 Q-002 数据侧提供 | +X%（建议 ≥5%；Q-002）| 服务号关注 PV/UV + 神策 | 上线后 12 周 |\n| **G-3** | 现有失败语义保持 100%（交付结果）| 100%（既有失败语义） | 100%（不变；SRC-001 §2.5 B08-B09 + SRC-001 §2.6 B03）| 既有失败用例回归测试 | 上线前回归 + 上线后监控 |\n| **G-4** | OAB 半屏改造路径缩短 ≥30%（交付结果 / AI 推断）| H5 跳转 ≥3 步（SRC-001 §2.11）| 半屏弹出 ≤2 步（Q-004；INF-002）| 路径点击数埋点 | 上线后 4 周 |\n| **G-5** | 注册流程一致化（常规 / CHANEL\u0026moi / OAB 三场景收敛为同一 UI 模板）（交付结果）| 三场景 UI 不一致（SRC-001 §2.3-§2.4）| UI 一致 + 交互文案统一 | 设计走查 + 回归用例 | 上线前完成 |\n| **G-6** | CPC Consent 动态化支持（含韩国 8 类条款）（交付结果）| 静态写死（SRC-002 §3.2 B03）| 动态配置 + 韩国条款生效（SRC-002 §3.2 B03 + B04）| CPC API 联调 + 单元测试 | 上线前完成 |\n| **G-7** | 2021-11-01 前 H5 注册客户 CBDT 召回覆盖率 100%（交付结果）| 0%（未召回；Q-003）| 100%（弹窗 + 有效操作；Q-003）| CBDT 弹窗操作日志 | 上线后 4 周 |\n\n## 6. 用户角色与利益相关者\n\n| 角色 | 描述 | 利益 | 受影响环节 | 来源 |\n|---|---|---|---|---|\n| **游客（Guest）** | 未注册的 WFJ MP 访客 | 注册便捷 + 关注入口可见 + 在线客服可见 + OAB 入口可见 | my account / 注册 / OAB 半屏 / 服务号关注卡片 / 在线客服 | SRC-001 §2 + SRC-003 §1 |\n| **注册用户（Registered Member）** | 已完成 WFJ MP 注册的会员 | OAB 全生命周期操作 + Consent 偏好设置 + Welcome gift + Caretips | OAB 创建/查看/修改/取消/通知 / 编辑个人信息 / 我的预约服务 / Welcome gift / Caretips | SRC-001 §2 + SRC-002 §3 + SRC-003 §2 |\n| **客服/FA（在线服务运营）** | 通过 Live 800 提供客服 | 在线聊天入口可见 + 客户标签信息可用 | 在线客服入口 / OAB 通知 / 客户咨询 | SRC-001 §2.1 + SRC-003 §1.1 |\n| **运营（Service Account Manager）** | WFJ 服务号后台运营 | 菜单入口管理 + 关注 PV/UV 数据 + utm 归因 | 服务号菜单 / 关注数据 / utm 参数 | SRC-001 §2.20 |\n| **CPC 团队（外部）** | 提供 consent 条款 API + 个人偏好 iframe | 条款版本同步 + iframe 内嵌集成 | 注册 / 编辑个人信息 / 偏好设置 | SRC-002 §3.2 B06 + §3.3 B03 |\n| **Live 800 团队（外部）** | 提供在线聊天解决方案 | MP 入口集成 + 客户咨询分配 | 在线客服入口 | SRC-001 §3 |\n\n\u003e 注：4 类角色（游客 / 注册用户 / 客服 / FA / 运营）+ 2 类外部团队（CPC + Live 800）。详细旅程归下游 `user-journey` skill。\n\n## 涉及团队及职责总结（按需）\n\n| 团队 / 角色 | 职责 | 关联环节 | 来源 |\n|---|---|---|---|\n| PM-Office | 需求编排、PRD 撰写、跨业务线协调 | 全 REQ | 内部角色 |\n| WFJ 业务方（已脱敏） | 提供 BRD + 验收 + 业务决策 | 全 REQ | SRC-001 + SRC-002 对接人 |\n| WFJ 开发团队（脱敏） | 实现 MP + OAB + 服务号 + CPC 集成 | 全 REQ | SRC-001 §6 |\n| CPC 团队（外部） | 提供 consent 条款 API + 偏好 iframe | 注册 / 编辑个人信息 / 偏好 | SRC-002 §3.2 B06 + §3.3 B03 |\n| Live 800 团队（外部） | 提供在线聊天解决方案 | 在线客服入口 | SRC-001 §3 |\n| OAB 运维团队 | OAB 功能 / OAB Portal 排障 + 升级开发团队 | Support Model L\u003cL\u003e | SRC-003 §4.1 |\n\n## 7. 时间、约束与依赖\n\n- **上线时间窗口**：本期上线节奏由 PM-Office 与业务方对接人 A 协商；参考 SRC-001 §6「【Chanel WFJ 会员小程序原生改版】」历史节奏。\n- **Hypercare 升级路径**：上线后 10.23-11.22 进入内部协作群 Hypercare 阶段；11.23 起转为邮件或 APP Live Chat 升级路径（SRC-003 §4.2）。\n- **SLA 约束**：P1 主流程对 1+ 精品店或 10+ 用户不可用，7×12（9:00-22:00）1h 响应 4h 排障；P2 12h 排障；P3 3 天排障；P4 7 天排障（SRC-003 §4.2）。\n- **合规约束**：2021-11-01 前 H5 注册客户须召回 CBDT 授权；韩国 / 部分市场专属条款（Korea Terms \u0026 Condition / Korea data collection / Korea international transfer）须动态化（SRC-002 §3.1 + §3.2）。\n- **依赖**：\n  - CPC 团队提供 consent API 与偏好 iframe（SRC-002 §3.3 B03）\n  - Live 800 提供在线聊天能力（SRC-001 §3）\n  - WFJ campaign 小程序支持半屏呼起（SRC-001 §2.11）\n  - 神策埋点同步渠道归因（SRC-001 §5）\n- **资源约束**：≤12 人天 MP/OAB/服务号改造 + ≤2 人天 CPC CR 集成（详见 §产品质量增强记录 · 价值-成本-风险）。\n\n## 8. 初步边界与非目标\n\n### 边界（本期包含）\n\n- WFJ MP 多入口打通（my account / 注册成功 / 预约成功 / 服务号关注卡片）\n- OAB 全生命周期（创建 / 查看 / 修改 / 取消 / 通知）+ 半屏弹出（仅 store locator 精品店详情页）\n- 服务号关注卡片（双态 CTA：未关注 / 已关注）\n- 注册流程统一（常规 / CHANEL\u0026moi / OAB 三场景 UI 一致化）\n- OAB 历史 H5 链接过渡到原生\n- 服务号菜单带 utm 参数\n- CPC CR：Consent 动态配置 + 韩国专属条款 + CBDT 授权召回 + 偏好设置\n- 三级级联 Picker（省市区 / 生日 / 店铺 / 性别）样式统一\n- 一键拨号（POST 投放渠道）\n- Welcome gift + Caretips 入口\n- Support Model 与 SLA 落地（SRC-003 §4）\n\n### 非目标（本期不包含）\n\n- 通用 FSN MP / WFJ MP 之外业务线的 OAB 全量迁移（仅 WFJ）\n- OAB 后台功能重构（仅前端 + 半屏改造，后台沿用既有接口）\n- 服务号后台管理系统重构（仅菜单入口 + utm 参数）\n- LIVE 800 客服系统内部改造（仅暴露入口）\n- 神策埋点底层改造（沿用既有 SDK）\n\n## 9. 事实与决定\n\n| ID | 类型 | 内容 | 来源/决策人 | 状态 |\n|---|---|---|---|---|\n| FCT-001 | FACT | WFJ 业务线包含 MP + OAB + 服务号 + CPC 4 大模块 | SRC-001 §1 + §2 + SRC-002 §1 | 已确认 |\n| FCT-002 | FACT | 本期上线 12+ 功能（在线服务 / 关注卡片 / s/00-input/SRC-002-cpc-cr.md`（CPC CR V1.1）| CBDT 授权 + Consent 动态化 + 韩国条款 + 偏好设置 + CR 配置开关 | §1 需求来源与触发；§2 项目与需求背景（CPC 增量）；§3 当前现状（CPC 静态写死）；§4 核心问题与证据（合规风险）；§5 G-6 G-7 目标；§6 CPC 团队角色；§9 FCT-003/005/006；§10 DEC-004 |\n| SRC-003 | `requirements/REQ-005-wfj-mpes/00-input/SRC-003-wfj-user-manual.md`（User Manual 33 页幻灯片）| 操作流程 + OAB FAQ 8 条 + Support Model + SLA 矩阵 | §4 核心问题（FAQ 1-8 反映用户痛点）；§7 时间约束（SLA）；§8 边界（FAQ 反映范围外问题）；§10 涉及团队；§9 FCT-004（半屏限定） |\n\n## 13. 下游输入摘要\n\n\u003e 仅在 `confirmed` 后填写，供下游 user-journey / user-stories 使用。本节 v0.1 草案先列出关键线索，confirmed 后再精修。\n\n```text\nconfirmed_version: v0.1（pending human gate）\nbackground_anchors:\n  业务线: WFJ（香奈儿尊享腕表与高级珠宝）\n  项目: MP-E-services（MP + OAB + 服务号 + CPC 集成）\n  跨业务线覆盖: FSN（仅 CPC 增量涉及 + CBDT 召回共享）\nrole_anchors:\n  游客 / 注册用户 / 客服 / FA / 运营 / CPC 团队 / Live 800 团队\ngoal_anchors:\n  G-1 / G-2 / G-3 / G-4 / G-5 / G-6 / G-7（详见 §5；目标值待 Q-001~Q-005 数据侧 / 业务方回复后定）\nconstraint_anchors:\n  - CPC CR 可配置开关\n  - 既有失败语义保持（24h 不可约 / 当日已有预约 / 时段满额）\n  - SLA 矩阵 P1-P4（SRC-003 §4.2）\n  - 韩国合规条款必填 + 联动规则（SRC-002 §3.2 B04 + B05）\nboundary_anchors:\n  - OAB 半屏本期仅 store locator 精品店详情页面\n  - FSN MP 仅 CPC 增量涉及，OAB 本期不迁移\n  - 服务号后台系统本期不重构\n  - 神策埋点底层不改造\nopen_unknowns: Q-001 / Q-002 / Q-003 / Q-004 / Q-005 / Q-006（详见 §11）\nassumptions_to_validate: ASM-001（服务号关注卡片实现细节）\nsource_ids: SRC-001 + SRC-002 + SRC-003\n```\n\n## 14. Constitution Compliance\n\n| 原则 | 状态 | 证据 / 备注 |\n|---|---|---|\n| ① 业务事实分离 | PASS | §5 目标全部基于 SRC-001/SRC-002/SRC-003；§9 FCT-001~006 显式 FACT；§10 UNK-001~004 / INF-001~003 / ASM-001 显式标记 |\n| ② AI 不替业务决定 | PASS | §9 DEC-001~004 状态\"待 human gate 决定\"；frontmatter `confirmed_at` = 待 human gate 批准后填写；§11 Q-001~Q-006 等待业务方/数据侧回复 |\n| ③ 来源可追溯 | PASS | §12 来源追溯 3 条；§4 / §5 / §6 / §7 每行标注 SRC-* 编号 |\n| ④ 冲突显式保留并关闭 | PASS | §10 CFT-001 显式登记\"SRC-001 vs SRC-003 一致无冲突\"；§11 Q-001~Q-006 已登记待业务方 / 数据侧回复 |\n\n## 15. 版本变更摘要\n\n| 版本 | 变更原因 | 主要变化 | 人工确认状态 |\n|---|---|---|---|\n| v0.1 | 初始候选 | 首次生成（基于 SRC-001 V1.2.5 + SRC-002 V1.1 + SRC-003；7 个目标 G-1~G-7 + 4 类角色 + 12+ 功能 + 5 项 L2-only 适用性 + 6 项 §11 待确认问题 Q-001~Q-006 + 9 项 §10 显式寄存器/未知/推断/冲突登记 + §13 下游交接 summary 含 anchors + open_unknowns + assumptions_to_validate）| DEC-001 待 human gate 决定 |"}, {"path": "001-business-requirements/02-user-journey/user-journey.md", "content": "---\nartifact_id: UJ-001\nversion: v0.1\nstatus: confirmed\nquality_contract_version: \"1\"\nowner: PM-Office\nbusiness_fact_owner: 业务方对接人 A（已脱敏；见 00-input/authorized-reviewers.json）\ngoal_decision_owner: 业务方对接人 A（已脱敏；见 00-input/authorized-reviewers.json）\nreviewer: nova\ncreated_at: 2026-08-25\nupdated_at: 2026-08-25\nconfirmed_at: 2026-08-25T02:24:13+00:00\nupstream_artifact_id: \"BG-001（confirmed，DEC-001）\"\n---\n\n# 用户旅程\n\n## 产品质量增强记录\n\n| 项目 | 结论 | 知识状态 | 来源/位置 | 判断人 | 复核触发 |\n|---|---|---|---|---|---|\n| 受影响角色与结果 | 4 类角色：游客 / 注册用户 / 客服 / 运营 + 2 类外部团队（CPC / Live 800）| FACT | BG-001 §6 + SRC-001 §1-§2 + SRC-003 §1 | PM-Office | 新增分群（如代客预约专员）或新角色时升级 L2 |\n| 采用方案与被排除替代 | 采用「MP 多入口打通 + OAB 全生命周期原生化 + 服务号关注卡片 + CPC Consent 动态化」。被排除替代：①维持 H5 + 多个独立入口跳转；②统一收口至单一入口。 | DECISION | BG-001 §产品质量增强记录 + SRC-001 §2 | PM-Office | 出现\"按用户分群差异化引导\"或\"统一收口\"诉求时升级 L2 |\n| 价值-成本-风险 | 价值：注册流程简化、OAB 半屏原生化缩短 ≥30% 路径（AI 推断）；关注转化率提升。成本：MP 4 大模块 + OAB 5 状态 + 服务号 3 处入口（共 ≤12 人天）；CPC CR iframe 集成 + 韩国条款动态化（≤2 人天）。风险：CPC API 异常、H5→原生过渡期数据迁移、24h 不可预约硬约束被误触。 | DECISION + AI_INFERENCE（量化数据为推断） | BG-001 §5 + §7 | PM-Office | 上线后 2 周内采集关注转化率 + 注册完成率 + OAB 预约成功率验证 |\n| 失败边界与回退 | 既有失败语义不变（24h 内不可约、当日已有预约不可约、时段满额不可约）；新增可观察行为：服务号关注卡片双态 CTA、Consent 动态条款、韩国专属条款；新增失败路径（CBDT 拒绝 / Consent 校验失败 / OAB 接口超时）有兜底。回退：CPC CR 可配置开关禁用；OAB 半屏可关闭回 H5。 | FACT | BG-001 §5 G-3 + SRC-001 §2.5-2.10 + SRC-002 §3 + SRC-003 §2.3 | PM-Office | 新增\"CPC 不可用\"或\"OAB 半屏异常\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①OAB 半屏改造后预约成功率下降 \u003e X%（Q-001）；②服务号关注卡片改造后关注转化率下降 \u003e X%（Q-002）；③CPC 上线后韩国用户注册完成率下降 \u003e X%（Q-003）。 | FACT | BG-001 §5 + §11 + SRC-001 §1 + SRC-002 §2 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |\n\n## 0. 预检输入充分度判定\n\n- 上游产物：BG-001（confirmed，DEC-001）\n- 已确认角色数：4 类（游客 / 注册用户 / 客服 / 运营）+ 2 类外部团队（CPC / Live 800）\n- 已知生命周期线索：5 类（首次进入 / 注册 / OAB 创建 / OAB 通知与生命周期管理 / CPC Consent 设置 / OAB 半屏）\n- 判定：充分模式（基于 BG-001 confirmed 直接展开旅程图；4 类角色 × 6 类生命周期阶段覆盖完整；6 类路径类型全部有对应条目）\n\n## 1. 业务生命周期分解\n\n| 阶段 | 描述 | 触发事件 | 涉及角色 | 来源 |\n|---|---|---|---|---|\n| **L1. 首次进入 WFJ MP** | 游客通过外部入口（服务号推文 / 历史 OAB 链接 / store locator / POST 投放 / 主菜单）首次访问 WFJ MP | 用户点击外部入口链接进入 MP | 游客 / 注册用户 / 运营 | SRC-001 §2.11-§2.12 + SRC-002 §3.1 B03 + SRC-003 §1 |\n| **L2. 注册流程（含简化注册）** | 游客通过 my account / OAB 入口 / PDP 等触发注册弹窗（微信授权手机号或验证手机号两种方式）；常规 / CHANEL\u0026moi / OAB 三场景流程统一 | 游客在需要权限的页面触发注册 | 游客 / 注册用户 | SRC-001 §2.3-§2.4 + SRC-002 §3.2 + SRC-003 §1.3-§1.6 |\n| **L3. OAB 创建预约** | 用户选择服务类型 + 精品店 + 日期与时间 + 备注，提交预约（主流程 / 二次确认 / 不可约弹窗 / 当日已有预约弹窗）| 用户点击\"我的预约服务\" / CHANEL\u0026moi / Moodboard/PDP/PLP / store locator / BRAND ZONE / POST 二维码 | 游客 / 注册用户 | SRC-001 §2.5 + SRC-003 §2.1-§2.3 |\n| **L4. OAB 通知与生命周期管理** | 预约成功通知 + Day-1 提醒通知 + 查看预约记录列表 + 查看详情 + 修改预约 + 取消预约 | 预约创建成功 / Day-1 10:00 / 用户主动查看 | 注册用户 / 客服 / FA | SRC-001 §2.6-§2.10 + SRC-003 §2.4-§2.8 |\n| **L5. CPC Consent 设置** | CBDT 召回弹窗（仅 2021-11-01 前 H5 注册客户）+ 注册时 Consent 条款动态化（含韩国 8 类条款）+ 编辑个人信息页 CBDT 与偏好设置 | 用户首次进入（CBDT 召回）/ 注册流程 / 用户点击编辑个人信息 | 游客 / 注册用户 / CPC 团队 | SRC-002 §3.1-§3.3 + SRC-003 §1.3 |\n| **L6. OAB 半屏呼起（store locator）** | 用户通过 store locator 精品店详情页半屏呼起 OAB 预约流程（仅该入口支持半屏）| 用户点击 store locator 精品店详情页的\"预约服务\" | 游客 / 注册用户 | SRC-001 §2.11 + SRC-003 §2.9 |\n\n\u003e 未覆盖的生命周期阶段（逻辑隐含但背景未描述）：用户主动管理服务号关注状态（关注 / 取关 / 二次关注推送触发）—— 隐含在 L1-L2 但缺少独立旅程；后续 user-stories 阶段补全。\n\n## 2. 用户旅程图\n\n\u003e 按生命周期阶段（行）× 角色（列）组织。每个单元格包含：触发事件、动作、触点、痛点、期望结果。\n\n| 生命周期阶段 | 游客 | 注册用户 | 客服 / FA | 运营 |\n|---|---|---|---|---|\n| **L1. 首次进入** | 触发：外部入口（POST 推文 / 服务号菜单 / store locator / 历史 OAB H5 链接）\u003cbr\u003e动作：进入 MP 首页 / 跳转过渡页 → MP\u003cbr\u003e触点：服务号推文 / 服务号菜单 / H5 过渡页 / 店铺详情\u003cbr\u003e痛点：H5 跳转体验差；关注入口仅主菜单可见；my account 注册入口可见但缺关注入口\u003cbr\u003e期望：原生小程序体验 + 多入口关注卡片\u003cbr\u003e类型：normal + alternative\u003cbr\u003e来源：SRC-001 §2.11-§2.12 + §2.20 + SRC-003 §1\u003cbr\u003e知识状态：FACT + DECISION | 触发：服务号菜单（带 utm）/ 我的预约服务 / 服务号关注推送\u003cbr\u003e动作：进入 my account / OAB 列表\u003cbr\u003e触点：服务号菜单（带 utm 参数）\u003cbr\u003e痛点：菜单入口缺 utm 参数，归因丢失\u003cbr\u003e期望：渠道归因可量化\u003cbr\u003e类型：normal\u003cbr\u003e来源：SRC-001 §2.20\u003cbr\u003e知识状态：FACT | 触发：客服咨询进入 MP 查询客户预约记录\u003cbr\u003e动作：通过 OAB Portal 查询客户预约\u003cbr\u003e触点：OAB Portal\u003cbr\u003e痛点：客户标签信息需手动关联\u003cbr\u003e期望：客户标签信息可用\u003cbr\u003e类型：alternative\u003cbr\u003e来源：SRC-001 §3 + SRC-003 §1.1\u003cbr\u003e知识状态：FACT + AI_INFERENCE | 触发：服务号后台查询关注 PV/UV\u003cbr\u003e动作：查看 utm_campaign=wfjAccount 等参数\u003cbr\u003e触点：服务号后台\u003cbr\u003e痛点：缺 utm 参数，无法分渠道归因\u003cbr\u003e期望：分渠道数据可视化\u003cbr\u003e类型：normal\u003cbr\u003e来源：SRC-001 §2.20\u003cbr\u003e知识状态：FACT |\n| **L2. 注册流程** | 触发：my account \"即刻注册\" / wishlist / OAB / My account / suggestion board / DP 入口触发\u003cbr\u003e动作：注册弹窗 → 隐私保护指引 → 微信授权手机号 OR 验证手机号 → 协议勾选 → 姓名 + 居住地 → 注册成功页\u003cbr\u003e触点：注册弹窗 / 隐私保护指引弹窗 / 协议勾选页 / 注册成功页\u003cbr\u003e痛点：注册分支不一致；常规 / CHANEL\u0026moi / OAB 三场景 UI 不同；表单字段缺失导致确认键置灰\u003cbr\u003e期望：UI 一致 + 必填校验明确\u003cbr\u003e类型：normal + alternative + exception\u003cbr\u003e来源：SRC-001 §2.3-§2.4 + SRC-002 §3.2 + SRC-003 §1.3-§1.6\u003cbr\u003e知识状态：FACT + DECISION（G-5） | 触发：编辑个人信息修改\u003cbr\u003e动作：进入 my account → 编辑 → 修改字段 → 提交\u003cbr\u003e触点：编辑个人信息页（CBDT + 偏好设置）\u003cbr\u003e痛点：原条款静态写死；缺 CBDT 与偏好设置入口\u003cbr\u003e期望：动态条款 + 韩国专属条款联动\u003cbr\u003e类型：normal + exception\u003cbr\u003e来源：SRC-002 §3.2-§3.3\u003cbr\u003e知识状态：FACT | 触发：客户咨询注册失败\u003cbr\u003e动作：通过 Live 800 协助排查\u003cbr\u003e触点：Live 800 + OAB Portal\u003cbr\u003e痛点：失败语义不明确\u003cbr\u003e期望：失败兜底清晰\u003cbr\u003e类型：recovery\u003cbr\u003e来源：SRC-001 §2.3 + SRC-003 §1.1\u003cbr\u003e知识状态：AI_INFERENCE | 触发：CPC CR 配置开关 / utm 参数维护\u003cbr\u003e动作：服务号后台管理\u003cbr\u003e触点：服务号后台 / CPC 配置\u003cbr\u003e痛点：配置变更需协调 CPC 团队\u003cbr\u003e期望：配置可关闭\u003cbr\u003e类型：alternative\u003cbr\u003e来源：SRC-002 §2 + SRC-001 §2.20\u003cbr\u003e知识状态：FACT |\n| **L3. OAB 创建预约** | 触发：my account \"我的预约服务\" / CHANEL\u0026moi 入口 / OAB 半屏\u003cbr\u003e动作：注册弹窗 → 选择服务类型 → 选择精品店 → 选择日期与时间 → 备注 → 二次确认 → 提交\u003cbr\u003e触点：创建预约页 / 服务类型选择 / 精品店选择 / 时间选择 / 备注 / 二次确认弹窗\u003cbr\u003e痛点：游客路径长（注册+预约）；时段满额/当日已有预约需重新选择；H5 跳转体验差\u003cbr\u003e期望：路径缩短（半屏 ≤2 步）；失败兜底清晰\u003cbr\u003e类型：normal + exception + failure\u003cbr\u003e来源：SRC-001 §2.5 + SRC-003 §2.1-§2.3\u003cbr\u003e知识状态：FACT + DECISION（G-4） | 触发：直接进入创建预约页\u003cbr\u003e动作：同上跳过注册步骤\u003cbr\u003e触点：同上\u003cbr\u003e痛点：服务类型-店铺-场次关联规则不清晰\u003cbr\u003e期望：关联规则明确 + 二次确认弹窗\u003cbr\u003e类型：normal + exception\u003cbr\u003e来源：SRC-001 §2.5 B04 + SRC-003 §2.1\u003cbr\u003e知识状态：FACT | 触发：客户咨询 OAB 创建失败\u003cbr\u003e动作：通过 Live 800 协助 / OAB Portal 排障\u003cbr\u003e触点：Live 800 + OAB Portal\u003cbr\u003e痛点：失败语义需 4 类弹窗统一\u003cbr\u003e期望：失败兜底清晰\u003cbr\u003e类型：recovery\u003cbr\u003e来源：SRC-003 §2.3\u003cbr\u003e知识状态：FACT + AI_INFERENCE | 触发：服务类型-店铺-场次关联规则配置变更\u003cbr\u003e动作：OAB 后台配置\u003cbr\u003e触点：OAB 后台\u003cbr\u003e痛点：配置变更即时生效可能影响预约\u003cbr\u003e期望：可灰度 / 可回滚\u003cbr\u003e类型：alternative\u003cbr\u003e来源：SRC-001 §2.5 B04\u003cbr\u003e知识状态：AI_INFERENCE |\n| **L4. OAB 通知与生命周期管理** | 触发：注册成功 + OAB 创建成功 + Day-1 10:00\u003cbr\u003e动作：接收通知 → 点击通知 → 查看详情\u003cbr\u003e触点：服务号通知（文本 / 卡片 / 模板消息）+ 预约详情页 + 预约已失效页 + 预约已取消页\u003cbr\u003e痛点：服务号未关注时不通知；预约成功后再关注不补发；FA 标记已完成时仍发 Day-1 提醒\u003cbr\u003e期望：通知规则明确 + 失效/取消页可重新预约\u003cbr\u003e类型：normal + failure + recovery\u003cbr\u003e来源：SRC-001 §2.6 + SRC-003 §2.4\u003cbr\u003e知识状态：FACT | 触发：my account \"我的预约服务\" / 详情页操作\u003cbr\u003e动作：查看列表 → 详情 → 修改 / 取消\u003cbr\u003e触点：预约列表 / 详情页 / 修改页 / 取消页 / 二次取消确认\u003cbr\u003e痛点：列表为空 / 全部完成时进入创建预约；修改/取消时后台已变更状态提示\u003cbr\u003e期望：列表过滤规则明确 + 二次确认\u003cbr\u003e类型：normal + exception + recovery\u003cbr\u003e来源：SRC-001 §2.7-§2.10 + SRC-003 §2.5-§2.8\u003cbr\u003e知识状态：FACT | 触发：客户咨询通知未收到 / 修改/取消失败\u003cbr\u003e动作：通过 Live 800 协助\u003cbr\u003e触点：Live 800 + OAB Portal\u003cbr\u003e痛点：通知模板字段超 20 变「...」\u003cbr\u003e期望：通知内容完整\u003cbr\u003e ies.md", "content": "---\nartifact_id: US-001\nversion: v0.1\nstatus: confirmed\nquality_contract_version: \"1\"\nowner: PM-Office\nbusiness_fact_owner: 业务方对接人 A（已脱敏；见 00-input/authorized-reviewers.json）\ngoal_decision_owner: 业务方对接人 A（已脱敏；见 00-input/authorized-reviewers.json）\nreviewer: nova\ncreated_at: 2026-08-25\nupdated_at: 2026-08-25\nconfirmed_at: 2026-08-25T02:54:30+00:00\nupstream_artifact_id: \"UJ-001（confirmed）\"\n---\n\n# 用户故事\n\n## 产品质量增强记录\n\n| 项目 | 结论 | 知识状态 | 来源/位置 | 判断人 | 复核触发 |\n|---|---|---|---|---|---|\n| 受影响角色与结果 | 4 类角色（游客 / 注册用户 / 客服 / 运营）+ 2 类外部团队（CPC / Live 800）；本期上线 4 项核心功能（注册流程优化 + OAB 半屏 + 服务号关注卡片 + CPC Consent 动态化）+ 12+ 子功能 | FACT | BG-001 §6 + UJ-001 §1 + SRC-001 §1 + SRC-002 §3 | PM-Office | 新增分群或外部团队时升级 L2 |\n| 采用方案与被排除替代 | 采用「MP 多入口打通 + OAB 全生命周期原生化 + 服务号关注卡片 4 处植入 + CPC Consent 动态化（CBDT + 韩国专属）」。被排除替代：①维持 H5 + 多入口跳转（差体验+缺归因）；②统一收口至单一入口（缺触达+缺分类）。 | DECISION | BG-001 §产品质量增强记录 + SRC-001 §2 + UJ-001 §1 | PM-Office | 出现差异化引导或统一收口诉求时升级 L2 |\n| 价值-成本-风险 | 价值：注册流程简化（3 场景 UI 一致）、OAB 半屏缩短路径 ≤2 步（DEC-103）、服务号关注卡片 4 处植入提升关注转化、Consent 动态化支持韩国合规。成本：MP 4 大模块 + OAB 5 状态 + 服务号 4 处入口（共 ≤12 人天）+ CPC iframe + 韩国条款动态化（≤2 人天）。风险：CPC API 异常 / H5→原生过渡期数据迁移 / 24h 不可预约硬约束被误触。 | DECISION + AI_INFERENCE（≤2 步为推断）| BG-001 §5 + §7 + UJ-001 §4 DEC-103 | PM-Office | 上线后 2 周采集关注转化率 + 注册完成率 + OAB 预约成功率 |\n| 失败边界与回退 | 既有失败语义不变（24h 内不可约、当日已有预约不可约、时段满额不可约）；新增可观察行为：服务号关注卡片双态 CTA、Consent 动态条款、韩国专属条款；新增失败路径（CBDT 拒绝 / Consent 校验失败 / OAB 接口超时）有兜底。回退：CPC CR 可配置开关禁用；OAB 半屏可关闭回 H5；关注卡片可下线回主菜单入口。 | FACT | UJ-001 §1 L1-L6 + SRC-001 §2.5-2.10 + SRC-002 §3 + SRC-003 §2 | PM-Office | 新增\"CPC 不可用\"或\"OAB 半屏异常\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①OAB 半屏改造后预约成功率下降 \u003e X%（Q-001）；②服务号关注卡片改造后关注转化率下降 \u003e X%（Q-002）；③CPC 上线后韩国用户注册完成率下降 \u003e X%（Q-003）；④注册流程优化后注册完成率下降 \u003e X%（Q-010，US-001 新增）。 | FACT | BG-001 §5 + §11 + UJ-001 §1 + SRC-001 + SRC-002 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |\n\n## 0. 预检输入充分度判定\n\n- 上游产物：UJ-001（confirmed，DEC-101）+ BG-001（confirmed，DEC-001）\n- 已确认旅程条目数：24（4 角色 × 6 生命周期阶段）\n- 已确认角色数：4 类（游客 / 注册用户 / 客服 / 运营）+ 2 类外部团队（CPC / Live 800）\n- 判定：充分模式（基于 UJ-001 confirmed 24 个旅程条目；本 US-001 覆盖 20 个核心故事 + 4 类路径类型完整；范围基线明确）\n\n## 1. 用户故事卡片\n\n\u003e 格式：在〈前提/场景〉下，作为〈角色〉，我希望〈动作〉，以便〈目标/价值〉\n\n| ID | 来源旅程条目 | 角色 | 场景 | 动作 | 目标/价值 | 路径类型 | 优先级提示 | 知识状态 |\n|---|---|---|---|---|---|---|---|---|\n| ST-001 | UJ-001 §2 L1 注册用户列 | 注册用户 | 在服务号菜单点击进入 my account 时 | 我希望看到 4 处入口关注卡片（my account / 注册成功页 / 预约成功页 / my account 已注册区）| 以便提升服务号关注转化率（G-2 + DEC-003）| normal | Must（核心关注触达）| FACT + DECISION |\n| ST-002 | UJ-001 §2 L2 注册用户列 | 游客 | 在 my account / wishlist / OAB / suggestion board / DP 等需要权限的页面 | 我希望通过 my account 入口 + 注册弹窗完成微信授权手机号注册（点击「注册」→ 隐私保护指引 → 选择授权手机号 → 协议勾选 → 姓名 + 居住地 → 注册成功）| 以便路径 ≤2 步完成注册 + UI 一致（G-5）| normal + alternative | Must（注册流程主路径）| FACT + DECISION |\n| ST-003 | UJ-001 §2 L2 注册用户列 | 游客 | 在注册弹窗中点击「拒绝」隐私保护指引时 | 我希望通过验证手机号（手机号 + 验证码 + 姓名 + 居住地）完成注册 | 以便拒绝隐私指引的用户仍可注册（G-5 + DEC-002）| alternative | Must（注册流程备选）| FACT + DECISION |\n| ST-004 | UJ-001 §2 L3 游客列 | 游客 | 在 my account / CHANEL\u0026moi / Moodboard/PDP/PLP / store locator / BRAND ZONE / POST 二维码入口触发 OAB | 我希望完成注册（如未注册）+ 创建 OAB 预约（服务类型 + 精品店 + 日期与时间 + 备注 + 二次确认）| 以便 4 类入口统一体验 + 路径 ≤3 步（G-1 + G-4 + DEC-103）| normal + exception | Must（OAB 核心路径）| FACT + DECISION |\n| ST-005 | UJ-001 §2 L4 游客列 | 注册用户 | 在预约成功 + Day-1 10:00 收到服务号通知时 | 我希望收到预约成功通知（关注服务号后）+ Day-1 提醒通知（仅已关注用户），通知含模板字段（≤20 字段不截断）| 以便通知触达 + 失效/取消页可重新预约（G-3 + DEC-004）| normal + failure | Must（通知规则核心）| FACT + DECISION |\n| ST-006 | UJ-001 §2 L4 注册用户列 | 注册用户 | 在 my account \"我的预约服务\" 入口时 | 我希望查看未完成预约列表 + 详情（含店铺位置）+ 修改 + 取消（含二次取消确认）| 以便 OAB 全生命周期管理（G-1 + G-3 + DEC-004）| normal | Must（OAB 生命周期）| FACT + DECISION |\n| ST-007 | UJ-001 §2 L5 游客列 | 游客 | 在 2021-11-01 前 H5 注册客户首次进入 WFJ MP 时 | 我希望看到 CBDT 召回弹窗（仅一次性，FSN/WFJ 任一弹过且有效操作后不再弹出） | 以便满足 CPC 合规召回 + 一次性弹窗语义清晰（G-7 + DEC-005）| normal + exception | Must（CPC CR 核心）| FACT + DECISION |\n| ST-008 | UJ-001 §2 L5 游客列 | 游客 | 在注册流程中 | 我希望看到动态 Consent 条款（含 8 类条款 + 韩国专属条款联动）| 以便支持 CPC Consent 动态化 + 韩国合规（DEC-005 + G-6）| normal | Must（CPC CR 增量）| FACT + DECISION |\n| ST-009 | UJ-001 §2 L5 注册用户列 | 注册用户 | 在 my account \"编辑个人信息\" 入口 | 我希望看到 CBDT 条款设置 + 偏好设置（多渠道勾选 iframe）| 以便支持 Consent 偏好动态管理 + 韩国专属联动（DEC-005 + G-6）| normal + exception | Must（编辑场景核心）| FACT + DECISION |\n| ST-010 | UJ-001 §2 L6 游客列 | 游客 | 在 store locator 精品店详情页点击\"预约服务\" | 我希望通过半屏原生呼起 OAB 创建流程（未注册 → 半屏 + 注册弹窗；已注册 → 直接半屏创建）| 以便原生半屏路径 ≤2 步（G-4 + DEC-103）| normal + alternative | Should（OAB 半屏核心）| FACT + DECISION |\n| ST-011 | UJ-001 §2 L3 游客列 | 游客 | 在 OAB 创建过程中 | 我希望遇到时段满额 / 当日已有预约 / 不可预约等异常时，看到明确兜底弹窗（4 类失败语义） | 以便失败兜底清晰 + 可重新选择（G-1 + G-3 + DEC-006）| exception + failure | Must（异常路径兜底）| FACT + DECISION |\n| ST-012 | UJ-001 §2 L4 游客列 | 注册用户 | 在预约已失效 / 已取消时 | 我希望看到失效 / 取消页（含\"店铺预约\"重新创建入口 + 400 号码联系 FA 入口）| 以便可重新预约 + 兜底清晰（G-1 + DEC-006）| failure + recovery | Must（兜底路径）| FACT + DECISION |\n| ST-013 | UJ-001 §2 L1 游客列 | 游客 | 在首次进入 WFJ MP（外部入口：POST 推文 / 服务号菜单 / store locator / 历史 OAB H5 链接）| 我希望进入原生 MP 而非 H5，且关注入口多触点可见（my account 注册入口 + 服务号关注卡片）| 以便原生体验 + 关注转化提升（G-2 + DEC-003 + DEC-103）| normal + alternative | Must（入口打通）| FACT + DECISION |\n| ST-014 | UJ-001 §2 L3 客服列 | 客服 / FA | 在客户咨询 OAB 创建 / 修改 / 取消失败时 | 我希望通过 Live 800 + OAB Portal 双系统介入排障 | 以便恢复路径覆盖完整（G-1 + DEC-006）| handoff + recovery | Must（客服交接路径）| FACT + AI_INFERENCE |\n| ST-015 | UJ-001 §2 L4 客服列 | 客服 / FA | 在维护通知模板时 | 我希望字段管理清晰（≤20 字段不截断）+ 优先级符合 SLA（P1 1h 响应 / P2 2h 响应）| 以便通知维护 + 故障排障（SLA P1/P2，DEC-007）| normal | Should（运营维护）| FACT + DECISION |\n| ST-016 | UJ-001 §2 L2 客服列 | 客服 / FA | 在客户咨询注册失败时 | 我希望通过 Live 800 协助排查（分支一致性 + 字段校验失败）| 以便恢复路径覆盖完整（G-5 + DEC-006）| handoff + recovery | Must（注册兜底）| FACT + AI_INFERENCE |\n| ST-017 | UJ-001 §2 L1 运营列 | 运营 | 在服务号后台查询关注 PV/UV 时 | 我希望服务号菜单带 utm 参数（utm_campaign=wfjAccount 等），以便分渠道归因 | 以便分渠道数据可视化（G-2 + DEC-008）| normal | Should（数据归因）| FACT + DECISION |\n| ST-018 | UJ-001 §2 L5 运营列 | 运营（CPC 团队）| 在 CPC 后台维护配置时 | 我希望 CBDT 召回 + Consent 条款 + 韩国专属条款可配置 + 可禁用（CPC CR 配置开关）| 以便 FSAN/WFJ 共享召回逻辑 + 可禁用回退（G-6 + DEC-005）| alternative | Must（CPC CR 配置）| FACT + DECISION |\n| ST-019 | UJ-001 §2 L3 运营列 | 运营 | 在 OAB 后台维护服务类型-店铺-场次关联规则时 | 我希望关联规则明确 + 可灰度 / 可回滚 | 以便配置变更不破坏预约 + 可回滚（G-6 + DEC-009）| alternative | Should（OAB 规则配置）| FACT + AI_INFERENCE |\n| ST-020 | UJ-001 §2 L6 运营列 | 运营 | 在 OAB 后台维护半屏入口配置时 | 我希望仅 store locator 入口支持半屏（下期可扩展其他入口），且可关闭回 H5 | 以便半屏入口可灰度 + 可回退（G-4 + DEC-003 + DEC-103）| alternative | Should（半屏入口配置）| FACT + DECISION |\n\n### 1.1 按角色分组的故事清单\n\n#### 游客（Guest）\n\n- **ST-002**（Must）：在 my account / wishlist / OAB / suggestion board / DP 等需要权限的页面，我希望通过 my account 入口 + 注册弹窗完成微信授权手机号注册，以便路径 ≤2 步完成注册 + UI 一致（G-5 + DEC-002）\n- **ST-003**（Must）：在注册弹窗中点击「拒绝」隐私保护指引时，我希望通过验证手机号（手机号 + 验证码 + 姓名 + 居住地）完成注册，以便拒绝隐私指引的用户仍可注册（G-5 + DEC-002）\n- **ST-004**（Must）：在 my account / CHANEL\u0026moi / Moodboard/PDP/PLP / store locator / BRAND ZONE / POST 二维码入口触发 OAB 时，我希望完成注册（如未注册）+ 创建 OAB 预约（服务类型 + 精品店 + 日期与时间 + 备注 + 二次确认），以便 4 类入口统一体验 + 路径 ≤3 步（G-4 + DEC-103）\n- **ST-007**（Must）：在 2021-11-01 前 H5 注册客户首次进入 WFJ MP 时，我希望看到 CBDT 召回弹窗（仅一次性，FSN/WFJ 任一弹过且有效操作后不再弹出），以便满足 CPC 合规召回 + 一次性弹窗语义清晰（DEC-005）\n- **ST-008**（Must）：在注册流程中，我希望看到动态 Consent 条款（含 8 类条款 + 韩国专属条款联动），以便支持 CPC Consent 动态化 + 韩国合规（DEC-005 + G-6）\n- **ST-010**（Should）：在 store locator 精品店详情页点击\"预约服务\"时，我希望通过半屏原生呼起 OAB 创建流程（未注册 → 半屏 + 注册弹窗；已注册 → 直接半屏创建），以便原生半屏路径 ≤2 步（G-4 + DEC-103）\n- **ST-011**（Must）：在 OAB 创建过程中，我希望遇到时段满额 / 当日已有预约 / 不可预约等异常时，看到明确兜底弹窗（4 类失败语义），以便失败兜底清晰 + 可重新选择（DEC-006）\n- **ST-013**（Must）：在首次进入 WFJ MP（外部入口：POST 推文 / 服务号菜单 / store locator / 历史 OAB H5 链接）时，我希望进入原生 MP 而非 H5，且关注入口多触点可见（my account 注册入口 + 服务号关注卡片），以便原生体验 + 关注转化提升（DEC-003 + DEC-103）\n\n#### 注册用户（Registered Member）\n\n- **ST-001**（Must）：在服务号菜单点击进入 my account 时，我希望看到 4 处入口关注卡片（my account / 注册成功页 / 预约成功页 / my account 已注册区），以便提升服务号关注转化率（DEC-003）\n- **ST-005**（Must）：在预约成功 + Day-1 10:00 收到服务号通知时，我希望收到预约成功通知（关注服务号后）+ Day-1 提醒通知（仅已关注用户），通知含模板字段（≤20 字段不截断），以便通知触达 + 失效/取消页可重新预约（G-3 + DEC-004）\n- **ST-006**（Must）：在 my account \"我的预约服务\" 入口时，我希望查看未完成预约列表 + 详情（含店铺位置）+ 修改 + 取消（含二次取消确认），以便 OAB 全生命周期管理（G-3 + DEC-004）\n- **ST-009**（Must）：在 my account \"编辑个人信息\" 入口时，我希望看到 CBDT 条款设置 + 偏好设置（多渠道勾选 iframe），以便支持 Consent 偏好动态管理 + 韩国专属联动（DEC-005 + G-6）\n- **ST-012**（Must）：在预约已失效 / 已取消时，我希望看到失效 / 取消页（含\"店铺预约\"重新创建入口 + 400 号码联系 FA 入口），以便可重新预约 + 兜底清晰（DEC-006）\n\n#### 客服 / FA（Customer Service / Field Ambassador）\n\n- **ST-014**（Must）：在客户咨询 OAB 创建 / 修改 / 取消失败时，我希望通过 Live 800 + OAB Portal 双系统介入排障，以便恢复路径覆盖完整（DEC-006）\n- **ST-015**（Should）：在维护通知模板时，我希望字段管理清晰（≤20 字段不截断）+ 优先级符合 SLA（P1 1h 响应 / P2 2h 响应），以便通知维护 + 故障排障（SLA P1/P2，DEC-007）\n- **ST-016**（Must）：在客户咨询注册失败时，我希望通过 Live 800 协助排查（分支一致性 + 字段校验失败），以便恢复路径覆盖完整（DEC-006）\n\n#### 运营（Operations）\n\n- **ST-017**（Should）：在服务号后台查询关注 PV/UV 时，我希望服务号菜单带 utm 参数（utm_campaign=wfjAccount 等），以便分渠道归因（DEC-008）\n- **ST-018**（Must）：在 CPC 后台维护配置时，我希望 CBDT 召回 + Consent 条款 + 韩国专属条款可配置 + 可禁用（CPC CR 配置开关），以便 FSAN/WFJ 共享召回逻辑 + 可禁用回退（DEC-005）\n- **ST-019**（Should）：在 OAB 后台维护服务类型-店铺-场次关联规则时，我希望关联规则明确 + 可灰度 / 可回滚，以便配置变更不破坏预约 + 可回滚（DEC-009）\n- **ST-020**（Should）：在 OAB 后台维护半屏入口配置时，我希望仅 store locator 入口支持半屏（下期可扩展其他入口），且可关闭回 H5，以便半屏入口可灰度 + 可回退（DEC-003 + DEC-103）\n\n## 2. 旅程→故事覆盖矩阵\n\n| 旅程条目（阶段×角色）| 对应故事 ID | 覆盖状态 | 未覆盖原因 |\n|---|---|---|---|\n| UJ-001 §2 L1 游客列（首次进入）| ST-013 | 已覆盖 | — |\n| UJ-001 §2 L1 注册用户列（首次进入）| ST-001 + ST-013 | 已覆盖 | — |\n| UJ-001 §2 L1 运营列（首次进入）| ST-017 | 已覆盖 | — |\n| UJ-001 §2 L2 游客列（注册流程）| ST-002 + ST-003 + ST-008 | 已覆盖 | — |\n| UJ-001 §2 L2 注册用户列（注册流程）| ST-009 | 已覆盖 | — |\n| UJ-001 §2 L2 运营列（注册流程）| ST-018 | 已覆盖 | — |\n| UJ-001 §2 L2 客服列（注册流程）| ST-016 | 已覆盖 | — |\n| UJ-001 §2 L3 游客列（OAB 创建）| ST-004 + ST-011 | 已覆盖 | — |\n| UJ-001 §2 L3 注册用户列（OAB 创建）| ST-004 + ST-011 | 已覆盖 | — |\n| UJ-001 §2 L3 客服列（OAB 创建）| ST-014 | 已覆盖 | — |\n| UJ-001 §2 L3 运营列（OAB 创建）| ST-019 | 已覆盖 | — |\n| UJ-001 §2 L4 游客列（OAB 通知 / 列表 / 详情 / 修改 / 取消）| ST-005 + ST-006 + ST-012 | 已覆盖 | — |\n| UJ-001 §2 L4 注册用户列（OAB 通知 / 列表 / 详情 / 修改 / 取消）| ST-005 + ST-006 + ST-012 | 已覆盖 | — |\n| UJ-001 §2 L4 客服列（OAB 通知）| ST-014 + ST-015 | 已覆盖 | — |\n| UJ-001 §2 L4 运 升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①任何主流程步骤数超过 6 步（提示流程过度，需重构）；②任何异常路径无恢复路径（违反 constitution ④）；③任何分支条件引用未在 FE-001 / US-001 出现（违反来源可追溯）。 | FACT | FE-001 §3 + US-001 §1 + SRC-003 §2 | PM-Office | 任一停止条件命中即回流重做 |\n\n## 0. 预检输入充分度判定\n\n- 上游产物：FE-001（confirmed）+ US-001（confirmed）+ UJ-001（confirmed）+ BG-001（confirmed）\n- 已确认功能清单数：37 项（FEA-001~037；P0 = 25 + P1 = 12）\n- 判定：充分模式（基于 FE-001 confirmed 37 项功能；本期分解 5 主流程 + 14 分支 + 9 异常；全部引用 FEA-XXX，不重新定义功能）\n\n## 1. 范围引用（上游）\n\n\u003e 上游功能清单已在 feature-list 确认。本步骤只引用，不重新定义功能。\n\n| 引用 | 内容 |\n|---|---|\n| 上游功能清单 | `FE-001 §1 FEA-001~037`（共 37 项功能，P0 = 25 项 + P1 = 12 项）|\n| 关联用户故事 | `US-001 §1 ST-001~020`（共 20 条故事，Must 12 + Should 8）|\n| 关联旅程条目 | `UJ-001 §2 4 角色 × 6 阶段 = 24 个旅程条目` |\n\n## 2. 主流程（P0）\n\n### 2.1 FLOW-A：注册流程（微信授权 + 验证手机号 + 3 场景 UI 一致）\n\n```text\nA1. [游客] 进入 my account / wishlist / OAB / suggestion board / DP 等需要权限的页面（FEA-027 多入口打通）\nA2. 触发注册弹窗（FEA-002 / FEA-003 / FEA-004 UI 一致）\nA3. 点击「注册」→ 隐私保护指引弹窗\n   A3-a. 点击「同意」→ 微信授权手机号（A4）\n   A3-b. 点击「拒绝」→ 验证手机号（A5）\nA4. [微信授权] 选择愿意授权的手机号 → 协议勾选（第一个必选）→ 点击「确认」（所有必填项非空确认键从置灰转高亮，FEA-005）\nA5. [验证手机号] 填写手机号 + 获取并填写验证码 + 姓名 + 目前居住地（FEA-003 / FEA-005）\nA6. 进入注册成功页（含 4 处入口关注卡片植入，FEA-001）\nA7. 注册成功埋点（FEA-036）\n```\n\n#### 2.1 步骤说明\n\n| 步骤 | 操作 | 系统行为 | 涉及功能 FEA | 状态 | 备注 |\n|---|---|---|---|---|---|\n| A1 | 进入需要权限的页面 | 路由检测 + 游客身份判定 | FEA-027 | P0 | 4 类入口统一体验 |\n| A2 | 触发注册弹窗 | 展示统一组件（my account / OAB / CHANEL\u0026moi 三场景 UI 一致） | FEA-002 / FEA-003 / FEA-004 | P0 | DEC-103 UI 一致规则 |\n| A3 | 点击「注册」→ 隐私保护指引 | 显示隐私保护指引弹窗 | FEA-002 / FEA-003 | P0 | 用户选择路径分支 |\n| A4 | 微信授权手机号 | 调用微信授权 API → 获取手机号 → 协议勾选 | FEA-002 / FEA-005 | P0 | 主路径分支 |\n| A5 | 验证手机号 | 调用短信验证码 API + 字段校验 | FEA-003 / FEA-005 | P0 | 备选路径分支 |\n| A6 | 注册成功页 | 显示注册成功 + 关注卡片 4 处入口之一 | FEA-001 / FEA-002 / FEA-003 | P0 | DEC-003 关注转化 |\n| A7 | 注册成功埋点 | 上报注册转化率 + 失败语义 | FEA-036 | P0 | DEC-103 数据埋点 |\n\n### 2.2 FLOW-B：OAB 创建预约（4 类入口 + 二次确认 + 4 类异常）\n\n```text\nB1. [游客/注册用户] 通过 my account / CHANEL\u0026moi / Moodboard/PDP/PLP / store loc 提醒通知 | 服务号通知（仅已关注 + FA 未标记已完成）| FEA-010 | P0 | 通知规则 |\n\n### 2.4 FLOW-D：CPC Consent 设置（CBDT 召回 + Consent 动态化 + 韩国专属）\n\n```text\nD1. [2021-11-01 前 H5 注册客户] 首次进入 WFJ MP → CBDT 召回弹窗（FEA-018，一次性）\n   D1-a. FSN/WFJ 任一弹过且有效操作后不再弹出（DEC-005）\n   D1-b. 点击「同意并继续」 → 进入首页\n   D1-c. 点击「拒绝」 → 进入首页（不授权）\n   D1-d. 点击「香奈儿组织」/「隐私政策」 → 查看对应条款\nD2. [注册流程] 触发注册弹窗 → 隐私保护指引 → 协议勾选（含 8 类动态条款 + 韩国专属条款联动，FEA-019 / FEA-020）\nD3. [注册用户编辑个人信息] → 编辑个人信息页 → CBDT 条款设置（FEA-021）+ 偏好设置（FEA-022 多渠道勾选 iframe）+ 韩国专属条款联动（FEA-023）\n```\n\n#### 2.4 步骤说明\n\n| 步骤 | 操作 | 系统行为 | 涉及功能 FEA | 状态 | 备注 |\n|---|---|---|---|---|---|\n| D1 | CBDT 召回弹窗 | 仅 2021-11-01 前 H5 注册客户一次性弹出 | FEA-018 | P0 | DEC-005 一次性规则 |\n| D1-a | FSN/WFJ 共享召回 | CPC 后台共享召回状态 | FEA-018 | P0 | FSN 联动 |\n| D1-b | 同意并继续 | 记录授权 + 进入首页 | FEA-018 | P0 | 用户决策 |\n| D1-c | 拒绝 | 不记录授权 + 进入首页 | FEA-018 | P0 | 用户决策 |\n| D1-d | 查看条款 | 跳转条款详情页 | FEA-018 | P0 | 条款查看 |\n| D2 | 注册流程 Consent | 动态展示 8 类条款 + 韩国专属条款联动 | FEA-019 / FEA-020 | P0 | DEC-005 动态化 |\n| D3 | 编辑个人信息 | CBDT 条款设置 + 偏好设置 + 韩国专属条款联动 | FEA-021 / FEA-022 / FEA-023 | P0 | 编辑场景 |\n\n### 2.5 FLOW-E：OAB 半屏（store locator，未注册 + 已注册）\n\n```text\nE1. [游客/注册用户] 进入 store locator → 点击「附近店铺」 → 店铺详情页\nE2. [游客/注册用户] 点击店铺详情页「预约服务」（FEA-024）\nE3. [游客] 未注册 → OAB 半屏 + 注册弹窗（FLOW-A，FEA-025）\n   [注册用户] 已注册 → 直接进入 OAB 半屏创建预约（FEA-026）\nE4. 创建预约步骤同 FLOW-B B3-B7\nE5. 预约成功埋点（FEA-037）\n```\n\n#### 2.5 步骤说明\n\n| 步骤 | 操作 | 系统行为 | 涉及功能 FEA | 状态 | 备注 |\n|---|---|---|---|---|---|\n| E1 | 进入 store locator | 店铺列表 + 附近店铺定位 | FEA-027 | P0 | 入口统一 |\n| E2 | 点击「预约服务」 | 唤起 OAB 半屏 | FEA-024 | P1 | 仅 store locator 入口 |\n| E3 | 注册场景处理 | 游客 → 半屏 + 注册流程；注册用户 → 直接半屏创建 | FEA-025 / FEA-026 | P1 | DEC-103 半屏路径 |\n| E4 | 创建预约 | 复用 FLOW-B B3-B7 | FEA-006 / FEA-008 | P0 | 主流程复用 |\n| E5 | 预约成功埋点 | 上报半屏预约成功率 + 失败语义 | FEA-037 | P0 | DEC-103 数据埋点 |\n\n## 3. 分支流程\n\n| 分支条件 | 分支描述 | 涉及 FEA | 来源 |\n|---|---|---|---|\n| B-A1：注册时点击「拒绝」隐私保护指引 | 走验证手机号注册流程（A5）| FEA-003 / FEA-005 | SRC-001 §2.3 + SRC-003 §1.4 |\n| B-A2：注册协议第一个未勾选 | 「确认」键置灰不可点击 | FEA-005 | SRC let currentReq = null;
let currentTier = 'l2';

function badgeFor(path) {
  if (path.includes('003-prd-output')) return ['pd', 'PRD'];
  if (path.includes('99-review/review-')) return ['rev', 'REV'];
  if (path.includes('99-review/change-')) return ['rev', 'CHG'];
  if (path.includes('99-review/support/')) return ['rev', 'ISS'];
  if (path.includes('99-review/.hash-anchor')) return ['rev', 'HSH'];
  if (path.includes('00-input/intake-decision')) return ['in', 'IN'];
  if (path.includes('00-input/source-register')) return ['in', 'SRC'];
  if (path.includes('00-input/SRC-')) return ['in', 'SRC'];
  return ['ok', '✓'];
}

function fileItemHtml(f) {
  const [cls, txt] = badgeFor(f.path);
  return `<div class="file-item" data-path="${f.path}">
    <span class="icon">📄</span>
    <span class="name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.path.split('/').pop()}</span>
    <span class="badge ${cls}">${txt}</span>
  </div>`;
}

function buildReqBar() {
  const bar = document.getElementById('reqBar');
  bar.innerHTML = REQS.map((r, i) => {
    const tier = TIER_META[r.tier];
    return `<button class="req-tab${i === 0 ? ' active' : ''}" data-idx="${i}">
      ${r.name}<span class="r-tier ${r.tier}">${r.tier.toUpperCase()}</span>
    </button>`;
  }).join('');
  bar.querySelectorAll('.req-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      bar.querySelectorAll('.req-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      selectReq(parseInt(tab.dataset.idx, 10));
    });
  });
}

function buildTierBar() {
  const bar = document.getElementById('tierBar');
  const order = ['overview', 'l0', 'l1', 'l2'];
  bar.innerHTML = order.map(t => {
    if (t === 'overview') {
      return `<button class="tier-tab overview${t === currentTier ? ' active' : ''}" data-tier="overview">
        <span class="code">📋 概览（自动）</span>
        <span class="desc">从 README + intake + manifest 拼装</span>
      </button>`;
    }
    const m = TIER_META[t];
    const actual = currentReq && currentReq.tier === t;
    return `<button class="tier-tab ${t}${t === currentTier ? ' active' : ''}${actual ? ' actual' : ''}" data-tier="${t}">
      <span class="code">${m.label}</span>
      <span class="desc">${m.count}${actual ? ' · 本需求实际档位' : ''}</span>
    </button>`;
  }).join('');
  bar.querySelectorAll('.tier-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentTier = tab.dataset.tier;
      renderTier();
    });
  });
}

function buildTree() {
  const tree = document.getElementById('fileTree');
  tree.innerHTML = '';
  if (!currentReq) return;

  // 概览 tab：按产物角色分组（输入/主产物/评审记录），而不是混在一组里
  if (currentTier === 'overview') {
    const allFiles = currentReq.files.slice().sort((a, b) => a.path.localeCompare(b.path));
    const buckets = {
      input:    [],   // IN / SRC — intake / 源材料登记 / 飞书 BRD 副本
      product:  [],   // ✓ (中间产物) / PRD (最终交付)
      review:   [],   // REV / CHG / ISS / HSH — 评审记录 / 变更记录 / issue / hash anchor
    };
    for (const f of allFiles) {
      const [cls] = badgeFor(f.path);
      if (cls === 'in')        buckets.input.push(f);
      else if (cls === 'rev')  buckets.review.push(f);
      else                     buckets.product.push(f);
    }
    const groupSpec = [
      { key: 'product', label: '🎯 主产物（含最终 PRD）',  color: '#3d6bce' },
      { key: 'input',   label: '📥 输入与源材料（IN/SRC）', color: '#92580A' },
      { key: 'review',  label: '📁 评审与变更记录（REV/CHG/ISS）', color: '#654ACB' },
    ];
    for (const spec of groupSpec) {
      const files = buckets[spec.key];
      if (!files.length) continue;
      const group = document.createElement('div');
      group.className = 'folder-group tier-active';
      group.innerHTML = `
        <div class="folder-h" style="border-left:3px solid ${spec.color}" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="arrow">▶</span>
          <span>${spec.label}</span>
          <span class="count">${files.length} files</span>
        </div>
        <div class="folder-body">${files.map(f => fileItemHtml(f)).join('')}</div>`;
      tree.appendChild(group);
    }
    tree.querySelectorAll('.file-item').forEach(el => {
      el.addEventListener('click', () => {
        showFile(el.dataset.path);
        tree.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
      });
    });
    return;
  }

  const meta = TIER_META[currentTier];
  const tierPaths = currentReq.tier_files[currentTier] || [];
  const tierFiles = tierPaths.map(p => currentReq.files.find(f => f.path === p)).filter(Boolean);

  // 1. 档位产物（置顶高亮）
  const tierGroup = document.createElement('div');
  tierGroup.className = 'folder-group tier-active';
  tierGroup.innerHTML = `
    <div class="folder-h" style="border-left:3px solid ${meta.color}" onclick="this.parentElement.classList.toggle('collapsed')">
      <span class="arrow">▶</span>
      <span>🎯 ${meta.label}产物</span>
      <span class="count">${tierFiles.length} files</span>
    </div>
    <div class="folder-body">${tierFiles.map(f => fileItemHtml(f)).join('')}</div>`;
  tree.appendChild(tierGroup);

  // 2. 共用材料
  const commonPaths = currentReq.common_files || [];
  const commonFiles = commonPaths.map(p => currentReq.files.find(f => f.path === p)).filter(Boolean);
  if (commonFiles.length) {
    const cg = document.createElement('div');
    cg.className = 'folder-group';
    cg.innerHTML = `
      <div class="folder-h" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="arrow">▶</span>
        <span>📁 共用材料（输入 + 评审）</span>
        <span class="count">${commonFiles.length} files</span>
      </div>
      <div class="folder-body">${commonFiles.map(f => fileItemHtml(f)).join('')}</div>`;
    tree.appendChild(cg);
  }

  tree.querySelectorAll('.file-item').forEach(el => {
    el.addEventListener('click', () => {
      showFile(el.dataset.path);
      tree.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
    });
  });
}

function showFile(path) {
  const f = currentReq.files.find(x => x.path === path);
  if (!f) return;
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="content-header">
      <div class="breadcrumb"><b>${currentReq.name}</b> › ${f.path.split('/').join(' › ')}</div>
    </div>
    <div class="md-render" id="mdRender"></div>`;
  document.getElementById('mdRender').innerHTML = md2html(f.content);
  area.scrollTop = 0;
}

function showOverview() {
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="content-header">
      <div class="breadcrumb"><b>${currentReq.name}</b> › 📋 概览（自动拼装）</div>
    </div>
    <div class="auto-overview-banner">📋 需求概览（自动拼装） · AI 不注入业务事实，所有字段均来自 README / intake / manifest / prd.md frontmatter</div>
    <div class="md-render" id="mdRender"></div>`;
  document.getElementById('mdRender').innerHTML = md2html(currentReq.overview_md || '> 概览未生成');
  area.scrollTop = 0;
}

function renderTier() {
  const area = document.getElementById('contentArea');
  if (currentTier === 'overview') {
    area.innerHTML = `<div class="tier-panel active"><div class="overview-placeholder">rendering…</div></div>`;
    buildTierBar();
    buildTree();
    showOverview();
    document.getElementById('fileSearch').value = '';
    area.scrollTop = 0;
    return;
  }
  area.innerHTML = `<div class="tier-panel active">${TIER_HTML[currentTier]}</div>`;
  // SVG 默认适应当前容器；原始尺寸保留在流程面板内横向滚动。
  const panel = area.querySelector('.tier-panel');
  const svg = panel.querySelector('svg');
  if (svg) {
    const vb = svg.viewBox.baseVal;
    const originalWidth = vb && vb.width ? vb.width : svg.getAttribute('width');
    let fit = true;
    svg.dataset.size = 'fit';
    svg.removeAttribute('width');
    const wrap = document.createElement('div');
    wrap.className = 'svg-toolbar';
    wrap.innerHTML = `<button class="svg-fit-btn" type="button">原始尺寸（1:1）</button><span class="svg-hint">默认适应宽度 · 点按钮切 1:1</span>`;
    wrap.querySelector('.svg-fit-btn').addEventListener('click', () => {
      fit = !fit;
      svg.dataset.size = fit ? 'fit' : 'original';
      if (fit) svg.removeAttribute('width');
      else if (originalWidth) svg.setAttribute('width', originalWidth);
      wrap.querySelector('.svg-fit-btn').textContent = fit ? '原始尺寸（1:1）' : '适应宽度';
      wrap.querySelector('.svg-hint').textContent = fit ? '默认适应宽度 · 点按钮切 1:1' : '原始尺寸 · 可在此区域横向滚动查看';
    });
    svg.parentNode.insertBefore(wrap, svg);
  }
  buildTierBar();
  buildTree();
  document.getElementById('fileSearch').value = '';
  area.scrollTop = 0;
}

function selectReq(idx) {
  currentReq = REQS[idx];
  currentTier = 'overview';   // 默认切到 📋 概览 tab（用户选择）
  renderTier();
}

function filterFiles(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.file-item').forEach(el => {
    el.style.display = (!q || el.dataset.path.toLowerCase().includes(q)) ? '' : 'none';
  });
}

document.addEventListener('DOMContentLoaded', () => {
  buildReqBar();
  if (REQS.length) selectReq(0);
  document.getElementById('fileSearch').addEventListener('input', (e) => filterFiles(e.target.value));
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.querySelector('.wrap').classList.toggle('sidebar-collapsed');
  });
});

</script>
</body>
</html>
