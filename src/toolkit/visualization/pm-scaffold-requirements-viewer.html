<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Scaffold · 三档流程与产物查看器</title>
<style>
:root{
  --bg:#f7f8fc;
  --bg-card:#ffffff;
  --bg-soft:#f1f3f9;
  --bg-code:#1f2937;
  --border:#e2e8f0;
  --border-strong:#cbd5e1;
  --text:#1f2937;
  --text-soft:#4b5563;
  --text-mute:#94a3b8;
  --primary:#3d6bce;
  --primary-soft:#dbeafe;
  --primary-strong:#1e40af;
  --accent-process:#e67e22;
  --accent-process-soft:#fff3e0;
  --accent-stage1:#10b981;
  --accent-stage1-soft:#d1fae5;
  --accent-stage2:#8b5cf6;
  --accent-stage3:#ec4899;
  --l0:#10b981;
  --l0-soft:#d1fae5;
  --l0-strong:#065f46;
  --l1:#f59e0b;
  --l1-soft:#fef3c7;
  --l1-strong:#92400e;
  --l2:#3d6bce;
  --l2-soft:#dbeafe;
  --l2-strong:#1e40af;
  --danger:#ef4444;
  --danger-soft:#fee2e2;
  --warning:#f59e0b;
  --warning-soft:#fef3c7;
  --ok:#10b981;
  --ok-soft:#d1fae5;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI","Noto Sans CJK SC",sans-serif;color:var(--text);line-height:1.65;font-size:13.5px}
.wrap{display:flex;flex-direction:column;height:100vh;min-height:0}
@supports (height:100dvh){.wrap{height:100dvh}}

/* ===== 顶部 Hero 头 ===== */
header{padding:20px 28px;background:linear-gradient(135deg,#1e293b 0%,#3d6bce 50%,#10b981 100%);color:#fff;flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 0 rgba(0,0,0,.04)}
header h1{font-size:19px;font-weight:700;letter-spacing:.3px;color:#fff;display:flex;align-items:center;gap:8px}
header h1 .ver{font-size:10px;font-weight:600;color:#cbd5e1;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:4px;letter-spacing:1px}
header .sub{color:#cbd5e1;font-size:12.5px;margin-left:auto}
.tag{font-size:10.5px;padding:3px 9px;border-radius:4px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;letter-spacing:.5px}
.tag.green{background:var(--l0-soft);color:var(--l0-strong)}
.tag.amber{background:var(--l1-soft);color:var(--l1-strong)}
.tag.l2{background:var(--l2-soft);color:var(--l2-strong)}

/* ===== 需求切换器（暗色条） ===== */
.req-bar{display:flex;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);flex:0 0 auto;padding:7px 14px;gap:6px;overflow-x:auto;border-bottom:1px solid #0f172a}
.req-tab{border:1px solid transparent;border-radius:6px;background:transparent;padding:7px 13px;cursor:pointer;color:#cbd5e1;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.req-tab:hover{background:#1e293b;color:#fff;border-color:#475569}
.req-tab.active{background:#334155;color:#fff;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.req-tab .r-tier{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:5px;letter-spacing:.5px}
.req-tab .r-tier.l0{background:var(--l0);color:#fff}
.req-tab .r-tier.l1{background:var(--l1);color:#422006}
.req-tab .r-tier.l2{background:var(--l2);color:#fff}

/* ===== 三档 tab 条（卡片化 segmented） ===== */
.tier-bar{display:flex;background:var(--bg-card);border-bottom:1px solid var(--border);flex:0 0 auto;padding:10px 14px;gap:8px;overflow-x:auto;align-items:stretch;border-top:1px solid var(--border)}
.tier-tab{border:1.5px solid var(--border);border-radius:8px;background:var(--bg-card);padding:8px 14px;cursor:pointer;color:var(--text-soft);font:inherit;font-size:12px;font-weight:600;flex:0 1 auto;min-width:160px;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:2px}
.tier-tab:hover{border-color:var(--border-strong);background:var(--bg-soft)}
.tier-tab.active{border-color:var(--l2);background:var(--l2-soft);box-shadow:var(--shadow)}
.tier-tab.active.l0{border-color:var(--l0);background:var(--l0-soft)}
.tier-tab.active.l1{border-color:var(--l1);background:var(--l1-soft)}
.tier-tab.active.l2{border-color:var(--l2);background:var(--l2-soft)}
.tier-tab .code{display:block;font-family:"SF Mono",Menlo,monospace;font-size:10.5px;color:var(--text-mute);letter-spacing:.5px;font-weight:700}
.tier-tab.active .code{color:var(--l2-strong)}
.tier-tab.active.l0 .code{color:var(--l0-strong)}
.tier-tab.active.l1 .code{color:var(--l1-strong)}
.tier-tab.active.l2 .code{color:var(--l2-strong)}
.tier-tab .desc{display:block;font-size:11.5px;color:var(--text-soft);font-weight:600;line-height:1.4}
.tier-tab .meta{display:flex;gap:5px;margin-top:4px}
.tier-tab .meta span{font-size:10px;background:var(--bg-soft);color:var(--text-soft);padding:1px 6px;border-radius:3px;font-weight:700}
.tier-tab.overview{border-color:var(--primary);background:linear-gradient(135deg,#eef2ff 0%,#dbeafe 100%)}
.tier-tab.overview .code{color:var(--primary)}
.tier-tab.overview .desc{color:#1e40af;font-weight:600}
.tier-tab.overview.active{border-color:var(--primary);background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 100%);box-shadow:0 0 0 2px rgba(61,107,206,.18),var(--shadow)}
.tier-tab.overview.active .code{color:#1e3a8a}
.tier-tab.overview.active .desc{color:#1e40af}
.overview-placeholder{padding:30px;text-align:center;color:var(--text-mute);font-size:12.5px}
.auto-overview-banner{margin:18px 28px 0;padding:10px 14px;background:linear-gradient(135deg,#eef2ff 0%,#dbeafe 100%);border:1px solid var(--primary);border-radius:8px;font-size:12px;font-weight:700;color:#1e3a8a;letter-spacing:.3px}

/* ===== 主区 ===== */
.main{flex:1;display:flex;overflow:hidden;min-height:0;min-width:0}
.sidebar-toggle{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:6px;width:32px;height:32px;font-size:15px;cursor:pointer;color:#fff;flex:0 0 auto;line-height:1;transition:background .15s}
.sidebar-toggle:hover{background:rgba(255,255,255,.28)}
.wrap.sidebar-collapsed .sidebar{display:none}
.sidebar{width:320px;flex:0 0 320px;min-width:0;min-height:0;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);color:#cbd5e1;overflow-y:auto;display:flex;flex-direction:column;transition:flex-basis .15s ease;border-right:1px solid #0f172a}
.search-box{padding:12px;border-bottom:1px solid #334155;flex:0 0 auto}
.search-box input{width:100%;padding:8px 11px;border:1px solid #475569;border-radius:6px;font:inherit;font-size:12.5px;background:#1e293b;color:#e2e8f0}
.search-box input::placeholder{color:#94a3b8}
.search-box input:focus{outline:none;border-color:var(--primary);background:#0f172a}
.file-tree{flex:1;overflow-y:auto;padding:8px 0}
.folder-group{margin-bottom:4px}
.folder-h{display:flex;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.5px;color:#94a3b8;background:transparent;border-top:1px solid #1e293b;border-bottom:1px solid #1e293b;user-select:none;text-transform:uppercase}
.folder-h:hover{background:#1e293b;color:#e2e8f0}
.folder-group.tier-active .folder-h{color:#fff;background:#1e293b;border-top-color:#334155;border-bottom-color:#334155}
.folder-h .arrow{color:#94a3b8;font-size:9px;width:10px;transition:transform .15s}
.folder-group.collapsed .arrow{transform:rotate(-90deg)}
.folder-group.collapsed .folder-body{display:none}
.folder-h .count{margin-left:auto;font-size:10px;color:#64748b;font-weight:600;background:#0f172a;padding:1px 7px;border-radius:999px}
.file-item{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 28px;font-size:12.5px;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:background .12s,color .12s}
.file-item:hover{background:#1e293b;color:#fff;border-left-color:#475569}
.file-item.active{background:#334155;color:#fff;border-left-color:var(--primary);font-weight:600}
.file-item .icon{color:#94a3b8;font-size:10px;width:14px;flex:0 0 14px}
.file-item.active .icon{color:var(--primary)}
.file-item .badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;margin-left:auto;letter-spacing:.5px}
.file-item .badge.ok{background:var(--l0-soft);color:var(--l0-strong)}
.file-item .badge.pd{background:var(--l2-soft);color:var(--l2-strong);border:1px dashed var(--primary)}
.file-item .badge.rev{background:#475569;color:#cbd5e1;border:1px solid #64748b}
.file-item .badge.in{background:var(--warning-soft);color:#92580a}

/* ===== 主内容 ===== */
.content{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}
.content-header{padding:14px 26px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.breadcrumb{font-size:12.5px;color:var(--text-soft);font-family:"SF Mono",Menlo,monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breadcrumb b{color:var(--primary);font-weight:700}
.content-header .meta-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:4px;background:var(--primary-soft);color:var(--primary-strong);letter-spacing:.5px}

/* ===== 三档主面板 ===== */
.tier-panel{display:none;padding:24px 28px 60px;overflow-x:auto;min-width:0;max-width:1180px}
.tier-panel.active{display:block}

/* 三档 hero 介绍卡 */
.tier-intro{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin:0 0 18px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-left:5px solid var(--l2);border-radius:10px;min-width:0;box-shadow:var(--shadow)}
.tier-intro.l0{border-left-color:var(--l0)}
.tier-intro.l1{border-left-color:var(--l1)}
.tier-intro.l2{border-left-color:var(--l2)}
.tier-intro .lead{flex:1;min-width:0}
.tier-intro h3{font-size:17px;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px;font-weight:700}
.tier-intro h3 .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--bg-soft);color:var(--text-soft);letter-spacing:.5px}
.tier-intro.l0 h3 .badge{background:var(--l0-soft);color:var(--l0-strong)}
.tier-intro.l1 h3 .badge{background:var(--l1-soft);color:var(--l1-strong)}
.tier-intro.l2 h3 .badge{background:var(--l2-soft);color:var(--l2-strong)}
.tier-intro p{font-size:13px;color:var(--text-soft);line-height:1.65}
.tier-intro .out{flex:0 0 240px;font-size:12px;color:var(--text-soft);text-align:left;background:var(--bg-soft);border-radius:8px;padding:10px 12px}
.tier-intro .out b{display:block;color:var(--text);font-size:12.5px;margin-bottom:4px;font-weight:700}

/* Legend chips */
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-soft);margin-bottom:10px;align-items:center;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px}
.legend .chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg-soft);padding:3px 9px;border-radius:4px;font-weight:600}
.legend .chip b{color:var(--text);font-weight:700}
.lg{display:inline-block;width:18px;height:11px;border-radius:2px;border:1.5px solid var(--primary);background:var(--bg-card)}
.lg.term{background:var(--l0-soft);border-color:var(--l0);border-radius:8px;width:24px}
.lg.io{background:var(--l2-soft);border-color:var(--l2);transform:skew(-8deg)}
.lg.dec{background:var(--l1-soft);border-color:var(--l1);width:11px;height:11px;transform:rotate(45deg)}
.lg.opt{background:var(--warning-soft);border-color:var(--warning)}
.lg.loop{background:var(--danger-soft);border-color:var(--danger);border-style:dashed}

/* Flow diagram card */
.flow-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.flow-card h4{font-size:13px;color:var(--text-soft);margin:0 0 8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.flow-diagram{min-width:0}
.flow-diagram svg{display:block;width:100%;max-width:100%;height:auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px}
.flow-diagram svg[data-size="original"]{width:auto;max-width:none}
.flow-diagram svg text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.svg-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.svg-fit-btn{padding:5px 12px;border:1px solid var(--primary);border-radius:6px;background:var(--bg-card);color:var(--primary-strong);font-size:11.5px;font-weight:600;cursor:pointer}
.svg-fit-btn:hover{background:var(--primary-soft)}
.svg-hint{font-size:11.5px;color:var(--text-mute)}

/* optional skill grid (callout-like) */
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.opt-card{border:1px solid var(--warning);background:var(--warning-soft);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.opt-card b{color:#92580a;font-size:12.5px;display:block;margin-bottom:4px;font-weight:700}
.opt-card .opt-body{font-size:11.5px;color:var(--text-soft);line-height:1.6}
.opt-card .opt-tag{display:inline-block;font-size:9.5px;font-weight:700;background:var(--warning);color:#fff;padding:2px 7px;border-radius:4px;margin-bottom:5px;letter-spacing:.5px}

/* MD render — card look */
.md-render{padding:32px 36px 60px;max-width:1080px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin:0 0 20px;box-shadow:var(--shadow);overflow-x:auto;color:var(--text)}
.md-render h1{font-size:26px;line-height:1.3;margin:0 0 18px;color:var(--text);padding:0 0 12px 14px;border-left:5px solid var(--primary);font-weight:700;letter-spacing:-.2px}
.md-render h2{font-size:19px;line-height:1.35;margin:36px 0 14px;color:var(--text);padding:8px 0 8px 12px;background:linear-gradient(90deg,var(--primary-soft) 0%,transparent 70%);border-left:4px solid var(--primary);border-radius:0 6px 6px 0;font-weight:700}
/* 分节感：H* 与上方任意内容必须留出空间；与下方紧跟内容紧凑 */
.md-render h1 + h2,.md-render h1 + h3,.md-render h1 + h4,
.md-render p + h2,.md-render p + h3,.md-render p + h4,.md-render p + h5,.md-render p + h6,
.md-render ul + h2,.md-render ul + h3,.md-render ul + h4,.md-render ul + h5,
.md-render ol + h2,.md-render ol + h3,.md-render ol + h4,.md-render ol + h5,
.md-render table + h2,.md-render table + h3,.md-render table + h4,
.md-render blockquote + h2,.md-render blockquote + h3,.md-render blockquote + h4,
.md-render pre + h2,.md-render pre + h3,.md-render pre + h4,
.md-render details + h2,.md-render details + h3,.md-render details + h4,
.md-render hr + h2,.md-render hr + h3,.md-render hr + h4{margin-top:28px}
.md-render h2 + .applicability-card,.md-render h2 + blockquote,.md-render h2 + p,.md-render h2 + ul,.md-render h2 + ol,.md-render h2 + table,.md-render h2 + pre,.md-render h2 + .gov-section{margin-top:14px}
.md-render h3 + p,.md-render h3 + ul,.md-render h3 + ol,.md-render h3 + blockquote,.md-render h3 + .applicability-card,.md-render h3 + table,.md-render h3 + pre{margin-top:10px}
.md-render h4 + p,.md-render h4 + ul,.md-render h4 + ol,.md-render h4 + blockquote,.md-render h4 + .applicability-card,.md-render h4 + table,.md-render h4 + pre{margin-top:8px}
.md-render h5 + p,.md-render h5 + blockquote,.md-render h5 + .applicability-card{margin-top:6px}
.md-render h2:first-child,.md-render h3:first-child,.md-render h4:first-child{margin-top:8px}
.md-render h3{font-size:16px;line-height:1.35;margin:14px 0 6px;color:var(--primary-strong);font-weight:700;display:flex;align-items:center;gap:8px}
.md-render h3 + p{margin-top:6px}
.md-render h3::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);flex:0 0 6px}
.md-render h4{font-size:14px;line-height:1.4;margin:10px 0 4px;color:var(--text);font-weight:700;letter-spacing:.2px}
.md-render h4 + p{margin-top:4px}
.md-render h5{font-size:12.5px;line-height:1.4;margin:8px 0 3px;color:var(--text-soft);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.md-render h6{font-size:12px;line-height:1.4;margin:6px 0 3px;color:var(--text-mute);font-weight:600}
.md-render p{margin:10px 0;font-size:14px;line-height:1.8;color:var(--text)}
.md-render ul,.md-render ol{margin:12px 0 12px 26px;font-size:14px}
.md-render li{margin:5px 0;line-height:1.75;color:var(--text)}
.md-render li input[type=checkbox]{margin-right:6px;accent-color:var(--primary)}
.md-render blockquote{margin:14px 0;padding:12px 18px;border-left:5px solid var(--accent-process);background:var(--accent-process-soft);color:var(--text);font-size:13.5px;border-radius:0 8px 8px 0;line-height:1.7}
.md-render blockquote p{margin:0;color:var(--text);font-size:13.5px}
.md-render blockquote + blockquote{margin-top:-8px;border-top:1px dashed rgba(230,126,34,.25)}
.md-render blockquote:has(> p + p){padding-top:14px}
.md-render h4 + blockquote,.md-render h5 + blockquote{margin-top:6px}

/* applicability + placeholder blockquotes (L0 / L1 / L2 章节视觉标识) */
.md-render .applicability-card{margin:8px 0 12px;padding:8px 14px;background:var(--bg-soft);border:1px dashed var(--border-strong);border-radius:8px;font-size:12px}
.md-render .applicability-card summary{cursor:pointer;font-weight:700;color:var(--text-soft);font-size:12px;user-select:none;list-style:none;display:flex;align-items:center;gap:8px}
.md-render .applicability-card summary::-webkit-details-marker{display:none}
.md-render .applicability-summary-hint{color:var(--text-mute);font-weight:400;font-size:11px}
.md-render .applicability-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:#fff}
.md-render .badge-required{background:var(--primary)}
.md-render .badge-na{background:#94a3b8}
.md-render .badge-conditional{background:var(--accent-process)}
.md-render .applicability-body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:11.5px;line-height:1.6;color:var(--text-soft)}
.md-render .applicability-body .kv{display:flex;gap:10px;margin:3px 0;align-items:flex-start}
.md-render .applicability-body .kv-k{color:var(--primary-strong);font-weight:700;flex:0 0 130px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px}
.md-render .applicability-body .kv-v{color:var(--text);flex:1;word-break:break-word}
.md-render blockquote.na-block{border-left:5px solid #94a3b8;background:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);color:var(--text-soft);font-style:normal;position:relative;margin-top:18px}
.md-render blockquote.na-block::before{content:"本期不适用 · L1/L0 占位";position:absolute;top:-11px;left:14px;background:#94a3b8;color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:4px;letter-spacing:.5px;font-style:normal}
.md-render blockquote.l0-simplified{border-left:5px solid var(--accent-stage1);background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 100%);color:var(--text);font-style:normal;position:relative;margin-top:18px}
.md-render blockquote.l0-simplified::before{content:"L0 简化投影";position:absolute;top:-11px;left:14px;background:var(--accent-stage1);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:4px;letter-spacing:.5px;font-style:normal}
.md-render blockquote.source-citation{border-left:5px solid #64748b;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);color:var(--text-mute);font-style:normal;position:relative;margin-top:18px}
.md-render blockquote.source-citation::before{content:"来源说明";position:absolute;top:-11px;left:14px;background:#64748b;color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:4px;letter-spacing:.5px;font-style:normal}

/* Governance / audit sections — process metadata, not business fact */
.md-render .gov-section{margin:10px 0 14px;border:1px dashed #94a3b8;border-radius:8px;background:linear-gradient(135deg,#f8fafc 0%,#eef2ff 100%);padding:0}
.md-render .gov-section[open]{padding:0 0 4px}
.md-render .gov-section summary{cursor:pointer;padding:9px 14px;list-style:none;display:flex;align-items:center;gap:10px;user-select:none;font-weight:700;color:var(--text-soft);font-size:13px}
.md-render .gov-section summary::-webkit-details-marker{display:none}
.md-render .gov-section[open] summary{border-bottom:1px dashed #cbd5e1}
.md-render .gov-badge{display:inline-block;background:#94a3b8;color:#fff;padding:3px 9px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.5px}
.md-render .gov-title{color:var(--text);font-weight:700;font-size:13.5px}
.md-render .gov-body{padding:10px 16px 4px}
.md-render .gov-body p:first-child{margin-top:6px}
.md-render .gov-body > h1:first-child,.md-render .gov-body > h2:first-child,.md-render .gov-body > h3:first-child{margin-top:8px}
.md-render code.ic{background:#f1f5f9;padding:2px 8px;border-radius:4px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:#be185d;border:1px solid #e2e8f0;font-weight:600}
.md-render pre{background:var(--bg-code);color:#e2e8f0;border-radius:10px;padding:16px 20px;overflow-x:auto;margin:14px 0;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.7;border:1px solid #0f172a}
.md-render pre code{color:inherit;background:transparent;padding:0;border:0;font-weight:400;font-size:13px}
.md-render pre:before{content:attr(data-lang);display:block;font-size:10px;color:#94a3b8;margin-bottom:8px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.md-render table{margin:14px 0;font-size:13.5px;border:1px solid var(--border);border-radius:8px;overflow:hidden;width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}
.md-render thead th{background:var(--primary-soft);color:var(--primary-strong);font-size:12.5px;font-weight:700;padding:10px 14px;text-align:left;border-bottom:2px solid var(--primary);letter-spacing:.3px}
.md-render tbody tr:nth-child(odd) td{background:var(--bg-card)}
.md-render tbody tr:nth-child(even) td{background:#f8fafc}
.md-render td{padding:9px 14px;border-bottom:1px solid var(--border);word-break:break-word;overflow-wrap:break-word;color:var(--text)}
.md-render tbody tr:last-child td{border-bottom:0}
.md-render tbody tr:hover td{background:var(--primary-soft)!important}
.md-render hr{border:none;border-top:1px dashed var(--border-strong);margin:28px 0}
.md-render a{color:var(--primary-strong);text-decoration:none;border-bottom:1px dashed var(--primary);font-weight:600}
.md-render a:hover{border-bottom-style:solid;background:var(--primary-soft)}
.md-render .id-link{display:inline-block;background:var(--primary-soft);color:var(--primary-strong);padding:2px 8px;border-radius:4px;font-size:11.5px;font-family:"SF Mono",Menlo,Consolas,monospace;font-weight:700;margin:0 2px;cursor:help;border:1px solid #bfdbfe;letter-spacing:.2px}
.md-render .id-link:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.md-render .ks-tag{padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:700;background:var(--bg-soft);margin:0 2px;border:1px solid var(--border);color:var(--text-soft);letter-spacing:.3px}
.fm-block{margin:0 0 20px;padding:16px 20px;background:linear-gradient(135deg,var(--bg-soft) 0%,#eef2ff 100%);border:1px solid var(--border);border-radius:10px;border-left:5px solid var(--accent-process)}
.fm-title{font-size:12px;font-weight:700;color:var(--accent-process);margin-bottom:10px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.fm-table{margin:0;font-size:13px;table-layout:auto;width:100%;border-collapse:collapse}
.fm-table td{padding:5px 10px;border:none;border-bottom:1px solid rgba(226,232,240,.6)}
.fm-table tr:last-child td{border-bottom:0}
.fm-table td:first-child{width:160px;color:var(--text-mute);white-space:nowrap;font-weight:600}
.fm-table td:last-child{color:var(--text);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px}
.fm-block{margin:0 0 16px;padding:14px 16px;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px}
.fm-title{font-size:11.5px;font-weight:700;color:var(--primary-strong);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.fm-table{margin:0;font-size:12.5px;table-layout:auto;width:100%}
.fm-table td{padding:4px 8px;border:none}
.fm-table td:first-child{width:140px;color:var(--text-mute);white-space:nowrap;font-weight:600}

/* Empty state */
.empty-state{padding:80px 30px;text-align:center;color:var(--text-mute)}
.empty-state h2{font-size:20px;color:var(--text);margin-bottom:10px;font-weight:700}
.empty-state p{font-size:13.5px;margin-bottom:16px;color:var(--text-soft)}
.empty-state .hint{font-size:11.5px;color:var(--primary-strong);background:var(--primary-soft);padding:7px 14px;border-radius:6px;display:inline-block;border:1px solid #bfdbfe}

footer{padding:10px 22px;background:var(--bg-card);border-top:1px solid var(--border);color:var(--text-mute);font-size:11px;text-align:center;flex:0 0 auto}

@media (max-width:900px){
  header{padding:14px 16px;gap:10px}
  header h1{font-size:16px}
  header .sub{display:none}
  .main{flex-direction:column}
  .sidebar{width:100%;flex:0 0 auto;max-height:clamp(10rem,34dvh,18rem);border-right:0;border-bottom:1px solid #0f172a}
  .content{min-height:0}
  .content-header{padding:12px 16px}
  .tier-panel{padding:18px 14px 40px}
  .tier-intro{flex-direction:column}
  .tier-intro .out{margin-top:0;text-align:left;flex:0 0 auto;width:100%}
  .opt-grid{grid-template-columns:1fr}
  .md-render{padding:18px 18px 50px;border-radius:0;border-left:0;border-right:0}
}
@media (max-width:600px){
  .req-bar,.tier-bar{padding:6px 10px}
  .req-tab{padding:6px 10px;font-size:11.5px}
  .tier-tab{min-width:0;flex:1 1 0}
  .tier-tab .meta{display:none}
  .svg-toolbar{flex-wrap:wrap;gap:6px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <button class="sidebar-toggle" id="sidebarToggle" title="折叠/展开文件树" aria-label="切换文件树">☰</button>
  <h1>PM Scaffold · 三档流程与产物查看器 <span class="ver">v0.7.0</span></h1>
  <span class="sub">L0 / L1 / L2 分档 + 最新案例 · Hybrid migration + rebi</span>
  <span class="tag green">自包含 · 离线 · 可转发</span>
</header>
<div class="req-bar" id="reqBar" role="tablist"></div>
<div class="tier-bar" id="tierBar" role="tablist"></div>
<div class="main">
  <aside class="sidebar">
    <div class="search-box"><input type="text" id="fileSearch" placeholder="🔍 过滤文件名..." /></div>
    <div class="file-tree" id="fileTree"></div>
  </aside>
  <main class="content" id="contentArea"></main>
</div>
<footer>PM Scaffold · 三档流程对比与产物查看器 · 每档仅保留最新案例 · v0.7.0</footer>
</div>
<script>

const KS_COLORS = {
  FACT: '#0F8A4A', DECISION: '#3A2E8F', ASSUMPTION: '#92580A',
  AI_INFERENCE: '#A8542A', UNKNOWN: '#555555', CONFLICT: '#A23B3B',
};
const ID_REGEX = /\b(?:G-\d+|UJ-\d+|US-\d+|FEA-\d+|FF-\d+|ST-\d+|AC-\d+|BR-\d+|VL-\d+|EX-\d+|STATE-\d+|IX-\d+|PD-\d+|PR-\d+|SM-STATE-\d+|BG-\d+|FE-\d+|PRD-\d+|DEC-\d+|Q-\d+|RR-\d+|SCN-\d+|SRC-\d+)\b/g;

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function inlineMd(text) {
  const placeholders = [];
  const token = (safeHtml) => {
    const idx = placeholders.length;
    placeholders.push(safeHtml);
    return `\x00T${idx}\x00`;
  };

  // 1. inline code —— 内容只做转义，不再解析内嵌 markdown
  text = text.replace(/`([^`\n]+?)`/g, (_, c) => token(`<code class="ic">${escapeHtml(c)}</code>`));

  // 2. bold / italic —— 内容递归解析（支持嵌套，且每层都转义）
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, (_, c) => token(`<strong><em>${inlineMd(c)}</em></strong>`));
  text = text.replace(/\*\*(.+?)\*\*/g, (_, c) => token(`<strong>${inlineMd(c)}</strong>`));
  text = text.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, (m, p1, p2) => p1 + token(`<em>${inlineMd(p2)}</em>`));

  // 3. link —— label 递归解析；href 转义 + 拒绝危险 scheme
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
    const scheme = href.trim().toLowerCase().replace(/^([a-z][a-z0-9+.-]*):.*$/, '$1');
    if (scheme === 'javascript' || scheme === 'data' || scheme === 'vbscript') {
      return token(`<span class="id-link" title="blocked link">${inlineMd(label)}</span>`);
    }
    return token(`<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${inlineMd(label)}</a>`);
  });

  // 4. 转义剩余纯文本（此时 text 只剩 placeholder + 未处理的纯文本）
  text = escapeHtml(text);

  // 5. ID / 知识状态高亮 —— 只作用于已转义的纯文本，placeholder 不受影响
  text = text.replace(ID_REGEX, (m) => `<span class="id-link" title="${m}">${m}</span>`);
  Object.keys(KS_COLORS).forEach(k => {
    const re = new RegExp(`\\b${k}\\b`, 'g');
    text = text.replace(re, `<span class="ks-tag" style="color:${KS_COLORS[k]};font-weight:700">${k}</span>`);
  });

  // 6. 还原 placeholder（内部已是安全 HTML）
  text = text.replace(/\x00T(\d+)\x00/g, (_, i) => placeholders[parseInt(i, 10)]);
  return text;
}

function renderApplicability(raw) {
  // raw 形如 "status=required; basis=...; source=...; decided_by=...; decided_at=...; trigger=...; current_judgment=...; review_trigger=..."
  const rows = raw.split(';').map(s => s.trim()).filter(Boolean).map(kv => {
    const idx = kv.indexOf('=');
    if (idx < 0) return {k: kv, v: ''};
    return {k: kv.slice(0, idx).trim(), v: kv.slice(idx + 1).trim()};
  });
  const status = (rows.find(r => r.k === 'status') || {}).v || 'unknown';
  let badgeCls = 'applicability-badge';
  if (status === 'required') badgeCls += ' badge-required';
  else if (status === 'not_applicable') badgeCls += ' badge-na';
  else if (status === 'conditional') badgeCls += ' badge-conditional';
  const body = rows.map(r =>
    `<div class="kv"><span class="kv-k">${escapeHtml(r.k)}</span><span class="kv-v">${inlineMd(r.v || '—')}</span></div>`
  ).join('');
  return `<details class="applicability-card"><summary><span class="${badgeCls}">适用性 · ${escapeHtml(status)}</span><span class="applicability-summary-hint">（点击展开元数据）</span></summary><div class="applicability-body">${body}</div></details>`;
}

function md2html(md) {
  const fmMatch = md.match(/^---\n([\s\S]*?)\n---\n/);
  let frontmatter = '';
  if (fmMatch) { frontmatter = fmMatch[1]; md = md.slice(fmMatch[0].length); }
  const lines = md.split('\n');
  const blocks = [];
  let para = [];
  const flushPara = () => { if (para.length) { blocks.push({type:'p', text:para.join(' ').trim()}); para = []; } };
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    const appMatch = ln.match(/^<!--\s*applicability:\s*(.*?)\s*-->\s*$/);
    if (appMatch) { flushPara(); blocks.push({type:'applicability', text: appMatch[1]}); i++; continue; }
    if (/^```/.test(ln)) {
      flushPara();
      const lang = ln.replace(/^```/, '').trim();
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      blocks.push({type:'code', lang, text:buf.join('\n')}); i++; continue;
    }
    const hMatch = ln.match(/^(#{1,6})\s+(.+)$/);
    if (hMatch) { flushPara(); blocks.push({type:'h', level:hMatch[1].length, text:hMatch[2]}); i++; continue; }
    if (/^---+\s*$/.test(ln)) { flushPara(); blocks.push({type:'hr'}); i++; continue; }
    if (/^\|/.test(ln) && i + 1 < lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])) {
      flushPara(); const tBuf = [ln]; i++;
      while (i < lines.length && /^\|/.test(lines[i])) { tBuf.push(lines[i]); i++; }
      blocks.push({type:'table', lines:tBuf}); continue;
    }
    if (/^>\s?/.test(ln)) {
      flushPara(); const qBuf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { qBuf.push(lines[i].replace(/^>\s?/, '')); i++; }
      blocks.push({type:'quote', text:qBuf.join('\n')}); continue;
    }
    if (/^(\s*)([-*+]|\d+\.)\s+/.test(ln)) {
      flushPara(); const lBuf = [];
      while (i < lines.length && (/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}/.test(lines[i]) && lBuf.length))) {
        lBuf.push(lines[i]); i++;
      }
      blocks.push({type:'list', text:lBuf.join('\n')}); continue;
    }
    if (ln.trim() === '') { flushPara(); i++; continue; }
    para.push(ln); i++;
  }
  flushPara();
  // Governance chapter keywords — these are process / audit / source-trail
  // sections written into upstream files by the assembly skill. They are
  // NOT business facts and should be visually distinct from the real
  // functional content. Default-fold them and badge "治理元数据".
  const GOV_HEADING_RE = /^(产品质量增强记录|预检输入充分度判定|来源追溯|下游输入摘要|Constitution Compliance|Clarifications|版本变更摘要|涉及团队及职责总结|术语表|下游交接三视角)/;
  const inGovOpen = () => `<details class="gov-section"><summary><span class="gov-badge">🔧 治理元数据</span><span class="gov-title">`;
  const inGovClose = `</span></summary><div class="gov-body">`;
  const inGovEnd = `</div></details>`;
  let inGov = false;
  let html = '';
  const renderBlock = (b) => {
    if (b.type === 'h') return `<h${b.level}>${inlineMd(b.text)}</h${b.level}>`;
    if (b.type === 'p') return `<p>${inlineMd(b.text)}</p>`;
    if (b.type === 'hr') return '<hr>';
    if (b.type === 'code') return `<pre data-lang="${escapeHtml(b.lang)}"><code>${escapeHtml(b.text)}</code></pre>`;
    if (b.type === 'applicability') return renderApplicability(b.text);
    if (b.type === 'quote') {
      let cls = '';
      const firstLine = b.text.split('\n')[0];
      if (/^本期不适用[：:]/.test(firstLine)) cls = 'na-block';
      else if (/^L0\s*投影简化[：:]/.test(firstLine)) cls = 'l0-simplified';
      else if (/^本次变更来源[：:]/.test(firstLine) || /^变更来源[：:]/.test(firstLine)) cls = 'source-citation';
      const clsAttr = cls ? ` class="${cls}"` : '';
      return `<blockquote${clsAttr}>${inlineMd(b.text).replace(/\n/g, '<br>')}</blockquote>`;
    }
    if (b.type === 'list') return renderList(b.text);
    if (b.type === 'table') return renderTable(b.lines);
    return '';
  };
  for (const b of blocks) {
    const isGovHeading = b.type === 'h' && b.level === 2 && GOV_HEADING_RE.test(b.text.trim());
    if (isGovHeading) {
      if (inGov) html += inGovEnd;
      html += inGovOpen() + escapeHtml(b.text.trim()) + inGovClose;
      inGov = true;
      continue;
    }
    if (inGov && b.type === 'h' && b.level <= 2) {
      html += inGovEnd;
      inGov = false;
    }
    html += renderBlock(b);
  }
  if (inGov) html += inGovEnd;
  let fmHtml = '';
  if (frontmatter) {
    const fmLines = frontmatter.split('\n').map(l => {
      const m = l.match(/^([\w_-]+):\s*(.*)$/);
      if (m) return `<tr><td><code>${m[1]}</code></td><td>${inlineMd(m[2])}</td></tr>`;
      return `<tr><td colspan="2">${inlineMd(l)}</td></tr>`;
    }).join('');
    fmHtml = `<div class="fm-block"><div class="fm-title">📋 Frontmatter</div><table class="fm-table">${fmLines}</table></div>`;
  }
  return fmHtml + html;
}

function renderList(text) {
  const lines = text.split('\n');
  let html = '';
  const stack = [];
  for (const ln of lines) {
    const m = ln.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if (!m) continue;
    const indent = m[1].length, marker = m[2], content = m[3];
    const tag = /^\d+\./.test(marker) ? 'ol' : 'ul';
    while (stack.length && stack[stack.length-1].indent > indent) stack.pop();
    while (stack.length && stack[stack.length-1].indent === indent && stack[stack.length-1].tag !== tag) stack.pop();
    if (!stack.length || stack[stack.length-1].indent < indent) { html += `<${tag}>`; stack.push({indent, tag}); }
    else if (stack[stack.length-1].tag !== tag) { html += `</${stack[stack.length-1].tag}><${tag}>`; stack[stack.length-1].tag = tag; }
    let item = inlineMd(content);
    if (/^\[[ xX]\]\s+/.test(content)) {
      const checked = /^\[x\]/i.test(content);
      item = `<input type="checkbox" disabled${checked?' checked':''}> ${inlineMd(content.replace(/^\[[ xX]\]\s+/, ''))}`;
    }
    html += `<li>${item}</li>`;
  }
  while (stack.length) html += `</${stack.pop().tag}>`;
  return html;
}

function renderTable(lines) {
  const rows = lines.map(l => l.split('|').slice(1, -1).map(c => c.trim()));
  if (rows.length < 2) return '';
  let html = '<table><thead><tr>';
  rows[0].forEach(c => { html += `<th>${inlineMd(c)}</th>`; });
  html += '</tr></thead><tbody>';
  rows.slice(2).forEach(r => { html += '<tr>'; r.forEach(c => { html += `<td>${inlineMd(c)}</td>`; }); html += '</tr>'; });
  html += '</tbody></table>';
  return html;
}

svp-cta-toggle\nversion: \"v0.1\"\nstatus: confirmed\nowner: PM-Office\nbusiness_fact_owner: 待填写（建议：FSN MP 运营负责人）\ngoal_decision_owner: 待填写（建议：FSN 业务方负责人）\nreviewer: nova\ncreated_at: 2026-08-24\nupdated_at: 2026-08-24\nconfirmed_at: 2026-08-24T02:38:26+00:00\nprocess_tier: \"L0\"\nquality_contract_version: \"1\"\nupstream_artifact_ids: [\"SRC-001（飞书 RSVP BRD，doc-id WGNwdRMIHowSyuxBERcc12Z9nHb，V1.5）\"]\n---\n\n# 轻量 PRD（Mini PRD）\n\n\u003e 本次变更来源：飞书 RSVP BRD V1.5（2026-03-04）章节\"补充活动已结束提示页 CTA 配置规则\"。仅作为 V1.5 需求点的脱敏跑测输入；不含原文档真实姓名、变更人字段或敏感 token。\n\n## 1. 改什么\n\n- **改动点**：将\"感谢您的出席\"与\"活动已结束\"两个提示页面上的 CTA 按钮组（「即刻探索」+「预约服务」）从硬编码\"两个都展示\"，改为**后台运营配置项驱动**。\n- **目标（一句话）**：让运营按活动调性灵活控制 CTA 按钮组合，无需研发改版即可调整页面引导。\n- **配置维度**（4 种状态）：\n  - 0：两个按钮都不展示\n  - 1：仅展示「即刻探索」\n  - 2：仅展示「预约服务」\n  - 3（默认）：两个按钮都展示\n\n## 2. 为什么\n\n- **现状问题**：当前两个提示页硬编码\"两个按钮都展示\"，不同活动品牌调性需要不同引导强度，运营只能\"先反馈研发 → 排期改版 → 上线\"，响应慢且占研发资源。\n- **不做的代价**：活动调性与 CTA 引导错位时，可能影响用户后续转化路径（预约服务 / 探索系列），或出现\"页面按钮与活动主题无关\"的体验问题。\n- **来源**：SRC-001（飞书 RSVP BRD V1.5，2026-03-04）\"活动已结束提示页 CTA 配置规则\"补充条目。\n\n## 3. 影响范围\n\n- **影响模块**（共 3 个，全部为已有提示页，无新页面）：\n  - 在线邀请函（One On One）的\"感谢您的出席\"+\"活动已结束\"两页\n  - 图片邀请函（Batch Invitation）的同样两页\n  - 邀请携伴（Invite Plus One）的同样两页\n- **影响角色**：所有受邀客人（无论 All users 或 InCHANEL clients）；不影响 FA / 运营（运营是新角色，但仅作为配置方，不进入业务流程）。\n- **入口**：客人视角——3 个邀请路径的活动结束后落地页；运营视角——后台活动配置页新增 CTA 配置字段。\n- **回退方式**：后台配置项默认值=「都展示」，回滚只需把单场活动配置改回「3」即可，零代码回退。\n- **未登录 / 未命中分支**：本次不涉及登录态校验、不涉及活动状态机（CTA 渲染独立于既有活动结束判断逻辑）。\n- **边界说明**：本变更不涉及\"即刻探索 / 预约服务\"按钮本身的点击行为、跳转目标、文案或样式，仅控制其是否渲染。\n\n## 4. 行为需求与验收\n\n\u003e 每条验收用 Given/When/Then 精简版，可直接判定通过/失败。\n\n| ID | 场景 | 验收 |\n|---|---|---|\n| AC-1 | 运营未配置 CTA | **Given** 活动 A 的 CTA 配置缺失 **When** 客人进入\"感谢您的出席\"或\"活动已结束\"页 **Then** 默认展示两个按钮（「即刻探索」+「预约服务」），位置与文案与改版前一致 |\n| AC-2 | 配置\"两个都不展示\" | **Given** 活动 A 的 CTA 配置 = 0 **When** 客人进入上述任一提示页 **Then** 页面下方无任何 CTA 按钮 |\n| AC-3 | 配置\"仅即刻探索\" | **Given** 活动 A 的 CTA 配置 = 1 **When** 客人进入上述任一提示页 **Then** 仅展示「即刻探索」按钮，位置居中或居左与改版前该按钮位置一致 |\n| AC-4 | 配置\"仅预约服务\" | **Given** 活动 A 的 CTA 配置 = 2 **When** 客人进入上述任一提示页 **Then** 仅展示「预约服务」按钮 |\n| AC-5 | 三个模块一致性 | **Given** 同一活动配置 **When** 客人分别通过 One On One / 图片邀请函 / 邀请携伴三个路径进入同一提示页 **Then** CTA 渲染结果完全一致 |\n| AC-6 | 配置切换实时性 | **Given** 活动已展示给某客人（页面已打开） **When** 运营后台切换该活动的 CTA 配置 **Then** 客人当前页面**不立即**重新渲染（需客人重新进入页面或下拉刷新才生效）；后续新进入的客人按新配置渲染 |\n| AC-7 | 非法配置值兜底 | **Given** 后台配置值不在 {0,1,2,3} 集合内 **When** 客人进入提示页 **Then** 系统按默认=3 处理（两个按钮都展示），并在 audit log 写一条 WARN 级事件 |\n\n## 5. 异常与边界\n\n- **既有失败语义不变**：本次不改变\"提示页出现的条件\"（仍是\"活动结束 + 客人已签到 / 未签到\"两个分支判定）、不改变\"按钮点击后的跳转目标与异常提示\"（仅控制按钮是否渲染）。既有异常分支（网络异常 / 系统繁忙 / 重复提交 等）的语义保持不变。\n- **新增失败路径**：仅一种——后台配置值非法（AC-7），按默认处理并写 WARN 审计事件；不引入新的用户可见异常弹窗。\n- **回退依据**：单场活动配置可独立改回「3」实现零代码回退；后台配置项默认值即为「3」，部署即安全。\n- **未涉及的事实依据**：本次不引入新 PII 字段、不修改客户身份识别（UnionID）、不修改手机号授权流程、不涉及跨境合规（CPC/CBDT 仅在客户注册环节触发，不在本提示页触发）。\n\n## 6. 依赖与开口问题\n\n| # | 项 | Owner | 影响 | 状态 |\n|---|---|---|---|---|\n| 1 | 后台活动配置项新增字段「CTA 显示策略」 | 后端 / RSVP 中台 | 无此字段则无法运营配置 | 待确认 |\n| 2 | FSN MP 前端按配置渲染 CTA（涉及 3 个模块 × 2 个页面 = 6 处） | 前端 | 需前端按 PRD 拉取配置值 | 待确认 |\n| 3 | audit log 接收 WARN 级配置非法事件 | 后端 / 中台 | 影响 AC-7 可观测性 | 待确认 |\n\n## 产品质量增强记录\n\n\u003e 蒸馏 A4 高频遗漏精简版：把 PM 关键决策证据压缩为五行可审计记录。\n\n| 项目 | 结论 | 知识状态 | 来源/位置 | 判断人 | 复核触发 |\n|---|---|---|---|---|---|\n| 受影响角色与结果 | 客人（All users + InCHANEL clients，3 模块路径）；运营（后台配置）。无 FA 角色影响。 | FACT | mini-prd §3 + SRC-001 V1.5 | PM-Office | 新增携伴 / 主客差异化引导时升级 L1 |\n| 采用方案与被排除替代 | 采用\"后台配置项驱动渲染\"。被排除替代：①每场活动单独 Figma 改版（运营无自助能力）；②引入新页面模板（增加状态/页面复杂度）。 | DECISION | SKILL.md L0 不适用条款 → 配置开关是 L0 典型场景 | PM-Office | 出现\"按用户分群差异化 CTA\"需求时升级 L2 |\n| 价值-成本-风险 | 价值：运营自助调 CTA，缩短响应周期（估 NNN 周→次日）。成本：后端 1 个配置字段 + 前端 6 处渲染分支（≤3 人天）。风险：配置非法值需兜底（AC-7 已覆盖）。 | DECISION + AI_INFERENCE（价值数据为推断） | mini-prd §4 + §5 | PM-Office | 上线后两周内采集运营使用率验证 |\n| 失败边界与回退 | 既有失败语义不变；新增仅 1 类（配置非法 → 默认 + WARN）。回退：配置项默认「3」+ 单场改回即可。 | FACT | mini-prd §5 + AC-1 / AC-7 | PM-Office | 新增\"按钮点击后跳转失败\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①后台无配置字段；②运营提出\"按用户分群差异化 CTA\"诉求（升级 L2）。 | FACT | mini-prd §6 + §5 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |"}, {"path": "003-prd-output/prd.md", "content": "---\nartifact_id: PRD-REQ-009-rsvp-cta-toggle\nversion: v0.1\nstatus: draft\nowner: PM-Office\nbusiness_fact_owner: 待填写（建议：FSN MP 运营负责人）\ngoal_decision_owner: 待填写（建议：FSN 业务方负责人）\nreviewer: nova\ncreated_at: 2026-08-24\nupdated_at: 2026-08-26T03:01:41+00:00\nconfirmed_at: \"\"\nprd_structure_version: \"8\"\nreader_contract_version: \"2\"\nprocess_tier: \"L0\"\nissue_in_prd: false\napplicability_contract_version: \"1\"\nupstream_artifact_ids: [\"MP-REQ-009-rsvp-cta-toggle\"]\nupstream_work_item_statuses: \"mini-prd:confirmed\"\n---\n\n# PRD（产品需求文档）\n\n\u003c!-- canonical_prd_projection: source=mini-prd; mapping_version=1; no_new_business_facts=true --\u003e\n\n## §1 项目背景\n\n\u003c!-- applicability: status=required; basis=V1.5 业务诉求 = 运营按活动调性灵活控制 CTA；不做的代价 = 调性错位影响转化; source=SRC-001 V1.5（飞书 RSVP BRD）; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须提供; review_trigger=目标或背景变化 --\u003e\n\n- **现状问题**：当前两个提示页硬编码\"两个按钮都展示\"，不同活动品牌调性需要不同引导强度，运营只能\"先反馈研发 → 排期改版 → 上线\"，响应慢且占研发资源。\n- **不做的代价**：活动调性与 CTA 引导错位时，可能影响用户后续转化路径（预约服务 / 探索系列），或出现\"页面按钮与活动主题无关\"的体验问题。\n- **来源**：SRC-001（飞书 RSVP BRD V1.5，2026-03-04）\"活动已结束提示页 CTA 配置规则\"补充条目。\n\n## §2 项目范围\n\n\u003c!-- applicability: status=required; basis=影响 3 个功能模块（One On One / 图片邀请函 / 邀请携伴）× 2 个页面 = 6 处渲染分支；不涉及新页面; source=mini-prd §3; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须提供; review_trigger=范围扩大至 FSN MP 全局 CTA 时升级 L2 --\u003e\n\n- **影响模块**（共 3 个，全部为已有提示页，无新页面）：\n  - 在线邀请函（One On One）的\"感谢您的出席\"+\"活动已结束\"两页\n  - 图片邀请函（Batch Invitation）的同样两页\n  - 邀请携伴（Invite Plus One）的同样两页\n- **影响角色**：所有受邀客人（无论 All users 或 InCHANEL clients）；不影响 FA / 运营（运营是新角色，但仅作为配置方，不进入业务流程）。\n- **入口**：客人视角——3 个邀请路径的活动结束后落地页；运营视角——后台活动配置页新增 CTA 配置字段。\n- **回退方式**：后台配置项默认值=「都展示」，回滚只需把单场活动配置改回「3」即可，零代码回退。\n- **未登录 / 未命中分支**：本次不涉及登录态校验、不涉及活动状态机（CTA 渲染独立于既有活动结束判断逻辑）。\n- **边界说明**：本变更不涉及\"即刻探索 / 预约服务\"按钮本身的点击行为、跳转目标、文案或样式，仅控制其是否渲染。\n\n## §3 用户旅程\n\n\u003c!-- applicability: status=required; basis=受影响路径：3 个邀请流程结束后的两个提示页（已签到 / 未签到）; source=mini-prd §3; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须说明受影响路径; review_trigger=出现新邀请流程或新落地页时 --\u003e\n\n\u003e L0 投影简化：mini-prd 单节『影响范围』未拆分为独立旅程图；详细路径见 §2 项目范围。\n\n## §4 用户故事与优先级\n\n\u003c!-- applicability: status=required; basis=客人视角：在活动结束后看到与活动调性匹配的 CTA 引导；运营视角：可独立配置 CTA; source=mini-prd §4 + 产品质量增强记录\"受影响角色与结果\"; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须追溯用户价值; review_trigger=出现\"按用户分群差异化 CTA\"时升级 L2 --\u003e\n\n- **改动点**：将\"感谢您的出席\"与\"活动已结束\"两个提示页面上的 CTA 按钮组（「即刻探索」+「预约服务」）从硬编码\"两个都展示\"，改为**后台运营配置项驱动**。\n- **目标（一句话）**：让运营按活动调性灵活控制 CTA 按钮组合，无需研发改版即可调整页面引导。\n- **配置维度**（4 种状态）：\n  - 0：两个按钮都不展示\n  - 1：仅展示「即刻探索」\n  - 2：仅展示「预约服务」\n  - 3（默认）：两个按钮都展示\n\n\u003e L0 投影简化：mini-prd 未采集 Gherkin 用户故事与 MoSCoW 优先级；本节以『改什么』作为最小故事叙述。\n\n## §5 功能清单\n\n\u003c!-- applicability: status=required; basis=1 项核心功能：CTA 显示策略配置（4 种状态）; source=mini-prd §1; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须提供可实施功能; review_trigger=新增按用户分群配置维度时升级 L2 --\u003e\n\n- **改动点**：将\"感谢您的出席\"与\"活动已结束\"两个提示页面上的 CTA 按钮组（「即刻探索」+「预约服务」）从硬编码\"两个都展示\"，改为**后台运营配置项驱动**。\n- **目标（一句话）**：让运营按活动调性灵活控制 CTA 按钮组合，无需研发改版即可调整页面引导。\n- **配置维度**（4 种状态）：\n  - 0：两个按钮都不展示\n  - 1：仅展示「即刻探索」\n  - 2：仅展示「预约服务」\n  - 3（默认）：两个按钮都展示\n\n## §6 功能流程\n\n\u003c!-- applicability: status=required; basis=7 条 AC 覆盖：默认值 / 4 种配置 / 跨模块一致性 / 切换实时性 / 非法值兜底; source=mini-prd §4; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须提供可观察行为; review_trigger=出现新配置维度或新交互分支时 --\u003e\n\n\u003e 每条验收用 Given/When/Then 精简版，可直接判定通过/失败。\n\n| ID | 场景 | 验收 |\n|---|---|---|\n| AC-1 | 运营未配置 CTA | **Given** 活动 A 的 CTA 配置缺失 **When** 客人进入\"感谢您的出席\"或\"活动已结束\"页 **Then** 默认展示两个按钮（「即刻探索」+「预约服务」），位置与文案与改版前一致 |\n| AC-2 | 配置\"两个都不展示\" | **Given** 活动 A 的 CTA 配置 = 0 **When** 客人进入上述任一提示页 **Then** 页面下方无任何 CTA 按钮 |\n| AC-3 | 配置\"仅即刻探索\" | **Given** 活动 A 的 CTA 配置 = 1 **When** 客人进入上述任一提示页 **Then** 仅展示「即刻探索」按钮，位置居中或居左与改版前该按钮位置一致 |\n| AC-4 | 配置\"仅预约服务\" | **Given** 活动 A 的 CTA 配置 = 2 **When** 客人进入上述任一提示页 **Then** 仅展示「预约服务」按钮 |\n| AC-5 | 三个模块一致性 | **Given** 同一活动配置 **When** 客人分别通过 One On One / 图片邀请函 / 邀请携伴三个路径进入同一提示页 **Then** CTA 渲染结果完全一致 |\n| AC-6 | 配置切换实时性 | **Given** 活动已展示给某客人（页面已打开） **When** 运营后台切换该活动的 CTA 配置 **Then** 客人当前页面**不立即**重新渲染（需客人重新进入页面或下拉刷新才生效）；后续新进入的客人按新配置渲染 |\n| AC-7 | 非法配置值兜底 | **Given** 后台配置值不在 {0,1,2,3} 集合内 **When** 客人进入提示页 **Then** 系统按默认=3 处理（两个按钮都展示），并在 audit log 写一条 WARN 级事件 |\n\n## §7 页面与体验\n\n\u003c!-- applicability: status=conditional; basis=既有页面结构与布局不变，仅按钮组显隐；不引入新组件; source=mini-prd §3; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=出现布局/导航变化; current_judgment=无新设计改动; review_trigger=出现页面、布局或导航变化 --\u003e\n\n\u003e 本期不适用：详见上方 applicability 块的 `basis` 与 `source` 字段。\n\n## §8 交互规则\n\n\u003c!-- applicability: status=conditional; basis=既有按钮点击行为不变；本次仅控制是否渲染; source=mini-prd §3 + §5; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=出现按钮点击行为变化或新交互; current_judgment=本次不涉及; review_trigger=出现交互规则变化 --\u003e\n\n\u003e 本期不适用：详见上方 applicability 块的 `basis` 与 `source` 字段。\n\n## §9 业务规则与校验\n\n\u003c!-- applicability: status=required; basis=配置项默认值=「都展示」、覆盖 3 模块一致性、配置切换不实时生效、非法值兜底; source=mini-prd §4 AC-1/5/6/7; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须说明流程约束; review_trigger=规则或阈值变化 --\u003e\n\n### §9.1 计算与流程规则\n\n\u003c!-- applicability: status=required; basis=派生自 §4 验收逻辑（Given/When/Then）; source=mini-prd §4; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须提供适用业务规则; review_trigger=规则或阈值变化 --\u003e\n\n\u003e 每条验收用 Given/When/Then 精简版，可直接判定通过/失败。\n\n| ID | 场景 | 验收 |\n|---|---|---|\n| AC-1 | 运营未配置 CTA | **Given** 活动 A 的 CTA 配置缺失 **When** 客人进入\"感谢您的出席\"或\"活动已结束\"页 **Then** 默认展示两个按钮（「即刻探索」+「预约服务」），位置与文案与改版前一致 |\n| AC-2 | 配置\"两个都不展示\" | **Given** 活动 A 的 CTA 配置 = 0 **When** 客人进入上述任一提示页 **Then** 页面下方无任何 CTA 按钮 |\n| AC-3 | 配置\"仅即刻探索\" | **Given** 活动 A 的 CTA 配置 = 1 **When** 客人进入上述任一提示页 **Then** 仅展示「即刻探索」按钮，位置居中或居左与改版前该按钮位置一致 |\n| AC-4 | 配置\"仅预约服务\" | **Given** 活动 A 的 CTA 配置 = 2 **When** 客人进入上述任一提示页 **Then** 仅展示「预约服务」按钮 |\n| AC-5 | 三个模块一致性 | **Given** 同一活动配置 **When** 客人分别通过 One On One / 图片邀请函 / 邀请携伴三个路径进入同一提示页 **Then** CTA 渲染结果完全一致 |\n| AC-6 | 配置切换实时性 | **Given** 活动已展示给某客人（页面已打开） **When** 运营后台切换该活动的 CTA 配置 **Then** 客人当前页面**不立即**重新渲染（需客人重新进入页面或下拉刷新才生效）；后续新进入的客人按新配置渲染 |\n| AC-7 | 非法配置值兜底 | **Given** 后台配置值不在 {0,1,2,3} 集合内 **When** 客人进入提示页 **Then** 系统按默认=3 处理（两个按钮都展示），并在 audit log 写一条 WARN 级事件 |\n\n### §9.2 校验规则\n\n\u003c!-- applicability: status=conditional; basis=配置值校验在服务端，非法值兜底为默认；不引入新用户字段或跨字段约束; source=mini-prd §4 AC-7; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=新增字段或跨字段约束; current_judgment=无; review_trigger=出现校验需求 --\u003e\n\n\u003e 本期不适用：详见上方 applicability 块的 `basis` 与 `source` 字段。\n\n### §9.3 状态变化\n\n\u003c!-- applicability: status=conditional; basis=不引入新持久状态或状态转移; source=mini-prd §3 + §5; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=新增状态/事件/守卫; current_judgment=无; review_trigger=出现状态模型 --\u003e\n\n\u003e 本期不适用：详见上方 applicability 块的 `basis` 与 `source` 字段。\n\n### §9.4 异常处理与恢复\n\n\u003c!-- applicability: status=conditional; basis=仅 1 类新异常（配置非法 → 默认值 + audit WARN）；既有失败语义不变; source=mini-prd §5 + §4 AC-7; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=新增失败/恢复; current_judgment=配置非法兜底已写明; review_trigger=出现新失败语义 --\u003e\n\n\u003e 本期不适用：详见上方 applicability 块的 `basis` 与 `source` 字段。\n\n## §10 验收标准\n\n\u003c!-- applicability: status=required; basis=7 条 AC（AC-1 至 AC-7），每条 Given/When/Then 精简可判定; source=mini-prd §4; decided_by=AI 起草（PM-Office）; decided_at=2026-08-24; trigger=; current_judgment=必须可判定; review_trigger=目标或行为变化 --\u003e\n\n\u003e 每条验收用 Given/When/Then 精简版，可直接判定通过/失败。\n\n| ID | 场景 | 验收 |\n|---|---|---|\n| AC-1 | 运营未配置 CTA | **Given** 活动 A 的 CTA 配置缺失 **When** 客人进入\"感谢您的出席\"或\"活动已结束\"页 **Then** 默认展示两个按钮（「即刻探索」+「预约服务」），位置与文案与改 count page 的\"我的活动\"入口保留；活动列表本身保留；活动详情保留；TKU / 行程单入口保留。\n\n### 2.3 与其他版本的关系\n\n| 版本 | 日期 | 与本次变更关系 |\n|---|---|---|\n| V1.0 | 2025-09-16 | 首次起草；建立 3 个核心模块的初始规则（其中\"即刻探索\"跳转规则首次出现）|\n| V1.1 | 2026-02-02 | 新增注册失败流程 + CBDT 判断 + B24 注册\u0026预约失败规则（与本次无直接重叠）|\n| **V1.2** | **2026-02-05** | **本次对应：①即刻探索跳转目标变更为 FSN MP Home Page；②删除服务号菜单\"我的活动\"入口** |\n| V1.3 | 2026-02-12 | 红点通知配置化（已作为 `REQ-001-fsn-rsvp-reddot` 单独跑测过 L2 完整流程）|\n| V1.4 | 2026-02-27 | 原定场次已结束弹窗的交互规则（V1.2 文档日志中已部分包含，但权威归属 V1.4，本次不纳入）|\n| V1.5 | 2026-03-04 | CTA 按钮配置规则（已作为 `REQ-009-rsvp-cta-toggle` 跑测过 L0 完整流程）|\n| V1.6 | 2026-03-05 | 服务号关注入口说明 |\n| V1.7 | 2026-04-23 | TKU page CTA 配置规则（同类配置化变更，可作为后续 L0 跑测候选）|\n| V1.8 | 2026-05-29 | 选择场次页面样式两版本 |\n\n### 2.4 已知相关联规则编号（仅作追溯定位，不展开）\n\n- 在线邀请函：交互 I05（原 BRD 中已标注；具体编号不抄录于本 SRC，需查原文档）\n- 图片邀请函：交互 I04\n- 邀请携伴：交互 I04\n- 查看活动记录：B01 / B02\n\n## 3. 引用方式\n\n- 本次跑测（REQ-010 L1）的 8 个 work_item 产物（背景 / 用户旅程 / 用户故事 / 功能清单 / 功能流程 / 业务规则 / 验收 / PRD 装配）均引用本 SRC\n- 入口删除的回退路径说明引用本 SRC §2.2\n\n## 4. 脱敏记录\n\n| 类别 | 处理方式 |\n|---|---|\n| 真实姓名（变更人字段：赵淑玲 / 涂芮奇 / 俞明宏 等） | **未保留**（原文档变更人字段）|\n| 客服电话（4001 / 4009 等）| **未保留** |\n| SharePoint 链接 + token | **未保留**（lark-cli 自动脱敏）|\n| 飞书图片 alt 文本中的描述性内容 | **未保留**（图像无法转文本）|\n| 其他长 token / 凭据 | 由 `feishu_fetch.py` 的 SECRET_PATTERNS 自动替换为 `\u003cREDACTED\u003e` |\n\n## 5. 后续清理\n\n- 本次跑测完成后，`/tmp/feishu_dump/` 整目录将删除\n- 真实姓名 / 客服电话 / 原始变更日志等内容**永远不会**进入 git commit 或公开仓库"}, {"path": "00-input/intake-decision.md", "content": "---\nartifact_id: INTAKE-REQ-010-v1p2-explore-jump\nversion: \"v1\"\nstatus: draft\nprocess_tier: L1\ndifficulty_level: \"medium\"\ntier_recommendation: \"L1\"\ntier_selection: \"人工确认（建议不可自动生效）\"\ndecision_owner: \"待填写（建议：FSN MP PM-Office）\"\ndecided_at: \"\"\nsource_materials: \"SRC-002（飞书 RSVP BRD，doc-id WGNwdRMIHowSyuxBERcc12Z9nHb，V1.2，2026-02-05）\"\nreview_trigger: \"命中硬升级条件、范围变化或新增 L2-only 能力时复审\"\napplicability_contract_version: \"1\"\nl2_only_pd: \"not_applicable: 沿用 3 个邀请模块既有提示页与按钮组，不改页面骨架或新增组件；服务号菜单入口删除不引入新页面\"\nl2_only_ix: 26-08-24 | 触发条件：新增字段或跨字段约束；当前判断：无 | 出现校验需求 |\n| §9.3 状态变化 | conditional | 不引入新状态机/事件/守卫；跳转目标与服务号菜单入口变更是配置层动作 | SRC-002 §2.1 + §2.2 | AI 起草（PM-Office）| 2026-08-24 | 触发条件：新增状态、事件、守卫或副作用；当前判断：无 | 出现状态模型 |\n| §9.4 异常处理 | conditional | 既有失败语义不变；跳转目标配置错误仅影响落地链路，服务号菜单入口删除无新失败路径 | SRC-002 §2.1 + §2.2 | AI 起草（PM-Office）| 2026-08-24 | 触发条件：新增失败、恢复或人工升级；当前判断：跳转目标配置错误兜底由业务侧兜底 | 出现新失败语义 |\n| §10 验收依据 | required | 7-9 条 AC（Given/When/Then）覆盖跳转一致性、入口删除、替代入口、跨模块一致性、回退等 | SRC-002 §2.1 + §2.2 | AI 起草（PM-Office）| 2026-08-24 | 当前判断：必须可判定 | 目标或行为变化 |\n| §11 按需章节 | conditional | 依赖与开口问题 3 项（跳转配置化、服务号菜单入口后台化、跳转目标配置错误兜底）| SRC-002 §2.1 + §2.2 | AI 起草（PM-Office）| 2026-08-24 | 触发条件：竞品、字段、埋点、可行性、术语或职责有事实来源；当前判断：仅依赖项无其他按需 | 新增按需来源 |\n\nL0 也必须完成此表。mini-prd 只能提供事实草稿，不能替代此矩阵；L1 的 PD/IX/VL/STATE/EX 还必须与上表结论一致。\n\n## 4. 决策与升级\n\n- 选择档位：`L1`\n- 选择人：`待填写（建议：FSN MP PM-Office）`\n- 决策时间：`待填写`\n- 升级理由（如有）：`无`\n- 复审触发：范围扩大至 FSN MP 全局跳转/导航、出现新交互类型、新增字段校验、新增状态机、新增失败路径时重新评估并升级 L2。"}, {"path": "00-input/source-register.md", "content": "# 来源登记 (Source Register)\n\n\u003e 本文件登记所有原始需求材料的来源映射。\n\u003e 格式: SRC-NNN → 材料位置（文件路径 / URL / 飞书链接）\n\n| 来源 ID | 材料类型 | 材料位置 | 关键内容摘要 | 登记日期 | 权威范围 |\n|---|---|---|---|---|---|\n| SRC-001 | feishu_docx | https://ccegroup.feishu.cn/docx/WGNwdRMIHowSyuxBERcc12Z9nHb | 飞书 RSVP BRD 主文档（V1.2 增量条目定位）| 2026-08-24 | V1.2 跨模块跳转 + 服务号菜单\"我的活动\"入口删除 |\n| SRC-002 | feishu_docx 摘要 | requirements/REQ-010-v1p2-explore-jump/00-input/SRC-002-rsvp-brd-v1.2.md | V1.2 脱敏摘要（不含 PII）| 2026-08-24 | V1.2 业务事实陈述 |"}, {"path": "001-business-requirements/01-background-goal/background-goal.md", "content": "---\nartifact_id: BG-001\nversion: v0.1\nstatus: confirmed\nquality_contract_version: \"1\"\nowner: PM-Office\nbusiness_fact_owner: 待填写（建议：FSN MP PM-Office，ISS-001）\ngoal_decision_owner: 待填写（建议：FSN 业务方负责人，ISS-001）\nreviewer: nova\ncreated_at: 2026-08-24\nupdated_at: 2026-08-24\nconfirmed_at: 2026-08-24T02:59:36+00:00\n---\n\n# 项目背景与目标\n\n## 产品质量增强记录\n\n| 项目 | 结论 | 知识状态 | 来源/位置 | 判断人 | 复核触发 |\n|---|---|---|---|---|---|\n| 受影响角色与结果 | 受邀客人（3 模块路径，跨 FSN MP Home Page 跳转）；运营（菜单入口收敛）。无 FA / 监管 / 合规角色影响。 | FACT | SRC-002 §2.1 + §2.2 | PM-Office | 新增分群差异化跳转或菜单入口重排时升级 L2 |\n| 采用方案与被排除替代 | 采用「跳转目标统一配置化 + 服务号菜单入口移除」。被排除替代：①每模块单独硬编码跳转（跨模块一致性无法保障）；②服务号菜单入口替换为跳转链接（增加跳转链路，不解决冗余）。 | DECISION | SKILL.md 跳转型 + 入口删除型属于 L1 典型场景 | PM-Office | 出现\"按用户分群差异化跳转目标\"或\"服务号菜单入口按用户分群显隐\"需求时升级 L2 |\n| 价值-成本-风险 | 价值：跨 3 模块跳转体验一致 + 服务号菜单减少冗余降低误点击。成本：前端 3 模块共 ~6 处配置点（≤2 人天）；服务端跳转目标配置化 + 服务号菜单后台化（≤1 人天）。风险：跳转目标配置错误兜底 + 服务号菜单入口删除后用户路径缺失兜底（见 §4 与 §7 约束）。 | DECISION + AI_INFERENCE（量化数据为推断） | SRC-002 §2.1 + §2.2 | PM-Office | 上线后两周内采集跳转链路成功率 + 服务号菜单 PV/UV 变化验证 |\n| 失败边界与回退 | 既有失败语义不变；本次新增 2 类可观察行为（同模块同跳转目标、服务号菜单入口不可见）。回退：跳转目标配置可一键还原到 V1.2 之前；服务号菜单入口可重新启用（功能影响面有限）。 | FACT | SRC-002 §2.1 + §2.2 | PM-Office | 新增\"跳转目标配置失败\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①服务号菜单入口删除后用户 PV 跌幅 \u003e X%（实际数据采集后定阈值）；②运营提出\"按用户分群差异化跳转\"诉求（升级 L2）。 | FACT | SRC-002 §2.1 + §2.2 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |\n\n## 0. 预检输入充分度判定\n\n在起草背景与目标前，先判定输入材料的充分度，并按 L0–L4 标注成熟度。仅当达到 L2 及以上时进入正文撰写；L0–L1 应转入 `intake-routing` 或 `requirement-restate` 模式。\n\n| 维度 | L0（仅想法） | L1（单条稀疏来源） | L2（业务方案已存在） | L3（需求细节明确） | L4（上游已确认） |\n|---|---|---|---|---|---|\n| 来源数量 | — | — | 2（SRC-001 主文档 + SRC-002 摘要，见 §12）| — | — |\n| 业务背景陈述 | — | — | 有（V1.2 文档日志明列两条变更，Q-001） | — | — |\n| 现状流程描述 | — | — | 有（V1.2 之前跳转目标状态 + 服务号菜单入口状态，SRC-002 §3）| — | — |\n| 目标与成功判断 | — | — | 部分（业务意图明确，量化指标待运营/数据侧确认，Q-001 / Q-002）| — | — |\n| 角色识别 | — | — | 部分（客人视角明确，运营/FA 视角依赖推断，INF-001）| — | — |\n| 约束与依赖 | — | — | 部分（跳转配置化与服务号菜单后台化已列；具体技术实现路径待确认，Q-003 / Q-004）| — | — |\n| **本次判定** | — | — | **L2 命中（ISS-101）** | — | — |\n\n**判定说明**：本次输入达到 L2（业务方案已存在，ISS-101）水平，足以进入正文撰写；进入 §3 后部分字段（量化目标、跨模块跳转成功率基线）标 `待确认（Q-001/Q-002/Q-003/Q-004）` 并登记到 §11。\n\n## 1. 需求来源与触发\n\n说明需求由谁、通过什么材料、因为什么事件提出，并引用 `SRC-*`。\n\n- **需求提出方**：FSN MP 业务方（具体变更人在原 BRD V1.2 文档日志中记载；按 CLAUDE.md 全局用户偏好 §二 PII 隔离规则，不在本产物中保留真实姓名）。\n- **来源材料**：\n  - `SRC-001`：飞书 RSVP BRD 原始主文档（doc-id `WGNwdRMIHowSyuxBERcc12Z9nHb`），由 `src/scripts/feishu_fetch.py` 提取至 `/tmp/feishu_dump/raw.md`，**未纳入项目仓库**。\n  - `SRC-002`：V1.2 脱敏摘要，登记于 `requirements/REQ-010-v1p2-explore-jump/00-input/SRC-002-rsvp-brd-v1.2.md`，是本产物的可引用来源。\n- **触发事件**：V1.2 版本（2026-02-05）发布，文档日志中明列两条变更（跳转目标调整 + 服务号菜单入口删除）。本次跑测仅纳入这两条变更；V1.2 同日另一段（场次已结束校验说明）在原 BRD 中归属 V1.4，本次不纳入。\n- **本次产物范围**：\n  - 变更 1（跨 3 模块跳转目标统一切换至 FSN MP Home Page）\n  - 变更 2（删除服务号菜单栏\"我的活动\"入口）\n\n## 2. 项目与需求背景\n\n说明业务环境、需求由来、为什么现在需要处理。\n\n- **业务环境**：FSN MP 是 FSN（Fashion/Beauty 业务条线）的客户运营小程序入口，承担受邀 VIP 客人 RSVP 流程的承载职责。RSVP 流程由 3 个核心邀请模块组成（在线邀请函 One On One / 图片邀请函 Batch Invitation / 邀请携伴 Invite Plus One），活动结束后均落到两个提示页（\"感谢您的出席\"+\"活动已结束\"），提示页底部有\"即刻探索\"按钮引导客人后续转化。\n- **需求由来**：\n  - V1.2 之前，\"即刻探索\"按钮的跳转目标在原 BRD 中未明确定义或存在跨模块不一致，影响跨模块用户体验一致性。\n  - 服务号菜单栏存在\"我的活动\"入口，与 FSN MP 内 My account page 的\"我的活动\"入口功能冗余，导致菜单 PV 分散、运营指标误判。\n- **为什么现在**：\n  - 跳转目标不一致是跨 3 模块一致性问题，影响用户后续探索路径（FSN MP Home Page 是后续转化主入口），不统一会影响转化效率。\n  - 服务号菜单入口冗余导致运营对\"用户活动记录查看路径\"的指标统计口径不清，清理入口后可形成单一事实入口（FSN MP 内 My account page）。\n\n## 3. 当前现状与已有做法\n\n说明当前流程、系统、人工方式或替代方案，以及仍然有效的部分。\n\n- **变更 1 当前现状**：\n  - V1.2 之前：3 个模块（One On One I05 / 图片邀请函 I04 / 邀请携伴 I04）的\"即刻探索\"按钮跳转目标在原 BRD 中未明确统一，存在跨模块不一致或缺定义状态。\n  - 仍然有效：3 个模块的「预约服务」按钮跳转目标（OAB 创建预约页面）、按钮样式、按钮位置、按钮文案不变。\n- **变更 2 当前现状**：\n  - V1.2 之前：FSN 服务号菜单栏中**存在**\"我的活动\"入口。\n  - 替代入口（保留）：FSN MP 内 My account page 的\"我的活动\"入口（既有入口，本次不变更）；微信服务通知中的活动详情入口（既有，本次不变更）。\n  - 仍然有效：My account page 的\"我的活动\"入口、活动列表本身、活动详情、TKU / 行程单入口均保留。\n- **既有跳转链路**（保留）：活动邀请卡 → 活动详情页 → 提示页 → 「即刻探索」/「预约服务」/「活动已结束」路径不变，仅终点页面（跳转目标）变更。\n\n## 4. 核心问题与证据\n\n按\"问题 → 影响 → 证据来源\"描述，不把预设功能当作问题。\n\n### 问题 1：跨模块\"即刻探索\"跳转目标不统一\n\n- **问题**：V1.2 之前，3 个邀请模块的\"即刻探索\"按钮跳转目标未明确定义或存在跨模块不一致，无法保证客人跨模块体验一致性。\n- **影响**：\n  - 客人体验层面：同一品牌在不同邀请路径下应得一致探索引导；不一致会让客人产生\"是不是走错地方\"的疑虑。\n  - 业务指标层面：跳转目标不统一导致转化归因口径不一致，运营难以判断\"即刻探索\"的真实转化贡献。\n- **证据来源**：SRC-002 §2.1（V1.2 文档日志明列\"更改即刻探索跳转页面\"，明确指向 FSN MP Home Page）；变更涉及模块 One On One I05 / 图片邀请函 I04 / 邀请携伴 I04。\n\n### 问题 2：服务号菜单\"我的活动\"入口冗余\n\n- **问题**：FSN 服务号菜单栏的\"我的活动\"入口与 FSN MP 内 My account page 的\"我的活动\"入口功能重叠，菜单入口分散。\n- **影响**：\n  - 运营指标层面：用户活动记录查看的 PV/UV 在两处入口间分散，运营无法判断真实活跃入口。\n  - 品牌一致性层面：FSN 服务号菜单与 FSN MP 应形成\"外引内查\"分工，菜单入口作为外引到 FSN MP 即可，重复入口反而让客人困惑。\n- **证据来源**：SRC-002 §2.2（V1.2 文档日志明列\"删除服务号菜单栏'我的活动'入口\"）；变更涉及查看活动记录 B01 / B02。\n\n## 5. 目标、未来期望与成功判断\n\n区分业务结果、交付结果和成功判断。无法量化时标记待确认（Q-/ISS-/DEC-/SRC- 引用），不编造指标。\n\n| # | 目标类别 | 目标陈述 | 成功判断（Fit Criterion） | 量化判据基线 → 目标 + 衡量方式 + 时间窗口 |\n|---|---|---|---|---|\n| G-1 | 业务结果 | 跨 3 模块\"即刻探索\"跳转目标一致 | 同一活动同一客人在 3 个邀请路径下点击\"即刻探索\"落地 FSN MP Home Page 比例 = 100% | Q-001 待数据侧采集基线 |\n| G-2 | 业务结果 | 服务号菜单入口收敛 | 服务号菜单\"我的活动\"入口移除后，FSN MP 内 My account page 的\"我的活动\"入口 PV/UV 提升（替代承接）| Q-002 待数据侧采集基线 → 上线 2 周后采集 |\n| G-3 | 交付结果 | 配置化能力交付 | 跳转目标与服务号菜单入口均在后台可配置；配置变更可灰度发布 | 见 §9.1 业务规则与 §10 验收依据 |\n| G-4 | 交付结果 | 跨模块一致性可验证 | 任意活动配置下，3 个模块的\"即刻探索\"渲染/点击结果完全一致 | 见 §10 跨模块跳转一致率 + 既有失败语义保持 |\n\n\u003e **Fit Criterion（量化判据）提示**：G-1 与 G-2 的量化基线必须由运营/数据侧在上线前提供；本产物不编造具体百分比。G-3 / G-4 的成功判断由验收依据定义。\n\n## 6. 用户角色与利益相关者\n\n只识别与背景和目标有关的角色、责任和影响；详细旅程留给下一步。\n\n| 角色 | 类别 | 责任/影响 | 来源 |\n|---|---|---|---|\n| 受邀客人（All users + InCHANEL clients）| 消费侧 | 体验\"即刻探索\"跳转一致性 + 服务号菜单入口收敛后的活动记录查找 | SRC-002 §2.1 + §2.2 |\n| 运营 | 旁观/配置侧 | 配置跳转目标、调整服务号菜单入口（删除后无操作）；不进入业务流程 | AI_INFERENCE（运营作为配置方在原 BRD 中未明确点名；按 V1.5 同类配置化变更推断）|\n| FA（精品顾问）| 旁观 | 不涉及本次变更 | SRC-002 §2（V1.2 未触及 FA 视角）|\n| 业务方负责人 | 决策侧 | 目标决策 owner；批准本次变更 | DECISION（按产品 PM 脚手架默认 owner 角色）|\n\n## 7. 时间、约束与依赖\n\n记录已知期限、资源、政策、合规、数据、系统和外部依赖。\n\n- **约束 1（技术依赖）**：跳转目标配置化需要服务端配置表/开关能力；服务号菜单入口删除需要 FSN 服务号后台菜单管理能力。两条均依赖对应后台系统当前是否已支持配置化能力。\n- **约束 2（运营依赖）**：跨 3 模块配置发布需运营/数据侧配合（数据侧确认基线、运营侧执行配置变更）。\n- **约束 3（合规隔离）**：本次不引入新 PII 字段、不修改客户身份识别（UnionID）、不修改手机号授权流程、不涉及跨境合规（CPC/CBDT 仅在客户注册环节触发，不在本提示页触发）。\n- **约束 4（时间窗口）**：无明确 deadline；建议与运营对齐上线窗口（建议在下一次大版本或月初灰度发布）。\n- **约束 5（既有失败语义）**：跳转链路 / 服务号菜单 / 既有失败语义保持不变。\n- **依赖**：RSVP 中台配置能力（跳转目标配置化）；FSN 服务号后台（菜单入口管理能力）；运营/数据侧（量化基线提供）。\n\n## 8. 初步边界与非目标\n\n记录已确认或暂定的边界，明确这不是最终产品范围。\n\n- **本次范围内**：\n  - 跨 3 模块（One On One / 图片邀请函 / 邀请携伴）\"即刻探索\"跳转目标统一切换至 FSN MP Home Page。\n  - 服务号菜单栏\"我的活动\"入口移除。\n  - 跳转目标配置化（后台可配）+ 服务号菜单入口管理后台化。\n- **本次非目标**：\n  - 「预约服务」按钮跳转目标（OAB 创建预约页面）不变。\n  - 既有按钮文案、样式、位置不变。\n  - FSN MP 内 My account page 的\"我的活动\"入口、活动列表、活动详情、TKU / 行程单入口不变。\n  - 微信服务通知中的活动详情入口不变。\n  - 不涉及新 PII 字段、不涉及客户身份识别变更、不涉及跨境合规变更。\n  - 不涉及页面布局骨架调整（无新页面、无组件增删）。\n\n## 9. 事实与决定\n\n| ID | 类型 | 内容 | 来源/决策人 | 状态 |\n|---|---|---|---|---|\n| FCT-001 | FACT | V1.2 跨 3 模块「即刻探索」跳转目标统一切换至 FSN MP Home Page（涉及 One On One I05 / 图片邀请函 I04 / 邀请携伴 I04） | SRC-002 §2.1 | 已确认 |\n| FCT-002 | FACT | V1.2 服务号菜单栏\"我的活动\"入口移除（涉及查看活动记录 B01 / B02） | SRC-002 §2.2 | 已确认 |\n| FCT-003 | FACT | 「预约服务」按钮跳转目标不变（OAB 创建预约页面） | SRC-002 §2.1 | 已确认 |\n| FCT-004 | FACT | FSN MP 内 My account page 的\"我的活动\"入口保留 | SRC-002 §2.2 | 已确认 |\n| FCT-005 | FACT | 微信服务通知中的活动详情入口保留 | SRC-002 §2.2 | 已确认 |\n| DEC-001 | DECISION | 跳转目标采用\"后台可配置\"形式，不硬编码 | AI 起草（PM-Office）| DEC-101 待 human gate 决定 |\n| DEC-002 | DECISION | 服务号菜单入口删除后，FSN MP 内 My account page 的\"我的活动\"入口为唯一外部承接入口 | AI 起草（PM-Office）| DEC-102 待 human gate 决定 |\n| DEC-003 | DECISION | 跨模块一致性通过\"统一配置源\"保证（3 模块从同一配置点读取跳转目标）| AI 起草（PM-Office）| DEC-103 待 human gate 决定 |\n\n## 10. 假设、AI 推断、未知与冲突\n\n| ID | 类型 | 内容 | 依据 | 影响 | 责任人 | 处理方式 |\n|---|---|---|---|---|---|---|\n| UNK-001 | UNKNOWN | G-1 与 G-2 的量化基线（跳转成功率、服务号菜单 PV/UV）| 无（数据侧未提供）| 影响 §5 Fit Criterion 完整性（Q-001/Q-002）| 数据侧 / 运营 | 延后到 §11 待确认问题（Q-001/Q-002）；不阻塞本次背景与目标确认（DEC-201）|\n| ASM-001 | ASSUMPTION | 跳转目标配置化对服务端中台而言属于低成本配置变更 | V1.5 同类配置化变更经验 | 影响 §5 成本评估 | 服务端 / RSVP 中台 | 在 work_item 6 业务规则阶段复核 |\n| INF-001 | AI_INFERENCE | 运营在本次变更中仅作为配置方（不进入业务流程）| V1.5 REQ-009 同类配置化变更经验 | 影响 §6 角色识别 | PM-Office | 标记为 AI 推断；在 §11 待确认问题登记（ISS-101）|\n| CFT-001 | CONFLICT | 无 | — | — | — | — |\n\n## 11. 待确认问题\n\n| ID | 问题 | AI 初步判断与依据 | 选项/影响 | 决策人 | 阻断 | 延后风险 | 回写位置 |\n|---|---|---|---|---|---|---|---|\n| Q-001 | G-1 跨模块跳转成功率当前基线是多少？ | 由 SRC-002 §2.1 推断：V1.2 之前跨模块跳转不一致，基线不可信；需数据侧重新采集 | A) 重新采集基线 B) 不量化 C) 自由文本 | 数据侧 | 否 | 不阻塞本次背景确认；影响 §5 量化判据完整度 | §5 G-1 |\n| Q-002 | G-2 服 \n---\n\n# 用户旅程\n\n## 产品质量增强记录\n\n| 项目 | 结论 | 知识状态 | 来源/位置 | 判断人 | 复核触发 |\n|---|---|---|---|---|---|\n| 受影响角色与结果 | 受邀客人（All users + InCHANEL clients）跨 3 模块路径；运营（菜单入口删除后无操作）。无 FA 影响。 | FACT | SRC-002 §2.1 + §2.2 | PM-Office | 新增携伴 / 主客差异化引导或菜单入口重排时升级 L2 |\n| 采用方案与被排除替代 | 采用「跳转目标统一配置化 + 服务号菜单入口移除」。被排除替代：①硬编码跨 3 模块跳转（一致性无法保障）；②服务号菜单入口替换为跳转链接（增加跳转链路，不解决冗余）。 | DECISION | SKILL.md 跳转型 + 入口删除型属于 L1 典型场景 | PM-Office | 出现\"按用户分群差异化跳转\"或\"服务号菜单入口按用户分群显隐\"需求时升级 L2 |\n| 价值-成本-风险 | 价值：跨 3 模块跳转体验一致 + 服务号菜单减少冗余降低误点击（Q-002 数据验证）。成本：前端 3 模块共 ~6 处配置点（≤2 人天）；服务端跳转目标配置化 + 服务号菜单后台化（≤1 人天）。风险：跳转目标配置错误兜底（Q-003）+ 服务号菜单入口删除后用户路径缺失兜底（Q-004）。 | DECISION + AI_INFERENCE（量化数据为推断） | SRC-002 §2.1 + §2.2 | PM-Office | 上线后两周内采集跳转链路成功率 + 服务号菜单 PV/UV 变化验证 |\n| 失败边界与回退 | 既有失败语义不变；本次新增 2 类可观察行为（同模块同跳转目标、服务号菜单入口不可见）。回退：跳转目标配置可一键还原到 V1.2 之前；服务号菜单入口可重新启用（功能影响面有限）。 | FACT | SRC-002 §2.1 + §2.2 | PM-Office | 新增\"跳转目标配置失败\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①服务号菜单入口删除后用户 PV 跌幅 \u003e X%（实际数据采集后定阈值，Q-002）；②运营提出\"按用户分群差异化跳转\"诉求（升级 L2）。 | FACT | SRC-002 §2.1 + §2.2 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |\n\n## 0. 预检输入充分度判定\n\n- 上游产物：BG-001（confirmed，DEC-201）\n- 已确认角色数：4（受邀客人 / 运营 / FA / 业务方负责人）\n- 已知生命周期线索：3 个邀请模块（One On One / 图片邀请函 / 邀请携伴）× 2 个提示页（感谢您的出席 / 活动已结束）+ 服务号菜单 + My account page\n- 判定：充分模式（基于 BG-001 confirmed 直接展开旅程）\n\n## 1. 业务生命周期分解\n\n| 阶段 | 描述 | 触发事件 | 涉及角色 | 来源 |\n|---|---|---|---|---|\n| 邀请接收 | 受邀客人通过 3 个邀请路径之一（One On One / 图片邀请函 / 邀请携伴）接收活动邀请 | 业务方发起活动邀请 | 受邀客人 | SRC-002 §3（V1.2 未涉及本阶段变更）|\n| 活动预约 | 客人完成注册/登录、授权手机号、确认预约 | 客人点击邀请卡 / 扫描二维码 | 受邀客人 | SRC-002 §3 |\n| 活动进行 | 客人按预约时间参与活动 | 活动开始 | 受邀客人 / FA | SRC-002 §3 |\n| 活动结束落地 | 活动结束后客人进入\"感谢您的出席\"或\"活动已结束\"提示页 | 活动结束 + 客人已签到/未签到 | 受邀客人 | SRC-002 §2.1 |\n| **跳转引导（变更 1 落地）**| 客人点击\"即刻探索\"按钮，落地 FSN MP Home Page | 客人点击\"即刻探索\" | 受邀客人 | SRC-002 §2.1（FCT-001）|\n| 活动记录检索（变更 2 落地）| 客人通过 FSN MP 内 My account page 的\"我的活动\"入口查看活动记录 | 客人主动查看活动记录 | 受邀客人 | SRC-002 §2.2（FCT-002 / FCT-004）|\n| 服务号菜单浏览（变更 2 影响）| 客人在 FSN 服务号菜单中浏览，** | 客人进入 FSN 服务号 | 受邀客人 | SRC-002 §2.2（FCT-002）|\n\n\u003e 未覆盖的生命周期阶段（逻辑隐含但背景未描述）：注册失败流程 / CBDT 判断 / TKU page / 行程单详情（本次不涉及）\n\n## 2. 用户旅程图\n\n\u003e 按生命周期阶段（行）× 角色（列）组织。每个单元格包含：触发事件、动作、触点、痛点、期望结果。\n\n| 生命周期阶段 | 受邀客人（All users + InCHANEL clients）| 运营 | FA |\n|---|---|---|---|\n| 活动结束落地 | 触发：活动结束 + 已签到/未签到\u003cbr\u003e动作：进入\"感谢您的出席\"或\"活动已结束\"提示页\u003cbr\u003e触点：提示页底部 CTA\u003cbr\u003e痛点：跳转目标跨模块不一致（V1.2 之前）\u003cbr\u003e期望：跨 3 模块一致探索引导\u003cbr\u003e类型：normal\u003cbr\u003e来源：SRC-002 §2.1\u003cbr\u003e知识状态：FACT | 触发：—\u003cbr\u003e动作：—\u003cbr\u003e触点：—\u003cbr\u003e痛点：—\u003cbr\u003e期望：—\u003cbr\u003e类型：—\u003cbr\u003e来源：—\u003cbr\u003e知识状态：— | 触发：—\u003cbr\u003e动作：—\u003cbr\u003e触点：—\u003cbr\u003e痛点：—\u003cbr\u003e期望：—\u003cbr\u003e类型：—\u003cbr\u003e来源：—\u003cbr\u003e知识状态：— |\n| **跳转引导（变更 1）**| 触发：客人点击\"即刻探索\"\u003cbr\u003e动作：跳转至 FSN MP Home Page\u003cbr\u003e触点：提示页\"即刻探索\"按钮\u003cbr\u003e痛点：跳转目标不统一导致体验不一致（变更前）\u003cbr\u003e期望：100% 一致跳转至 FSN MP Home Page\u003cbr\u003e类型：normal\u003cbr\u003e来源：SRC-002 §2.1（FCT-001）\u003cbr\u003e知识状态：FACT | 触发：—\u003cbr\u003e动作：—\u003cbr\u003e触点：—\u003cbr\u003e痛点：—\u003cbr\u003e期望：—\u003cbr\u003e类型：—\u003cbr\u003e来源：—\u003cbr\u003e知识状态：— | 触发：—\u003cbr\u003e动作：—\u003cbr\u003e触点：—\u003cbr\u003e痛点：—\u003cbr\u003e期望：—\u003cbr\u003e类型：—\u003cbr\u003e来源：—\u003cbr\u003e知识状态：— |\n| 活动记录检索 | 触发：客人主动查看活动记录\u003cbr\u003e动作：进入 FSN MP → My account → 我的活动\u003cbr\u003e触点：FSN MP 内 My account page 的\"我的活动\"入口\u003cbr\u003e痛点：服务号菜单入口删除后部分老用户不知替代入口（Q-005）\u003cbr\u003e期望：单一事实入口，PV/UV 清晰可统计\u003cbr\u003e类型：normal\u003cbr\u003e来源：SRC-002 §2.2（FCT-002 / FCT-004）\u003cbr\u003e知识状态：FACT | 触发：活动结束 + 客人点击活动记录\u003cbr\u003e动作：配置跳转目标、调整服务号菜单入口\u003cbr\u003e触点：后台配置表/菜单管理\u003cbr\u003e痛点：运营指标口径不清（V1.2 之前）\u003cbr\u003e期望：单一事实入口（FSN MP 内 My account）\u003cbr\u003e类型：normal\u003cbr\u003e来源：SRC-002 §2.2（INF-001）\u003cbr\u003e知识状态：AI_INFERENCE | 触发：—\u003cbr\u003e动作：—\u003cbr\u003e触点：—\u003cbr\u003e痛点：—\u003cbr\u003e期望：—\u003cbr\u003e类型：—\u003cbr\u003e来源：—\u003cbr\u003e知识状态：— |\n| 服务号菜单浏览（变更 2 影响）| 触发：客人 -001（confirmed，DEC-301）\n- 已确认功能清单数：5（FEA-001~FEA-005），其中 P0 = 4\n- 判定：充分模式（基于 FEA-001 confirmed 直接展开主/支/异常流程）\n\n## 1. 范围引用（上游）\n\n\u003e 上游功能清单已在 feature-list 确认。本步骤只引用，不重新定义功能。\n\n| 引用 | 内容 |\n|---|---|\n| 上游功能清单 | FEA-001（confirmed，DEC-301）：跨模块跳转目标解析 / 跳转目标统一配置管理 / 服务号菜单入口移除 / FSN MP My account 入口保留 / 配置变更灰度发布能力 |\n| 上游故事 | US-001（confirmed，DEC-201）：ST-001 / ST-002 / ST-003 / ST-004 / ST-005 / ST-006 / ST-007 |\n\n## 2. 主流程（P0）\n\n\u003e 每个 P0 FEA 画一张主流程图（Mermaid）。P1 FEA-005 在 §6 简述。\n\n### 2.1 FEA-001 跨模块跳转目标解析（对应 ST-001 / ST-002）\n\n```mermaid\nflowchart TD\n    A[START 活动结束 + 客人进入提示页] --\u003e B[系统读取跳转目标配置\u003cbr/\u003e统一配置点\u003cbr/\u003eFEA-002]\n    B --\u003e C{配置存在且有效?\u003cbr/\u003eB-01}\n    C --\u003e|是| D[3 模块渲染一致的\u003cbr/\u003e'即刻探索'按钮]\n    C --\u003e|否| E[触发跳转目标配置错误兜底\u003cbr/\u003eEX-01 → 既有失败语义保持不变]\n    D --\u003e F[客人点击'即刻探索']\n    F --\u003e G[统一路由跳转至\u003cbr/\u003eFSN MP Home Page]\n    G --\u003e H[END 落地 FSN MP Home Page]\n    E --\u003e H\n\n    style A fill:#e1f5ff\n    style H fill:#d4edda\n    style E fill:#fff3cd\n```\n\n#### 步骤说明（FEA-001）\n\n| 步骤 | 操作 | 系统行为 | 涉及功能 FEA | 状态 | 备注 |\n|---|---|---|---|---|---|\n| 1 | 活动结束 + 客人进入提示页 | 系统识别 3 模块中的任意一个结束路径 | FEA-001 | 起点 | ST-001 来源；知识状态 FACT |\n| 2 | 读取跳转目标配置 | 系统从统一配置点读取跳转目标（同一活动同一配置）| FEA-001 + FEA-002 | 主流程 | DEC-103；知识状态 DECISION |\n| 3 | 渲染一致的\"即刻探索\"按钮 | 3 模块均按同一配置渲染按钮 | FEA-001 | 主流程 | ST-002 来源；知识状态 FACT |\n| 4 | 客人点击\"即刻探索\" | 系统执行统一路由跳转 | FEA-001 | 主流程 | 知识状态 FACT |\n| 5 | 落地 FSN MP Home Page | 系统完成跳转 | FEA-001 | 出口 | FCT-001；知识状态 FACT |\n\n### 2.2 FEA-002 跳转目标统一配置管理（对应 ST-003）\n\n```mermaid\nflowchart TD\n    A[START 运营登录后台] --\u003e B[进入跳转目标配置页]\n    B --\u003e C[查看当前配置\u003cbr/\u003e默认指向 FSN MP Home Page]\n    C --\u003e D{运营修改配置?\u003cbr/\u003eB-02}\n    D --\u003e|是| E[运营编辑跳转目标\u003cbr/\u003e输入 URL / 选择落地页]\n    D --\u003e|否| F[保持当前配置]\n    E --\u003e G[运营提交配置变更]\n    G --\u003e H{校验通过?\u003cbr/\u003eB-03}\n    H --\u003e|是| I[系统将新配置写入\u003cbr/\u003e统一配置点]\n    H --\u003e|否| J[触发配置错误兜底\u003cbr/\u003eEX-02 → 既有失败语义]\n    I --\u003e K{灰度发布?\u003cbr/\u003eB-04}\n    K --\u003e|是| L[按灰度策略生效\u003cbr/\u003eFEA-005]\n    K --\u003e|否| M[全量发布]\n    L --\u003e N[END 配置生效 + 3 模块同步]\n    M --\u003e N\n    F --\u003e N\n    J --\u003e N\n\n    style A fill:#e1f5ff\n    style N fill:#d4edda\n    style J fill:#fff3cd\n```\n\n#### 步骤说明（FEA-002）\n\n| 步骤 | 操作 | 系统行为 | 涉及功能 FEA | 状态 | 备注 |\n|---|---|---|---|---|---|\n| 1 | 运营登录后台 | 系统鉴权 | FEA-002 | 起点 | 知识状态 FACT |\n| 2 | 进入跳转目标配置页 | 系统展示当前配置 | FEA-002 | 主流程 | 知识状态 FACT |\n| 3 | 运营编辑配置 | 运营修改跳转目标 URL | FEA-002 | 主流程 | ST-003 来源；DEC-101；知识状态 DECISION |\n| 4 | 提交配置变更 | 系统校验配置合法性 | FEA-002 | 主流程 | 知识状态 AI_INFERENCE（运营交互细节见 interaction-rules，下游）|\n| 5 | 写入统一配置点 | 系统持久化配置变更 | FEA-002 | 主流程 | DEC-103；知识状态 DECISION |\n| 6 | 灰度发布 / 全量发布 | 按策略生效 | FEA-002 + FEA-005 | 主流程 | DEC-101；知识状态 DECISION |\n\n### 2.3 FEA-003 服务号菜单\"我的活动\"入口移除（对应 ST-006）\n\n```mermaid\nflowchart TD\n    A[START FSN 服务号后台配置] --\u003e B[运营进入菜单管理]\n    B --\u003e C{当前菜单存在\u003cbr/\u003e'我的活动'入口?\u003cbr/\u003eB-05}\n    C --\u003e|是| D[运营执行\u003cbr/\u003e'我的活动'入口下线]\n    C --\u003e|否| E[无需操作\u003cbr/\u003e直接结束]\n    D --\u003e F{下线生效成功?\u003cbr/\u003eB-06}\n    F --\u003e|是| G[菜单入口不可见\u003cbr/\u003e对所有客人生效]\n    F --\u003e|否| H[触发服务号后台错误兜底\u003cbr/\u003eEX-03 → 既有失败语义]\n    G --\u003e I[END 菜单入口收敛]\n    E --\u003e I\n    H --\u003e I\n\n    style A fill:#e1f5ff\n    style I fill:#d4edda\n    style H fill:#fff3cd\n```\n\n#### 步骤说明（FEA-003）\n\n| 步骤 | 操作 | 系统行为 | 涉及功能 FEA | 状态 | 备注 |\n|---|---|---|---|---|---|\n| 1 | FSN 服务号后台配置 | 系统进入菜单管理页 | FEA-003 | 起点 | 知识状态 FACT |\n| 2 | 运营执行\"我的活动\"入口下线 | 系统将入口标记为不可见 | FEA-003 | 主流程 | ST-006 来源；知识状态 FACT |\n| 3 | 菜单入口不可见 | 对所有客人生效 | FEA-003 | 主流程 | DEC-102；知识状态 DECISION |\n| 4 | 替代入口（FSN MP My account）保留 | My account 入口可达性不变 | FEA-004 | 出口 | FCT-004；知识状态 FACT |\n\n### 2.4 FEA-004 FSN MP My account 活动记录入口保留（对应 ST-004 / ST-007）\n\n```mermaid\nflowchart TD\n    A[START 客人想查看活动记录] --\u003e B{从 FSN 服务号菜单进入?\ 8 Q-008 已登记 |\n\n## 12. 版本变更摘要\n\n| 版本 | 变更原因 | 主要变化 | 人工确认状态 |\n|---|---|---|---|\n| v0.1 | 初始候选 | 首次生成（基于 FEA-001 confirmed；4 张 P0 主流程图 + 7 个分支 B-01~B-07 + 5 个异常 EX-01~EX-05；§6 P1 FEA-005 简述；§7 ASM-401 / INF-401 标记；§8 Q-008 登记）| DEC-401 待 human gate 决定 |"}, {"path": "002-product-requirements/05-business-rules/business-rules.md", "content": "---\nartifact_id: BR-001\nversion: \"v0.1\"\nstatus: confirmed\nquality_contract_version: \"1\"\nowner: PM-Office\nbusiness_fact_owner: 待填写（ISS-001，建议：FSN MP PM-Office）\ngoal_decision_owner: 待填写（ISS-001，建议：FSN 业务方负责人）\nreviewer: nova\ncreated_at: 2026-08-24\nupdated_at: 2026-08-24\nconfirmed_at: 2026-08-25T01:50:30+00:00\nupstream_artifact_id: \"FF-001（confirmed，DEC-401）\"\n---\n\n# 业务规则\n\n\u003e 规则撰写句式遵循 EARS（Easy Approach to Requirements Syntax）五句式，详见 `src/stages/002-product-requirements/skills/business-rules/references/ears-syntax.md`。\n\u003e 1. **普遍式（Ubiquitous）**：陈述句（无关键词），用于恒定不变的事实。\n\u003e 2. **事件驱动式（When）**：`当〈触发事件〉时`，用于有明确触发事件的场景。\n\u003e 3. **条件式（If）**：`如果〈条件〉，则`，用于有前置条件才成立的场景。\n\u003e 4. **状态式（While）**：`在〈状态〉期间`，用于特定状态窗口内的规则。\n\u003e 5. **可选式（As）**：`依据〈能力/数据〉`，用于能力或数据可选的场景。\n\u003e 本产物中 BR-001~BR-010 主要使用事件驱动式（When）与条件式（If），按需混用。\n\n## 产品质量增强记录\n\n| 项目 | 结论 | 知识状态 | 来源/位置 | 判断人 | 复核触发 |\n|---|---|---|---|---|---|\n| 受影响角色与结果 | 受邀客人（消费侧跳转一致性 + 入口收敛）；运营（配置方）。无 FA / 监管 / 合规角色影响。 | FACT | FF-001 §2 + SRC-002 §2.1 + §2.2 | PM-Office | 新增分群差异化引导或菜单入口重排时升级 L2 |\n| 采用方案与被排除替代 | 采用「跳转目标统一配置化 + 服务号菜单入口移除」。被排除替代：①硬编码跨 3 模块跳转；②服务号菜单入口替换为跳转链接。 | DECISION | FF-001 §2 + DEC-101/102/103 | PM-Office | 出现\"按用户分群差异化跳转\"需求时升级 L2 |\n| 价值-成本-风险 | 价值：跨 3 模块跳转体验一致 + 服务号菜单减少冗余降低误点击（Q-002）。成本：前端 3 模块共 ~6 处配置点（≤2 人天）；服务端跳转目标配置化 + 服务号菜单后台化（≤1 人天）。风险：跳转目标配置错误兜底（Q-003）+ 服务号菜单入口删除后用户路径缺失兜底（Q-004）。 | DECISION + AI_INFERENCE（量化数据为推断） | FF-001 §2 + BG-001 §5 | PM-Office | 上线后两周内采集跳转链路成功率 + 服务号菜单 PV/UV 变化验证 |\n| 失败边界与回退 | 既有失败语义不变；本次新增 2 类可观察行为（同模块同跳转目标、服务号菜单入口不可见）。回退：跳转目标配置可一键还原；服务号菜单入口可重新启用。 | FACT | FF-001 §4 + BG-001 §5 G-3 | PM-Office | 新增\"跳转目标配置失败\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①服务号菜单入口删除后用户 PV 跌幅 \u003e X%（Q-002）；②运营提出\"按用户分群差异化跳转\"诉求（升级 L2）。 | FACT | FF-001 §2 + BG-001 §5 G-3 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |\n\n## 0. 预检输入充分度判定\n\n- 上游产物：FF-001（confirmed，DEC-401）\n- 已确认功能流程数：4 P0（FEA-001 / FEA-002 / FEA-003 / FEA-004）+ 1 P1（FEA-005）\n- 判定：充分模式（基于 FF-001 confirmed 直接展开业务规则）\n\n## 1. 业务规则\n\n\u003e 计算/约束/条件/权限/时序规则。每条可执行，并填写可解释的追溯锚点：`FUN-XXX`、`FEA-XXX`、`ST/BR/STATE/SRC/BG/G-XXX`；跨功能规则填 `GLOBAL` 并保留来源。\n\n| ID | 规则描述 | 类型 | 触发条件 | 约束/逻辑 | 适用范围 / 追溯锚点 | 来源 |\n|---|---|---|---|---|---|---|\n| BR-001 | 当客人点击「即刻探索」按钮时，系统应从统一配置点读取跳转目标 | 条件 | 客人点击「即刻探索」 | 从统一配置点（而非模块硬编码）读取跳转目标；3 模块共享同一配置源 | FEA-001 | ST-001 / DEC-103 |\n| BR-002 | 同一活动同一客人在 3 模块（One On One / 图片邀请函 / 邀请携伴）下点击「即刻探索」时，系统的跳转结果必须一致 | 条件 | 同一活动同一客人跨模块点击 | 跨模块跳转结果 100% 一致（无任何模块特例或分支）| FEA-001 | ST-002 / FCT-001 |\n| BR-003 | 跳转目标配置的修改权限应仅授予运营角色 | 权限 | 运营进入后台 | 仅运营角色可读 / 写跳转目标配置；其他角色读权限受限或不可见 | FEA-002 | ST-003 / DEC-101 |\n| BR-004 | 若运营提交的跳转目标 URL 格式非法或目标页不可达，系统应拒绝写入并保留既有配置 | 约束 | 运营提交配置变更 | 服务端校验 URL 格式 + 目标页可达性；校验失败 → 不写入 + 提示错误 + 既有配置不变 + 运营可重新编辑配置后重新提交 | FEA-002 | EX-02 / DEC-101 |\n| BR-005 | 服务号菜单「我的活动」入口下线后，应对所有客人生效；入口状态在客人生效期内不应回退至可见 | 条件 | 服务号后台执行入口下线 | 下线对所有客人即时生效；不按用户分群；生效期内不回退 | FEA-003 | ST-006 / DEC-102 |\n| BR-006 | 服务号菜单入口下线操作应仅由 FSN 服务号后台执行；前端展示应以后台状态为准 | 权限 | 服务号后台执行入口下线 | 前端不应绕过或缓存入口状态；以后台配置为唯一真相源 | FEA-003 | ST-006 / FEA-003 §2.3 步骤 2 |\n| BR-007 | 服务号菜单「我的活动」入口下线后，FSN MP 内 My account page 的「我的活动」入口必须保持可达 | 条件 | 服务号菜单入口已下线 | 替代入口（FSN MP My account）必须仍可访问，作为唯一外部承接入口 | FEA-004 | ST-004 / DEC-102 / FCT-004 |\n| BR-008 | 跳转目标配置变更的发布顺序应为：服务端校验 → 写入统一配置点 → 按策略（灰度或全量）生效 | 时序 | 运营提交配置变更 | 校验未通过不得写入；写入后必须按发布策略生效；灰度策略由 FEA-005 承接 | FEA-002 + FEA-005 | DEC-101 / FF-001 §2.2 B-03 / B-04 |\n| BR-009 | 跳转目标配置变更应支持一键还原至变更前状态；服务号菜单入口应支持一键重新启用 | 约束 | 配置变更发布后任意时点 | 配置可还原至任意前序版本；入口可重新启用并即时生效 | 适用范围: GLOBAL | FF-001 §4 EX-01 / EX-03 / EX-05 / BG-001 §5 G-3 |\n| BR-010 | 配置变更灰度发布的用户分群策略定义不属于本期范围；如需实现，应升级 L2 触发条件 | 权限 | 配置变更走灰度发布路径 | 分群策略 = L2- 运营（配置方）。无 FA / 监管 / 合规角色影响。 | FACT | FF-001 §2 + SRC-002 §2.1 + §2.2 | PM-Office | 新增分群差异化引导或菜单入口重排时升级 L2 |\n| 采用方案与被排除替代 | 采用「跳转目标统一配置化 + 服务号菜单入口移除」。被排除替代：①硬编码跨 3 模块跳转；②服务号菜单入口替换为跳转链接。 | DECISION | FF-001 §2 + DEC-101/102/103 | PM-Office | 出现\"按用户分群差异化跳转\"需求时升级 L2 |\n| 价值-成本-风险 | 价值：跨 3 模块跳转体验一致 + 服务号菜单减少冗余降低误点击（Q-002）。成本：前端 3 模块共 ~6 处配置点（≤2 人天）；服务端跳转目标配置化 + 服务号菜单后台化（≤1 人天）。风险：跳转目标配置错误兜底（Q-003）+ 服务号菜单入口删除后用户路径缺失兜底（Q-004）。 | DECISION + AI_INFERENCE（量化数据为推断） | FF-001 §2 + BG-001 §5 | PM-Office | 上线后两周内采集跳转链路成功率 + 服务号菜单 PV/UV 变化验证 |\n| 失败边界与回退 | 既有失败语义不变；本次新增 2 类可观察行为（同模块同跳转目标、服务号菜单入口不可见）。回退：跳转目标配置可一键还原；服务号菜单入口可重新启用。 | FACT | FF-001 §4 + BG-001 §5 G-3 | PM-Office | 新增\"跳转目标配置失败\"等新失败路径时升级 L2 |\n| 可证伪条件/停止条件 | 停止条件：①服务号菜单入口删除后用户 PV 跌幅 \u003e X%（Q-002）；②运营提出\"按用户分群差异化跳转\"诉求（升级 L2）。 | FACT | FF-001 §2 + BG-001 §5 G-3 | PM-Office | 任一停止条件命中即暂停本次变更并重评 |\n\n## 0. 预检输入充分度判定\n\n- 上游产物：FF-001（confirmed，DEC-401）\n- 已确认功能流程数：4 P0（FEA-001 / FEA-002 / FEA-003 / FEA-004）+ 1 P1（FEA-005）\n- 判定：充分模式（基于 FF-001 confirmed 直接展开业务规则）\n\n## 1. 业务规则\n\n\u003e 计算/约束/条件/权限/时序规则。每条可执行，并填写可解释的追溯锚点：`FUN-XXX`、`FEA-XXX`、`ST/BR/STATE/SRC/BG/G-XXX`；跨功能规则填 `GLOBAL` 并保留来源。\n\n| ID | 规则描述 | 类型 | 触发条件 | 约束/逻辑 | 适用范围 / 追溯锚点 | 来源 |\n|---|---|---|---|---|---|---|\n| BR-001 | 当客人点击「即刻探索」按钮时，系统应从统一配置点读取跳转目标 | 条件 | 客人点击「即刻探索」 | 从统一配置点（而非模块硬编码）读取跳转目标；3 模块共享同一配置源 | FEA-001 | ST-001 / DEC-103 |\n| BR-002 | 同一活动同一客人在 3 模块（One On One / 图片邀请函 / 邀请携伴）下点击「即刻探索」时，系统的跳转结果必须一致 | 条件 | 同一活动同一客人跨模块点击 | 跨模块跳转结果 100% 一致（无任何模块特例或分支）| FEA-001 | ST-002 / FCT-001 |\n| BR-003 | 跳转目标配置的修改权限应仅授予运营角色 | 权限 | 运营进入后台 | 仅运营角色可读 / 写跳转目标配置；其他角色读权限受限或不可见 | FEA-002 | ST-003 / DEC-101 |\n| BR-004 | 若运营提交的跳转目标 URL 格式非法或目标页不可达，系统应拒绝写入并保留既有配置 | 约束 | 运营提交配置变更 | 服务端校验 URL 格式 + 目标页可达性；校验失败 → 不写入 + 提示错误 + 既有配置不变 + 运营可重新编辑配置后重新提交 | FEA-002 | EX-N（BR §2.5 承载；L1 不展开） / DEC-101 |\n| BR-005 | 服务号菜单「我的活动」入口下线后，应对所有客人生效；入口状态在客人生效期内不应回退至可见 | 条件 | 服务号后台执行入口下线 | 下线对所有客人即时生效；不按用户分群；生效期内不回退 | FEA-003 | ST-006 / DEC-102 |\n| BR-006 | 服务号菜单入口下线操作应仅由 FSN 服务号后台执行；前
